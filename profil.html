<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Butulka Baku - Profil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0d0914; font-family: sans-serif; color: white; height: 100vh; overflow: hidden; }
        .scrollbar-none::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="flex flex-col justify-between h-screen">

    <!-- TOP HEADER -->
    <header class="flex items-center justify-between px-4 py-3 bg-[#150f22] border-b border-[#231a38]">
        <div class="flex items-center gap-2">
            <div class="bg-gradient-to-r from-amber-500 to-yellow-400 text-black font-extrabold px-3 py-1 rounded-full text-xs shadow-md">
                👑 VIP
            </div>
        </div>
        <div class="flex items-center gap-4 text-gray-300 text-base">
            <i class="fa-solid fa-bell hover:text-yellow-400 cursor-pointer"></i>
            <i class="fa-solid fa-user hover:text-yellow-400 cursor-pointer"></i>
        </div>
    </header>

    <!-- MAIN CONTENT CONTAINER -->
    <main class="flex-1 overflow-y-auto p-4 space-y-4">
        
        <!-- STORIES ROW (Şəkildəki kimi hekayələr) -->
        <div>
            <div class="text-xs font-semibold text-gray-400 mb-2">Stories</div>
            <div class="flex gap-3 overflow-x-auto pb-1 scrollbar-none">
                <!-- Story 1 -->
                <div class="flex flex-col items-center flex-shrink-0 cursor-pointer">
                    <div class="w-14 h-14 rounded-full border-2 border-yellow-500 p-0.5 bg-gradient-to-tr from-yellow-500 to-amber-700">
                        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" class="w-full h-full object-cover rounded-full">
                    </div>
                    <span class="text-[9px] mt-1 bg-red-600 px-1.5 py-0.2 rounded-full font-bold text-white">VIP</span>
                </div>
                <!-- Story 2 -->
                <div class="flex flex-col items-center flex-shrink-0 cursor-pointer">
                    <div class="w-14 h-14 rounded-full border-2 border-yellow-500 p-0.5 bg-gradient-to-tr from-yellow-500 to-amber-700">
                        <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=150" class="w-full h-full object-cover rounded-full">
                    </div>
                    <span class="text-[9px] mt-1 bg-red-600 px-1.5 py-0.2 rounded-full font-bold text-white">VIP</span>
                </div>
                <!-- Story 3 -->
                <div class="flex flex-col items-center flex-shrink-0 cursor-pointer">
                    <div class="w-14 h-14 rounded-full border-2 border-yellow-500 p-0.5 bg-gradient-to-tr from-yellow-500 to-amber-700">
                        <img src="https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=150" class="w-full h-full object-cover rounded-full">
                    </div>
                    <span class="text-[9px] mt-1 bg-red-600 px-1.5 py-0.2 rounded-full font-bold text-white">VIP</span>
                </div>
                <!-- Story 4 -->
                <div class="flex flex-col items-center flex-shrink-0 cursor-pointer">
                    <div class="w-14 h-14 rounded-full border-2 border-yellow-500 p-0.5 bg-gradient-to-tr from-yellow-500 to-amber-700">
                        <img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=150" class="w-full h-full object-cover rounded-full">
                    </div>
                    <span class="text-[9px] mt-1 bg-red-600 px-1.5 py-0.2 rounded-full font-bold text-white">VIP</span>
                </div>
            </div>
        </div>

        <!-- USER IDENTITY BANNER (Şəkildəki profil paneli)[span_2](start_span)[span_2](end_span) -->
        <div class="bg-[#181124] border border-[#271d3a] rounded-2xl p-3 flex items-center justify-between shadow-lg">
            <div class="flex items-center gap-3">
                <div class="relative w-14 h-14 rounded-full overflow-hidden border-2 border-amber-500 bg-[#251b38] flex items-center justify-center">
                    <i class="fa-solid fa-wine-bottle text-2xl text-yellow-400"></i>
                    <div class="absolute bottom-0 right-0 w-3.5 h-3.5 bg-green-500 border-2 border-[#181124] rounded-full"></div>
                </div>
                <div>
                    <div class="flex items-center gap-1.5 text-yellow-400 font-bold text-sm">
                        <span>👑</span> <span id="profileName">| A | L | İ | K |</span>
                    </div>
                    <div class="text-[11px] text-gray-400 mt-0.5">ID: 1836</div>
                </div>
            </div>
            <button class="w-9 h-9 bg-[#221833] hover:bg-[#2c2042] rounded-xl flex items-center justify-center text-yellow-400 border border-[#34264d]">
                <i class="fa-solid fa-gear text-sm"></i>
            </button>
        </div>

        <!-- STATS GRID (Şəkildəki statistika xanaları)[span_3](start_span)[span_3](end_span) -->
        <div class="grid grid-cols-3 gap-2">
            <div class="bg-[#181124] border border-[#271d3a] p-2.5 rounded-2xl text-center">
                <div class="text-amber-400 mb-0.5"><i class="fa-solid fa-crown text-xs"></i></div>
                <div class="font-bold text-sm">1836</div>
                <div class="text-[10px] text-gray-400">Stak</div>
            </div>
            <div class="bg-[#181124] border border-[#271d3a] p-2.5 rounded-2xl text-center">
                <div class="font-bold text-sm mt-1">13</div>
                <div class="text-[10px] text-gray-400">Stak</div>
            </div>
            <div class="bg-[#181124] border border-[#271d3a] p-2.5 rounded-2xl text-center">
                <div class="font-bold text-sm mt-1">5</div>
                <div class="text-[10px] text-gray-400">Stak</div>
            </div>
            <div class="bg-[#181124] border border-[#271d3a] p-2.5 rounded-2xl text-center">
                <div class="font-bold text-sm mt-1">0</div>
                <div class="text-[10px] text-gray-400">Sili</div>
            </div>
            <div class="bg-[#181124] border border-[#271d3a] p-2.5 rounded-2xl text-center">
                <div class="font-bold text-sm mt-1">0</div>
                <div class="text-[10px] text-gray-400">Açə</div>
            </div>
            <div class="bg-[#181124] border border-[#271d3a] p-2.5 rounded-2xl text-center">
                <div class="font-bold text-sm mt-1">0</div>
                <div class="text-[10px] text-gray-400">Vülol</div>
            </div>
        </div>

        <!-- AKTİV OYUNLAR BÖLMƏSİ (Şəkildəki Butulka Baku kartı və `oyun.html` keçidi)[span_4](start_span)[span_4](end_span) -->
        <div>
            <h3 class="text-xs font-bold text-gray-400 mb-2">Aktiv Oyunlar</h3>
            
            <!-- Bu karta və ya düyməyə basanda oyun.html açılacaq -->
            <a href="oyun.html" class="block bg-gradient-to-r from-[#1d1226] to-[#2c1724] border border-amber-500/40 rounded-2xl p-3 shadow-xl hover:border-amber-400 transition cursor-pointer relative">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 rounded-xl bg-black/40 flex items-center justify-center border border-amber-500/30 flex-shrink-0">
                        <i class="fa-solid fa-wine-bottle text-2xl text-yellow-400"></i>
                    </div>
                    <div class="flex-1">
                        <h4 class="text-xs font-bold text-yellow-300">Butulka Baku (Masa 511)</h4>
                        <p class="text-[10px] text-gray-300 mt-0.5">Şüşəni fırlat, dostlarla əylən və tanış ol!</p>
                    </div>
                </div>
                <div class="mt-3 w-full bg-gradient-to-r from-amber-600 to-yellow-500 hover:from-amber-500 hover:to-yellow-400 text-black text-center font-bold text-xs py-2 rounded-xl shadow">
                    Oyna 🚀
                </div>
            </a>
        </div>

    </main>

    <!-- BOTTOM NAVIGATION BAR -->
    <nav class="bg-[#150f22] border-t border-[#231a38] py-2 px-6 flex items-center justify-between">
        <a href="profil.html" class="flex flex-col items-center text-yellow-400 cursor-pointer">
            <i class="fa-solid fa-house text-base"></i>
            <span class="text-[9px] mt-0.5">Ana səhifə</span>
        </a>
        <a href="oyun.html" class="flex flex-col items-center text-gray-400 hover:text-yellow-400 cursor-pointer">
            <i class="fa-solid fa-gamepad text-base"></i>
            <span class="text-[9px] mt-0.5">Oyunlar</span>
        </a>
        <div class="w-10 h-10 bg-gradient-to-tr from-amber-600 to-yellow-400 rounded-xl flex items-center justify-center text-black shadow-lg -mt-3 cursor-pointer">
            <i class="fa-solid fa-plus text-sm font-bold"></i>
        </div>
        <div class="flex flex-col items-center text-gray-400 relative cursor-pointer">
            <i class="fa-solid fa-comment text-base"></i>
            <span class="absolute -top-1 right-0 bg-red-500 text-white text-[8px] w-3.5 h-3.5 rounded-full flex items-center justify-center font-bold">1</span>
            <span class="text-[9px] mt-0.5">Mesajlar</span>
        </div>
        <div class="flex flex-col items-center text-gray-400 cursor-pointer">
            <i class="fa-solid fa-video text-base"></i>
            <span class="text-[9px] mt-0.5">Videolar</span>
        </div>
    </nav>

    <script>
        // Giriş edən istifadəçinin ləqəbini yaddaşdan oxuyub profildə yazmaq
        window.onload = function() {
            const user = localStorage.getItem('user_nick');
            if(user) {
                document.getElementById('profileName').innerText = user;
            }
        }
    </script>
</body>
</html>
