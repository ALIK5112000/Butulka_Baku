<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Butulka Baku - Profil</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f0b15; font-family: sans-serif; color: white; height: 100vh; overflow: hidden; }
    </style>
</head>
<body class="flex flex-col justify-between h-screen">

    <!-- TOP HEADER -->
    <header class="flex items-center justify-between px-4 py-3 bg-[#161022] border-b border-[#291f3d]">
        <div class="bg-gradient-to-r from-amber-500 to-yellow-400 text-black font-extrabold px-4 py-1.5 rounded-full text-xs shadow-md tracking-wider">
            👑 VIP
        </div>
        <div class="flex items-center gap-4 text-gray-300 text-lg">
            <i class="fa-solid fa-cart-shopping hover:text-yellow-400 cursor-pointer"></i>
            <i class="fa-solid fa-magnifying-glass hover:text-yellow-400 cursor-pointer"></i>
            <i class="fa-solid fa-headset hover:text-yellow-400 cursor-pointer"></i>
            <i class="fa-solid fa-bell hover:text-yellow-400 cursor-pointer"></i>
            <i class="fa-solid fa-palette hover:text-yellow-400 cursor-pointer"></i>
        </div>
    </header>

    <!-- MAIN CONTENT CONTAINER -->
    <main class="flex-1 overflow-y-auto p-4 space-y-4">
        <!-- Stories Row -->
        <div class="flex gap-4 overflow-x-auto pb-2">
            <div class="flex flex-col items-center flex-shrink-0 cursor-pointer">
                <div class="w-14 h-14 rounded-full border-2 border-dashed border-gray-500 flex items-center justify-center bg-[#1e162d]">
                    <i class="fa-solid fa-plus text-gray-400"></i>
                </div>
                <span class="text-[11px] mt-1 text-gray-300">Sənin</span>
            </div>
            <div class="flex flex-col items-center flex-shrink-0">
                <div class="w-14 h-14 rounded-full border-2 border-yellow-500 overflow-hidden p-0.5">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" class="w-full h-full object-cover rounded-full">
                </div>
                <span id="profileNameTop" class="text-[11px] mt-1 text-gray-300 truncate w-16 text-center">İstifadəçi</span>
            </div>
        </div>

        <!-- Profile Card (Şəkildəki dizayn)[span_3](start_span)[span_3](end_span) -->
        <div class="bg-[#191225] border border-[#2c2040] rounded-3xl p-5 shadow-xl relative">
            <div class="flex items-center gap-4">
                <div class="relative w-20 h-20 rounded-2xl overflow-hidden border-2 border-amber-500 shadow-md">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200" class="w-full h-full object-cover">
                    <div class="absolute bottom-1 right-1 bg-amber-600 rounded-full w-5 h-5 flex items-center justify-center text-[10px] text-white">
                        <i class="fa-solid fa-pen"></i>
                    </div>
                </div>
                <div>
                    <div class="flex items-center gap-1.5 bg-[#251b38] px-3 py-1 rounded-full border border-amber-500/30 w-fit mb-1">
                        <span id="profileNameCard" class="text-yellow-400 text-xs font-bold">👑 İstifadəçi</span>
                    </div>
                    <div class="flex items-center gap-2 text-xs text-gray-400">
                        <span class="bg-amber-500/20 text-yellow-300 px-2 py-0.5 rounded font-semibold text-[10px]">ID 1836</span>
                        <span class="bg-[#261d36] px-2.5 py-0.5 rounded text-gray-300 cursor-pointer hover:bg-[#322548]">Təsdiq al</span>
                    </div>
                </div>
            </div>

            <!-- Status -->
            <div class="mt-4 bg-[#140e1f] border border-[#261d36] rounded-2xl px-4 py-2.5 text-xs text-gray-400 flex items-center gap-2">
                <i class="fa-solid fa-pen text-gray-500"></i>
                <span>Status yaz...</span>
            </div>

            <!-- Stats Grid -->
            <div class="grid grid-cols-3 gap-3 mt-4">
                <div class="bg-[#140e1f] p-3 rounded-2xl border border-[#261d36]">
                    <i class="fa-solid fa-heart text-red-500 text-sm mb-1"></i>
                    <div class="font-bold text-sm text-white">7.6k</div>
                    <div class="text-[10px] text-gray-400">Ürək</div>
                </div>
                <div class="bg-[#140e1f] p-3 rounded-2xl border border-[#261d36]">
                    <i class="fa-solid fa-gem text-cyan-400 text-sm mb-1"></i>
                    <div class="font-bold text-sm text-white">1.4k</div>
                    <div class="text-[10px] text-gray-400">Kristal</div>
                </div>
                <div class="bg-[#140e1f] p-3 rounded-2xl border border-[#261d36]">
                    <i class="fa-solid fa-user-group text-purple-400 text-sm mb-1"></i>
                    <div class="font-bold text-sm text-white">1</div>
                    <div class="text-[10px] text-gray-400">Dostlar</div>
                </div>
            </div>
        </div>

        <!-- OYUN KARTI (Spin the Bottle şəkli və keçid)[span_4](start_span)[span_4](end_span)[span_5](start_span)[span_5](end_span) -->
        <div class="mt-4">
            <h3 class="text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">Oyunlar</h3>
            <a href="oyun.html" class="block bg-gradient-to-r from-[#2c1810] to-[#4a2e1b] border border-amber-500/40 rounded-2xl p-4 shadow-lg hover:border-amber-400 transition cursor-pointer relative overflow-hidden">
                <div class="flex items-center gap-4">
                    <div class="w-16 h-16 rounded-xl bg-black/40 flex items-center justify-center border border-amber-500/30 flex-shrink-0">
                        <i class="fa-solid fa-wine-bottle text-3xl text-yellow-400"></i>
                    </div>
                    <div>
                        <h4 class="text-sm font-bold text-yellow-300">Spin the Bottle (Masa 511)</h4>[span_6](start_span)[span_6](end_span)
                        <p class="text-[11px] text-gray-300 mt-1">Şüşəni fırlat, əyləncəyə qoşul!</p>
                        <span class="inline-block mt-2 bg-amber-600 hover:bg-amber-500 text-black text-[10px] font-bold px-3 py-1 rounded-full">Oyuna Keç 🚀</span>
                    </div>
                </div>
            </a>
        </div>
    </main>

    <!-- BOTTOM NAVIGATION BAR[span_7](start_span)[span_7](end_span) -->
    <nav class="bg-[#161022] border-t border-[#291f3d] py-2 px-6 flex items-center justify-between">
        <a href="profil.html" class="flex flex-col items-center text-yellow-400 cursor-pointer">
            <i class="fa-solid fa-house text-lg"></i>
            <span class="text-[10px] mt-1">Ana səhifə</span>
        </a>
        <a href="oyun.html" class="flex flex-col items-center text-gray-400 hover:text-yellow-400 cursor-pointer">
            <i class="fa-solid fa-gamepad text-lg"></i>
            <span class="text-[10px] mt-1">Oyunlar</span>
        </a>
        <div class="w-12 h-12 bg-gradient-to-tr from-amber-600 to-yellow-400 rounded-2xl flex items-center justify-center text-black shadow-lg -mt-4 cursor-pointer">
            <i class="fa-solid fa-plus text-lg font-bold"></i>
        </div>
        <div class="flex flex-col items-center text-gray-400 relative cursor-pointer">
            <i class="fa-solid fa-comment text-lg"></i>
            <span class="absolute -top-1 right-0 bg-red-500 text-white text-[9px] w-4 h-4 rounded-full flex items-center justify-center font-bold">1</span>
            <span class="text-[10px] mt-1">Mesajlar</span>
        </div>
        <div class="flex flex-col items-center text-gray-400 cursor-pointer">
            <i class="fa-solid fa-video text-lg"></i>
            <span class="text-[10px] mt-1">Videolar</span>
        </div>
    </nav>

    <script>
        window.onload = function() {
            const user = localStorage.getItem('user_nick');
            if(user) {
                document.getElementById('profileNameTop').innerText = user;
                document.getElementById('profileNameCard').innerText = "👑 " + user;
            }
        }
    </script>
</body>
</html>
