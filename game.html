<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Butulka Baku - Oyun Masası</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    display:flex;flex-direction:column;height:100vh;height:100dvh;background:#14141e;color:#fff;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;
  }

  /* ===== Yuxarı panel ===== */
  .top{
    flex:0 0 48px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;
    background:linear-gradient(#a8631f,#8a4d14);border-bottom:2px solid #5d3209;
  }
  .badges{display:flex;gap:6px;align-items:center;min-width:96px}
  .badges.r{justify-content:flex-end}
  .badge{background:#0006;border:1px solid #fff3;border-radius:999px;padding:4px 10px;font-weight:700;font-size:14px;white-space:nowrap}
  .tableNo{font-weight:700;font-size:15px;text-shadow:0 1px 2px #0008}
  .icon{width:36px;height:36px;border:0;border-radius:50%;background:#0006;color:#fff;font-size:18px;cursor:pointer}
  .icon:disabled{opacity:.5}

  /* ===== Oyun sahəsi ===== */
  .arena{
    flex:0 0 auto;position:relative;display:flex;justify-content:center;padding:8px 0;
    background:repeating-linear-gradient(90deg,#c58a4a 0 22px,#b97d3d 22px 24px,#cf9655 24px 47px,#bd8142 47px 49px);
    border-bottom:4px solid #522d08;
  }
  .stage{
    position:relative;width:min(100%,calc(54vh / 1.1));width:min(100%,calc(54dvh / 1.1));aspect-ratio:1 / 1.1;
  }
