<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <title>Butulka Baku - 12 Nəfərlik Masa</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            /* Şəkildəki kimi isti taxta fon rəngi */
            background: linear-gradient(135deg, #c88a4b 0%, #8b5420 100%);
            color: #fff;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Yuxarı Panel (Şəkildəki kimi balans, otaq nömrəsi və çıxış) */
        .top-bar {
            position: absolute;
            top: 15px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }
        .badge {
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* Dairəvi Taxta Masa */
        .table-container {
            position: relative;
            width: 650px;
            height: 650px;
            background: radial-gradient(circle, #b87333 0%, #704214 100%);
            border: 8px solid #522d08;
            border-radius: 50%;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6), inset 0 0 60px rgba(0,0,0,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Ortadakı Şüşə və Yazı */
        .center-area {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            text-align: center;
        }
        .center-text {
            margin-top: 100px;
            font-size: 15px;
            font-weight: bold;
            color: #ffeb3b;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .bottle {
            width: 40px;
            height: 120px;
            background: #111;
            border: 2px solid #d4af37;
            border-radius: 20px 20px 5px 5px;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .bottle::before {
            content: 'VIP';
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            color: #d4af37;
            font-weight: bold;
        }

        /* Oyunçu Slotları (12 ədəd dairəvi yer) */
        .player-slot {
            position: absolute;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            border: 3px solid #ffcc40;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            transition: 0.3s;
        }
        .player-slot img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }
        .player-name {
            position: absolute;
            bottom: -18px;
            background: rgba(0,0,0,0.7);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <!-- Yuxarı Məlumat Paneli -->
    <div class="top-bar">
        <div class="badge">❤️ 4968</div>
        <div class="badge">#17 Masa</div>
        <div class="badge">🚪 Çıxış</div>
    </div>

    <!-- 12 Nəfərlik Stol -->
    <div class="table-container" id="tableContainer">
        
        <!-- Mərkəzdə Şüşə və Yazı -->
        <div class="center-area">
            <div class="bottle" id="bottle"></div>
            <div class="center-text">Oyuna başlamaq üçün qızları gözləyirik</div>
        </div>

    </div>

    <script>
        // Masanın ətrafında 12 nəfərlik slotların avtomatik dairəvi düzülməsi
        const tableContainer = document.getElementById('tableContainer');
        const totalSlots = 12;
        const radius = 250; // Masanın mərkəzindən slotlara olan məsafə
        const centerX = 325; // Masanın mərkəzi X (650 / 2)
        const centerY = 325; // Masanın mərkəzi Y (650 / 2)

        // Nümunə olaraq bəzi yerlərə oyunçu qoyaq, qalanları boş olsun (bos yerlər + yazısı)
        const mockPlayers = {
            0: { name: "Əli", avatar: "https://via.placeholder.com/65" }, // 1-ci yerdə Əli oturub
            3: { name: "Aysel", avatar: "https://via.placeholder.com/65" } // 4-cü yerdə Aysel oturub
        };

        for (let i = 0; i < totalSlots; i++) {
            // Hər bir slot üçün bucağın hesablanması (360 dərəcə / 12)
            const angle = (i / totalSlots) * 2 * Math.PI - Math.PI / 2; // Yuxarıdan başlasın deyə -PI/2
            const x = centerX + radius * Math.cos(angle) - 32.5;
            const y = centerY + radius * Math.sin(angle) - 32.5;

            const slot = document.createElement('div');
            slot.className = 'player-slot';
            slot.style.left = `${x}px`;
            slot.style.top = `${y}px`;

            if (mockPlayers[i]) {
                // Əgər bu yerdə oyunçu varsa
                slot.innerHTML = `
                    <img src="${mockPlayers[i].avatar}" alt="Avatar">
                    <div class="player-name">${mockPlayers[i].name}</div>
                `;
                slot.style.borderColor = '#00ffcc'; // Dolu yer yaşıl/mavi çərçivə
            } else {
                // Boş yer (oturmaq üçün)
                slot.innerHTML = `<span style="font-size: 18px; color: #aaa;">+</span>`;
                slot.style.border = '2px dashed rgba(255,255,255,0.4)';
            }

            tableContainer.appendChild(slot);
        }
    </script>
</body>
</html>
