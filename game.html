
<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Butulka Baku - Oyun</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#eee;color:#222;overflow-x:hidden}
button{cursor:pointer;border:0;font:inherit}
.top{
height:76px;background:linear-gradient(#9b5a24,#663713);
display:flex;align-items:center;justify-content:space-around;
color:white;box-shadow:0 3px 9px #0005;position:relative;z-index:5
}
.top button{background:#ffffff20;color:white;border-radius:50%;width:43px;height:43px;font-size:21px}
.heart-count{font-size:21px;font-weight:bold;color:white}
.top-info{font-size:12px;text-align:center}
.table-area{
height:510px;position:relative;overflow:hidden;
background:
radial-gradient(ellipse at 50% 50%,#c68a45 0%,#a7682f 60%,#80451e 100%);
background-image:
repeating-linear-gradient(0deg,transparent 0 55px,#74421c20 56px 58px),
linear-gradient(100deg,#a96a30,#d69b53 50%,#995a27);
border-bottom:4px solid #74421d;
}
.table-area:before{
content:"";position:absolute;inset:0;opacity:.18;
background:repeating-radial-gradient(ellipse at 40% 40%,transparent 0 45px,#623717 47px 49px,transparent 52px 95px);
pointer-events:none
}
.room-label{position:absolute;top:13px;right:15px;color:#fff;font-weight:bold;text-shadow:0 2px 4px #000}
.seat{
position:absolute;width:105px;text-align:center;color:white;
text-shadow:0 2px 4px #000;font-size:13px;z-index:2
}
.avatar{
width:76px;height:76px;border-radius:12px;
background:linear-gradient(140deg,#4b3b59,#15121d);
border:3px solid #e8bd82;
display:flex;align-items:center;justify-content:center;
font-size:34px;margin:auto auto 5px;box-shadow:0 4px 9px #0007;
overflow:hidden
}
.seat.me .avatar{border:3px solid #ffd54d}
.seat-name{font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat:nth-of-type(1){left:8px;top:110px}
.seat:nth-of-type(2){right:8px;top:110px}
.seat:nth-of-type(3){left:8px;bottom:20px}
.seat:nth-of-type(4){right:8px;bottom:20px}
.center-game{
position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
text-align:center;width:170px;z-index:1
}
.bottle{
font-size:95px;display:inline-block;
filter:drop-shadow(0 7px 5px #0008);
transform-origin:center;
}
.bottle.spin{animation:spinBottle 2s cubic-bezier(.12,.75,.3,1) forwards}
@keyframes spinBottle{from{transform:rotate(0deg)}to{transform:rotate(1440deg)}}
.center-text{font-size:15px;font-weight:bold;color:white;text-shadow:0 2px 4px #000;margin-top:8px}
.action-bar{
display:flex;justify-content:center;align-items:center;gap:12px;
padding:15px;background:#fff;box-shadow:0 2px 8px #0002
}
.spin-btn{
background:linear-gradient(135deg,#ff9b36,#d46b17);
color:white;padding:15px 30px;border-radius:30px;font-size:18px;font-weight:bold;
box-shadow:0 4px 10px #0003
}
.spin-btn:disabled{opacity:.5}
.secondary{background:#eee;padding:12px;border-radius:50%;font-size:22px}
.chat{
background:#f5f5f5;min-height:220px;padding:15px 12px 85px
}
.chat-title{font-weight:bold;color:#9a642e;margin-bottom:12px}
.messages{height:145px;overflow-y:auto;display:flex;flex-direction:column;gap:9px}
.msg{background:white;border-radius:12px;padding:10px 12px;max-width:95%;font-size:14px;line-height:1.4;box-shadow:0 1px 3px #0001}
.msg b{color:#267aa3}
.chat-input{
position:fixed;bottom:0;left:0;right:0;z-index:10;
background:white;display:flex;gap:7px;padding:10px;
border-top:1px solid #ddd
}
.chat-input input{flex:1;min-width:0;padding:13px;border:0;background:#f2f2f2;border-radius:25px;font-size:15px;outline:none}
.send{background:#f2a33d;color:white;width:46px;border-radius:50%;font-size:21px}
.modal-bg{
display:none;position:fixed;inset:0;background:#0009;z-index:30;
align-items:center;justify-content:center;padding:15px
}
.modal{
background:white;width:100%;max-width:440px;max-height:85vh;overflow:auto;
border-radius:22px;padding:22px;color:#222;box-shadow:0 10px 35px #0005
}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.modal-head h2{font-size:21px;color:#9b5a24}
.close{background:#f1f1f1;border-radius:50%;width:34px;height:34px;font-size:22px}
.field{width:100%;padding:13px;border:1px solid #bbb;border-radius:10px;margin:10px 0;font-size:16px}
.orange-btn{width:100%;padding:13px;background:#e69a3e;color:white;border-radius:10px;font-weight:bold;margin-top:8px}
.purple-btn{background:linear-gradient(90deg,#8352d6,#ce399c);color:white;padding:15px;border-radius:12px;width:100%;font-weight:bold;margin-top:12px}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid #eee}
.list-avatar{width:48px;height:48px;border-radius:10px;background:#ddd;display:flex;align-items:center;justify-content:center;font-size:24px}
.list-info{flex:1}
.list-info small{display:block;color:#888;margin-top:4px}
.price-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.price-item{background:#fff4e9;border:1px solid #f0d6ba;border-radius:14px;padding:17px 8px;text-align:center}
.price-item strong{display:block;color:#e05c26;font-size:22px;margin:8px}
.price-item button{background:#9acb37;color:white;padding:9px 18px;border-radius:8px}
.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:12px}
.tabs button{padding:10px 13px;background:#eee;border-radius:10px;white-space:nowrap}
.tabs button.active{background:#e69a3e;color:white}
.menu-row{padding:15px;border-bottom:1px solid #eee;font-size:17px;cursor:pointer}
.toast{
position:fixed;top:90px;left:50%;transform:translateX(-50%);
background:#28202e;color:white;padding:12px 20px;border-radius:20px;
z-index:99;display:none;white-space:nowrap;box-shadow:0 4px 15px #0005
}
@media(max-width:380px){
.top button{width:37px;height:37px;font-size:18px}
.seat{width:90px}
.avatar{width:65px;height:65px}
.center-game{width:130px}
.bottle{font-size:78px}
}
</style>
</head>
<body>

<header class="top">
 <div class="heart-count">❤️ <span id="heartBalance">7624</span></div>
 <button onclick="openModal('shop')">🎟</button>
 <button onclick="openModal('wheel')">🎡</button>
 <button onclick="openModal('rating')">🏆</button>
 <button onclick="openModal('menu')">☰</button>
 <button onclick="openModal('settings')">⚙️</button>
 <button onclick="leaveRoom()">↪</button>
 <div class="top-info">Masa<br><b id="roomNumber">511</b></div>
 <button onclick="openModal('tables')">🔄</button>
</header>

<main>
 <section class="table-area">
  <div class="room-label">🍾 BUTULKA BAKU</div>
  <div id="seats"></div>
  <div class="center-game">
   <div class="bottle" id="bottle">🍾</div>
   <div class="center-text" id="gameStatus">Oyunçular gözlənilir</div>
  </div>
 </section>

 <div class="action-bar">
  <button class="secondary" onclick="react('❤️')">❤️</button>
  <button class="secondary" onclick="react('😘')">😘</button>
  <button class="spin-btn" id="spinBtn" onclick="spinBottle()">🍾 Fırlat</button>
  <button class="secondary" onclick="openModal('players')">👥</button>
 </div>

 <section class="chat">
  <div class="chat-title">💬 Masa söhbəti · <span id="playerCount">1</span> oyunçu</div>
  <div class="messages" id="messages">
   <div class="msg"><b>Admin:</b> Butulka Baku oyununa xoş gəlmisiniz! 🍾</div>
  </div>
 </section>
</main>

<div class="chat-input">
 <input id="chatText" placeholder="Mesajı bura yaz..." maxlength="300"
 onkeydown="if(event.key==='Enter')sendMessage()">
 <button class="send" onclick="sendMessage()">➤</button>
</div>

<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
 <div class="modal">
  <div class="modal-head">
   <h2 id="modalTitle">Menyu</h2>
   <button class="close" onclick="closeModal()">×</button>
  </div>
  <div id="modalBody"></div>
 </div>
</div>

<div class="toast" id="toast"></div>

<script>
const saved = JSON.parse(localStorage.getItem("currentUser") || "{}");

let me = {
 name: saved.username || "Alik",
 id: saved.id || 511,
 hearts: Number(saved.hearts ?? 7624),
 jetons: Number(saved.jetons ?? 1400),
 vip: saved.vip || false
};

let room = Number(localStorage.getItem("bakuRoom") || 511);
let players = [
 {name:me.name,id:me.id,emoji:"👤",me:true},
 {name:"Masa gözləyir",id:0,emoji:"➕"},
 {name:"Boş yer",id:0,emoji:"➕"},
 {name:"Boş yer",id:0,emoji:"➕"}
];
let spinning=false;
let chatHistory=[];

const $ = id => document.getElementById(id);

function save(){
 localStorage.setItem("bakuRoom",room);
 $("heartBalance").textContent=me.hearts.toLocaleString("en-US");
 const current=JSON.parse(localStorage.getItem("currentUser")||"{}");
 Object.assign(current,{hearts:me.hearts,jetons:me.jetons});
 localStorage.setItem("currentUser",JSON.stringify(current));
}

function toast(text){
 const el=$("toast");
 el.textContent=text;
 el.style.display="block";
 clearTimeout(window.toastTimer);
 window.toastTimer=setTimeout(()=>el.style.display="none",2500);
}

function render(){
 $("roomNumber").textContent=room;
 $("playerCount").textContent=players.filter(p=>p.id).length;
 $("seats").innerHTML="";
 players.slice(0,4).forEach((p,i)=>{
  const div=document.createElement("div");
  div.className="seat "+(p.me?"me":"");
  div.style.left=i%2===0?"8px":"auto";
  div.style.right=i%2===1?"8px":"auto";
  div.style.top=i<2?"110px":"auto";
  div.style.bottom=i>=2?"20px":"auto";
  const avatar=document.createElement("div");
  avatar.className="avatar";
  avatar.textContent=p.emoji;
  const name=document.createElement("div");
  name.className="seat-name";
  name.textContent=p.name;
  div.append(avatar,name);
  div.onclick=()=>p.id?showPlayer(p):joinSeat(i);
  $("seats").appendChild(div);
 });
 save();
}

function spinBottle(){
 if(spinning)return;
 if(players.filter(p=>p.id).length<2){
  toast("Butulkanı fırlatmaq üçün ən azı 2 oyunçu lazımdır!");
  return;
 }
 spinning=true;
 $("spinBtn").disabled=true;
 $("gameStatus").textContent="Butulka fırlanır...";
 const bottle=$("bottle");
 bottle.classList.remove("spin");
 void bottle.offsetWidth;
 bottle.classList.add("spin");
 setTimeout(()=>{
  const occupied=players.filter(p=>p.id);
  const selected=occupied[Math.floor(Math.random()*occupied.length)];
  bottle.classList.remove("spin");
  $("gameStatus").textContent="💋 "+selected.name+" seçildi!";
  addMessage("Sistem","🍾 Butulka "+selected.name+" oyunçusunu seçdi!");
  toast("💋 Seçilən oyunçu: "+selected.name);
  spinning=false;
  $("spinBtn").disabled=false;
 },2100);
}

function joinSeat(index){
 if(players[index].id){return}
 const name=prompt("Oyunçu adını daxil et:");
 if(!name)return;
 players[index]={name:name.slice(0,20),id:Date.now(),emoji:"🙂"};
 render();
 addMessage("Sistem",name+" masaya qoşuldu! 🎉");
}

function showPlayer(p){
 openModal("player");
 $("modalTitle").textContent="Oyunçu profili";
 $("modalBody").innerHTML=`
 <div style="text-align:center;padding:15px">
 <div style="font-size:65px">${p.emoji}</div>
 <h2>${escapeHTML(p.name)}</h2>
 <p style="color:#888;margin:8px">ID: ${p.id}</p>
 <p>❤️ Oyunçu</p>
 <button class="orange-btn" onclick="closeModal()">Bağla</button>
 </div>`;
}

function escapeHTML(s){
 return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function sendMessage(){
 const input=$("chatText");
 const msg=input.value.trim();
 if(!msg)return;
 addMessage(me.name,msg);
 input.value="";
}

function addMessage(name,msg){
 const el=document.createElement("div");
 el.className="msg";
 const b=document.createElement("b");
 b.textContent=name+": ";
 el.append(b,document.createTextNode(msg));
 $("messages").append(el);
 $("messages").scrollTop=$("messages").scrollHeight;
}

function react(emoji){
 addMessage(me.name,emoji);
}

function openModal(type){
 const body=$("modalBody");
 const title=$("modalTitle");
 $("modalBg").style.display="flex";

 if(type==="tables"){
  title.textContent="🔄 Masa dəyiş";
  body.innerHTML=`
   <p style="color:#999">Masa axtar</p>
   <input class="field" id="tableSearch" type="number" placeholder="Masa nömrəsi, məs. 666">
   <button class="orange-btn" onclick="searchRoom()">Get</button>
   <button class="orange-btn" onclick="randomRoom()">🎲 Təsadüfi seçilmiş masa!</button>
   <button class="purple-btn" onclick="createRoom()">👑 Masa yarat / Mənim masam</button>
   <h3 style="margin-top:20px">Son masalar</h3>
   <div class="list-row" onclick="changeRoom(1)">🍾 Masa #1</div>
   <div class="list-row" onclick="changeRoom(14)">🍾 Masa #14</div>
   <div class="list-row" onclick="changeRoom(511)">🍾 Masa #511</div>`;
 }
 else if(type==="shop"){
  title.textContent="❤️ Ürəklər satın al";
  body.innerHTML=`
   <div class="price-grid">
    ${[[105,100],[270,250],[575,500],[1200,1000],[6500,5000],[14000,10000]].map(x=>`
     <div class="price-item">
      <div>❤️ Ürək paketi</div>
      <strong>${x[0].toLocaleString("en-US")}</strong>
      <button onclick="buyHearts(${x[0]},${x[1]})">${x[1]} 🪙</button>
     </div>`).join("")}
   </div>
   <p style="color:#999;font-size:12px;margin-top:15px">Demo mağazadır. Real ödəniş hələ qoşulmayıb.</p>`;
 }
 else if(type==="rating"){
  title.textContent="🏆 Reytinqlər";
  body.innerHTML=`
   <div class="tabs">
    <button class="active">💋 Öpüşlər</button>
    <button onclick="toast('Musiqi reytinqi tezliklə')">🎵 Musiqi</button>
    <button onclick="toast('Ürəklər reytinqi tezliklə')">❤️ Ürəklər</button>
   </div>
   <div class="list-row">🥇 👑 Birinci oyunçu <b>2 629 671</b></div>
   <div class="list-row">🥈 ⭐ İkinci oyunçu <b>1 126 597</b></div>
   <div class="list-row">🥉 💎 Üçüncü oyunçu <b>1 105 872</b></div>
   <div class="list-row">👤 ${escapeHTML(me.name)} <b>0</b></div>`;
 }
 else if(type==="players"){
  title.textContent="👥 Masa oyunçuları";
  body.innerHTML=players.map(p=>`
   <div class="list-row">
    <div class="list-avatar">${p.emoji}</div>
    <div class="list-info"><b>${escapeHTML(p.name)}</b><small>ID: ${p.id||"Boş yer"}</small></div>
   </div>`).join("");
 }
 else if(type==="menu"){
  title.textContent="☰ Oyun menyusu";
  body.innerHTML=`
   <div class="menu-row" onclick="openModal('achievements')">🏅 Nailiyyətlər</div>
   <div class="menu-row" onclick="openModal('rating')">🏆 Reytinqlər</div>
   <div class="menu-row" onclick="openModal('bottle')">🍾 Butulka</div>
   <div class="menu-row" onclick="toast('Dəvət sistemi hazırlanır')">💌 Dostunu dəvət et</div>
   <div class="menu-row" onclick="openModal('background')">🎨 Masa fonu</div>
   <div class="menu-row" onclick="openModal('style')">🖼 Tərz</div>
   <div class="menu-row" onclick="toast('Busterlər tezliklə')">⚡ Busterlər</div>`;
 }
 else if(type==="settings"){
  title.textContent="⚙️ Parametrlər";
  body.innerHTML=`
   <div class="menu-row" onclick="toggleSound()">🔊 Səs: <span id="soundStatus">Açıq</span></div>
   <div class="menu-row" onclick="toast('Dil parametrləri hazırlanır')">🌐 Dil</div>
   <div class="menu-row" onclick="toast('Bildirişlər hazırlanır')">🔔 Bildirişlər</div>`;
 }
 else if(type==="wheel"){
  title.textContent="🎡 Şans çarxı";
  body.innerHTML=`
   <div style="text-align:center;padding:25px">
    <div style="font-size:85px">🎡</div>
    <h3>Şansını yoxla!</h3>
    <p style="margin:12px;color:#888">Bir dəfə fırlatmaq 50 jetondur.</p>
    <button class="orange-btn" onclick="spinWheel()">Fırlat · 50 🪙</button>
   </div>`;
 }
 else if(type==="achievements"){
  title.textContent="🏅 Nailiyyətlər";
  body.innerHTML=`
   <div class="list-row">🥉 İlk masa — oyuna qoşul</div>
   <div class="list-row">💋 İlk öpüş — ilk seçimini qazan</div>
   <div class="list-row">👥 Tanışlıq — 10 oyunçu ilə tanış ol</div>
   <div class="list-row">👑 VIP — VIP status əldə et</div>`;
 }
 else if(type==="bottle"){
  title.textContent="🍾 Butulka";
  body.innerHTML=`
   <div class="list-row">🍾 Klassik butulka <b>Aktiv</b></div>
   <div class="list-row">🥂 Qızılı butulka <b>Tezliklə</b></div>`;
 }
 else if(type==="background"){
  title.textContent="🎨 Masa fonu";
  body.innerHTML=`
   <div class="list-row" onclick="setBackground(1)">🪵 Taxta masa</div>
   <div class="list-row" onclick="setBackground(2)">🌌 Gecə</div>
   <div class="list-row" onclick="setBackground(3)">💜 Bənövşəyi</div>`;
 }
 else if(type==="style"){
  title.textContent="🖼 Tərz";
  body.innerHTML=`<div class="list-row">👤 Avatar tərzi tezliklə</div>`;
 }
}

function closeModal(){$("modalBg").style.display="none"}

function changeRoom(n){
 room=n;
 players=[
  {name:me.name,id:me.id,emoji:"👤",me:true},
  {name:"Boş yer",id:0,emoji:"➕"},
  {name:"Boş yer",id:0,emoji:"➕"},
  {name:"Boş yer",id:0,emoji:"➕"}
 ];
 render();closeModal();
 toast("Masa #"+room+" açıldı");
}

function searchRoom(){
 const n=Number($("tableSearch").value);
 if(!n||n<1){toast("Düzgün masa nömrəsi yaz");return}
 changeRoom(n);
}

function randomRoom(){
 changeRoom(Math.floor(Math.random()*9999)+1);
}

function createRoom(){
 changeRoom(Math.floor(Math.random()*9000)+1000);
 toast("Yeni masa yaradıldı!");
}

function leaveRoom(){
 if(confirm("Masanı tərk etmək istəyirsən?")){
  changeRoom(511);
 }
}

function buyHearts(amount,cost){
 if(me.jetons<cost){toast("Jetonların kifayət etmir!");return}
 me.jetons-=cost;
 me.hearts+=amount;
 save();closeModal();
 toast("❤️ "+amount+" ürək hesabına əlavə edildi!");
}

function spinWheel(){
 if(me.jetons<50){toast("Jetonların kifayət etmir");return}
 me.jetons-=50;
 const prizes=[10,20,50,100,200];
 const prize=prizes[Math.floor(Math.random()*prizes.length)];
 me.hearts+=prize;
 save();closeModal();
 toast("🎉 "+prize+" ürək qazandın!");
}

function toggleSound(){
 const el=$("soundStatus");
 if(el)el.textContent=el.textContent==="Açıq"?"Bağlı":"Açıq";
}

function setBackground(n){
 const area=document.querySelector(".table-area");
 if(n===1)area.style.background="linear-gradient(100deg,#a96a30,#d69b53,#995a27)";
 if(n===2)area.style.background="linear-gradient(120deg,#101d40,#263d70,#11182d)";
 if(n===3)area.style.background="linear-gradient(120deg,#35134d,#7544a1,#241039)";
 closeModal();
}

render();
</script>
</body>
</html>
