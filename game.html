<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Butulka Baku - Canvas Game Engine</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: #2b1406;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Yuxarı Panel */
        .top-bar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 14px; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(10px); z-index: 50; flex-shrink: 0;
            border-bottom: 1px solid rgba(255,255,255,0.15);
        }
        .hearts-box {
            display: flex; align-items: center; gap: 6px; font-size: 15px; font-weight: bold; background: linear-gradient(135deg, #ff7e5f, #feb47b); padding: 4px 12px; border-radius: 20px; color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }
        .top-icons { display: flex; align-items: center; gap: 10px; }
        .icon-btn {
            width: 35px; height: 35px; border-radius: 50%;
            background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4);
            display: flex; align-items: center; justify-content: center; font-size: 15px; cursor: pointer;
        }
        .table-info { text-align: center; line-height: 1.1; font-size: 12px; font-weight: bold; text-shadow: 1px 1px 2px #000; }

        /* Canvas Oyun Səhnəsi */
        .game-board {
            flex: 1; position: relative; width: 100%; overflow: hidden; background: #c87d43;
        }
        #gameCanvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block;
        }

        /* HTML Oyunçu Kartları (Canvas Üzərində Dairəvi Yerləşmə) */
        .player-node {
            position: absolute; width: 56px; height: 56px; margin: -28px 0 0 -28px;
            border-radius: 14px; background: #1a1d33; border: 2px solid rgba(255,255,255,0.3);
            box-shadow: 0 6px 15px rgba(0,0,0,0.6); overflow: visible; display: flex; align-items: center; justify-content: center; z-index: 20;
            transition: all 0.2s ease;
        }
        .player-node.is-vip {
            border: 3px solid #fbbf24;
            box-shadow: 0 0 16px rgba(251,191,36,0.8), inset 0 0 8px rgba(251,191,36,0.5);
        }
        .player-node img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; }
        .player-name {
            position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%);
            font-size: 9px; font-weight: bold; color: #fff; background: rgba(0,0,0,0.85); padding: 1px 6px; border-radius: 6px; white-space: nowrap; border: 1px solid rgba(255,255,255,0.2);
        }
        .gender-badge { position: absolute; top: -5px; right: -5px; background: #1e293b; border-radius: 50%; font-size: 9px; padding: 1px; border: 1px solid #fff; z-index: 5; }
        .kiss-sticker { position: absolute; bottom: -2px; right: -6px; font-size: 15px; z-index: 6; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6)); }

        /* Fırlat Düyməsi və Mətn */
        .ui-overlay-center {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 25; pointer-events: none;
        }
        .spin-btn {
            background: linear-gradient(135deg, #ec4899, #be185d); color: #fff; border: 2px solid #fff; padding: 8px 24px; border-radius: 20px; font-weight: bold; font-size: 13px; cursor: pointer; pointer-events: auto; box-shadow: 0 6px 16px rgba(0,0,0,0.5); display: none; text-transform: uppercase; letter-spacing: 1px;
        }
        .status-msg {
            background: rgba(0,0,0,0.7); padding: 6px 14px; border-radius: 15px; font-size: 12px; font-weight: bold; color: #fbbf24; border: 1px solid rgba(251,191,36,0.3); pointer-events: auto; text-align: center;
        }

        /* Öpüşmə / Seçim Modalı */
        .kiss-modal {
            position: absolute; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(6px);
            z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center;
        }
        .kiss-card { background: #1e293b; border: 2px solid #fbbf24; padding: 20px; border-radius: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); width: 280px; }
        .kiss-profiles { display: flex; align-items: center; justify-content: center; gap: 15px; margin: 15px 0; }
        .kiss-img { width: 65px; height: 65px; border-radius: 14px; border: 3px solid #fbbf24; object-fit: cover; }
        .kiss-timer { font-size: 28px; font-weight: bold; color: #fbbf24; }
        .kiss-actions { display: flex; gap: 10px; justify-content: center; margin-top: 15px; }
        .btn-refuse { background: #ef4444; color: #fff; border: none; padding: 8px 16px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .btn-accept { background: #22c55e; color: #fff; border: none; padding: 8px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; }

        /* Canlı Çat Paneli */
        .chat-container {
            height: 140px; background: #fff; display: flex; flex-direction: column; border-top-left-radius: 20px; border-top-right-radius: 20px; box-shadow: 0 -4px 20px rgba(0,0,0,0.4); z-index: 40; flex-shrink: 0;
        }
        .chat-messages { flex: 1; padding: 8px 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
        .chat-line { font-size: 12px; color: #333; line-height: 1.3; background: #f1f5f9; padding: 5px 10px; border-radius: 10px; align-self: flex-start; max-width: 90%; word-break: break-word; border-left: 3px solid #ec4899; }
        .chat-sender { font-weight: bold; color: #ec4899; }
        .chat-input-area { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-top: 1px solid #e2e8f0; background: #f8fafc; }
        .chat-input { flex: 1; padding: 7px 12px; border-radius: 18px; border: 1px solid #cbd5e1; outline: none; font-size: 12px; }
        .send-btn { background: #f97316; color: #fff; border: none; width: 34px; height: 34px; border-radius: 50%; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px rgba(249,115,22,0.4); }

        .bottom-bar {
            height: 32px; background: #1e293b; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; font-size: 11px; font-weight: bold; z-index: 45; flex-shrink: 0; border-top: 1px solid rgba(255,255,255,0.08);
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="hearts-box">
            <span>❤️</span> 
            <span id="myHeartsDisplay">0</span>
        </div>
        <div class="top-icons">
            <button class="icon-btn" onclick="window.location.href='profil.html'">⚙️</button>
            <div class="table-info">Masa<br>511</div>
            <button class="icon-btn" onclick="exitGame()" style="background:rgba(239,68,68,0.3);">🚪</button>
        </div>
    </div>

    <div class="game-board" id="boardContainer">
        <!-- HTML5 Canvas (Butulkanın və Taxta Masanın Render Olduğu Yer) -->
        <canvas id="gameCanvas"></canvas>

        <!-- Mərkəzi UI (Fırlat düyməsi və status) -->
        <div class="ui-overlay-center">
            <div class="status-msg" id="boardStatus">Qızları gözləyirik...</div>
            <button class="spin-btn" id="spinBtn" onclick="requestSpin()">Fırlat!</button>
        </div>

        <!-- Öpüşmə / Seçim Modalı -->
        <div class="kiss-modal" id="kissModal">
            <div class="kiss-card">
                <h3 style="color:#fff; font-size:16px;">Seçim Zamanı!</h3>
                <div class="kiss-profiles">
                    <img id="modalImg1" class="kiss-img" src="">
                    <div class="kiss-timer" id="modalTimer">9</div>
                    <img id="modalImg2" class="kiss-img" src="">
                </div>
                <div class="kiss-actions">
                    <button class="btn-refuse" onclick="answerKiss('slap')">İmtina et ❌</button>
                    <button class="btn-accept" onclick="answerKiss('kiss')">Öp 💋</button>
                </div>
            </div>
        </div>

        <!-- Dairəvi Stul Düğümləri -->
        <div id="seatsWrapper"></div>
    </div>

    <div class="chat-container">
        <div class="chat-messages" id="chatBox">
            <div style="text-align:center; color:#94a3b8; font-size:11px;">📢 Canvas mühərriki aktivdir.</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="msgInput" class="chat-input" placeholder="Mesaj yaz..." onkeypress="if(event.key==='Enter') sendChat()">
            <button class="send-btn" onclick="sendChat()">➤</button>
        </div>
    </div>

    <div class="bottom-bar">
        <div>⏳ Hədiyyə: <span style="color:#22c55e;">+300 Ürək</span></div>
        <div style="color:#fbbf24;">60:00</div>
    </div>

    <script>
        const socket = io();

        const sessionRaw = localStorage.getItem("currentUser");
        if (!sessionRaw) window.location.href = "index.html";
        const sessionUser = JSON.parse(sessionRaw);

        const currentTableId = "511";
        const DEFAULT_AVATAR = "https://cdn-icons-png.flaticon.com/512/149/149071.png";
        let globalPlayersList = [];

        document.getElementById("myHeartsDisplay").textContent = sessionUser.hearts || 0;

        // Canvas Qrafik Mühərrikinin Quraşdırılması
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
            const container = document.getElementById("boardContainer");
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            drawTableScene(currentAngle);
        }
        window.addEventListener('resize', resizeCanvas);

        // Masanın taxta fonu və butulkanın çəkilməsi
        let currentAngle = 28; // Başlanğıc əyri bucaq

        function drawTableScene(angleDeg) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            // Masanın kölgəsi və mərkəzi işıq effekti
            let gradient = ctx.createRadialGradient(centerX, centerY, 20, centerX, centerY, 160);
            gradient.addColorStop(0, "rgba(255, 255, 255, 0.15)");
            gradient.addColorStop(1, "rgba(0, 0, 0, 0.35)");
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(centerX, centerY, 150, 0, Math.PI * 2);
            ctx.fill();

            // Canvas Üzərində Peşəkar Şüşə Butulka
            ctx.save();
            ctx.translate(centerX, centerY);
            ctx.rotate((angleDeg * Math.PI) / 180);

            // Butulka Gövdəsi
            ctx.shadowColor = "rgba(0, 0, 0, 0.6)";
            ctx.shadowBlur = 15;
            ctx.shadowOffsetY = 8;

            ctx.fillStyle = "#2b1810";
            ctx.beginPath();
            ctx.roundRect(-22, -75, 44, 135, [22, 22, 8, 8]);
            ctx.fill();
            ctx.strokeStyle = "#d4af37";
            ctx.lineWidth = 2.5;
            ctx.stroke();

            // Butulka Boynu
            ctx.fillStyle = "#1a0f0a";
            ctx.beginPath();
            ctx.roundRect(-9, -95, 18, 25, [4, 4, 0, 0]);
            ctx.fill();
            ctx.stroke();

            // Qızıl VIP Etiketi (Label)
            ctx.rotate(-Math.PI / 2);
            ctx.fillStyle = "#d4af37";
            ctx.font = "bold 11px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("VIP", 0, 4);

            ctx.restore();
        }

        resizeCanvas();

        // 12 Stulun Dairəvi Dinamik Yerləşməsi
        function renderSeats(playersMap) {
            const wrapper = document.getElementById("seatsWrapper");
            wrapper.innerHTML = "";
            globalPlayersList = Object.values(playersMap || {});

            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = Math.min(centerX, centerY) - 65;

            for (let i = 0; i < 12; i++) {
                const angle = (i * 30 - 90) * (Math.PI / 180);
                const x = centerX + radius * Math.cos(angle);
                const y = centerY + radius * Math.sin(angle);

                const p = globalPlayersList.find(x => x.seatIndex === i);
                const seatDiv = document.createElement("div");
                seatDiv.className = "player-node";
                seatDiv.style.left = `${x}px`;
                seatDiv.style.top = `${y}px`;

                if (p) {
                    const genderIcon = p.gender === "Qadın" ? "♀️" : "♂️";
                    const vipClass = p.vip ? "is-vip" : "";
                    const nameColor = p.vip ? (p.gender === "Qadın" ? "#f43f5e" : "#38bdf8") : "#fff";
                    const userAvatar = p.avatar && p.avatar.trim() !== "" ? p.avatar : DEFAULT_AVATAR;
                    const kissSticker = p.vip ? `<div class="kiss-sticker">💋</div>` : "";

                    seatDiv.className += ` ${vipClass}`;
                    seatDiv.innerHTML = `
                        <span class="gender-badge">${genderIcon}</span>
                        <img src="${userAvatar}">
                        ${kissSticker}
                        <div class="player-name" style="color: ${nameColor}">${p.vip ? "👑 " : ""}${p.username}</div>
                    `;
                } else {
                    seatDiv.style.opacity = "0.25";
                    seatDiv.innerHTML = `<div style="font-size:10px; color:#fff;">${i+1}</div>`;
                }
                wrapper.appendChild(seatDiv);
            }

            // Düymə və status idarəsi
            const hasGirls = globalPlayersList.some(p => p.gender === "Qadın");
            const statusMsg = document.getElementById("boardStatus");
            const spinBtn = document.getElementById("spinBtn");

            if (!hasGirls) {
                statusMsg.style.display = "block";
                spinBtn.style.display = "none";
            } else {
                statusMsg.style.display = "none";
                spinBtn.style.display = "block";
            }
        }

        // Socket Bağlantıları
        socket.emit('join_table', {
            tableId: currentTableId,
            user: {
                id: sessionUser.id,
                username: sessionUser.username,
                avatar: sessionUser.avatar || DEFAULT_AVATAR,
                gender: sessionUser.gender || "Kişi",
                vip: sessionUser.vip || false
            }
        });

        socket.on('update_table', (table) => {
            renderSeats(table.players);
        });

        function requestSpin() {
            socket.emit('spin_bottle', currentTableId);
        }

        // Canvas Üzərində Saniyəlik Hamar Fırlanma Animasiyası (Game Loop)
        socket.on('bottle_spinning', (data) => {
            let targetAngle = data.rotation + 28;
            let startAngle = currentAngle;
            let startTime = null;
            let duration = 3000;

            function animate(timestamp) {
                if (!startTime) startTime = timestamp;
                let progress = timestamp - startTime;
                let percent = Math.min(progress / duration, 1);
                
                let ease = 1 - Math.pow(1 - percent, 3); // Smooth EaseOut
                currentAngle = startAngle + (targetAngle - startAngle) * ease;

                drawTableScene(currentAngle);

                if (percent < 1) {
                    requestAnimationFrame(animate);
                }
            }
            requestAnimationFrame(animate);
        });

        socket.on('bottle_stopped', (finalAngle) => {
            currentAngle = (finalAngle + 28) % 360;
            drawTableScene(currentAngle);

            if (globalPlayersList.length >= 2) {
                openKissModal(globalPlayersList[0], globalPlayersList[1]);
            }
        });

        // Öpüşmə Modalı
        let kissInterval = null;
        function openKissModal(p1, p2) {
            const modal = document.getElementById("kissModal");
            document.getElementById("modalImg1").src = p1.avatar || DEFAULT_AVATAR;
            document.getElementById("modalImg2").src = p2.avatar || DEFAULT_AVATAR;
            modal.style.display = "flex";

            let timeLeft = 9;
            document.getElementById("modalTimer").textContent = timeLeft;

            if (kissInterval) clearInterval(kissInterval);
            kissInterval = setInterval(() => {
                timeLeft--;
                document.getElementById("modalTimer").textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(kissInterval);
                    modal.style.display = "none";
                }
            }, 1000);
        }

        function answerKiss(action) {
            if (kissInterval) clearInterval(kissInterval);
            document.getElementById("kissModal").style.display = "none";
            alert(action === 'kiss' ? "Öpüş baş tutdu! ❤️" : "İmtina edildi.");
        }

        function sendChat() {
            const input = document.getElementById("msgInput");
            const text = input.value.trim();
            if (!text) return;
            input.value = "";

            socket.emit('send_chat', {
                tableId: currentTableId,
                senderName: sessionUser.username,
                text: text
            });
        }

        socket.on('new_chat', (data) => {
            const box = document.getElementById("chatBox");
            box.innerHTML += `
                <div class="chat-line">
                    <span class="chat-sender">${data.senderName}:</span> ${data.text}
                </div>`;
            box.scrollTop = box.scrollHeight;
        });

        function exitGame() {
            window.location.href = "profil.html";
        }
    </script>
</body>
</html>
