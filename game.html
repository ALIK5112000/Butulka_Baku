<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Butulka Baku - Oyun</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: #d28c53; 
            background-image: url('https://www.transparenttextures.com/patterns/wood-pattern.png');
            background-blend-mode: multiply;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* --- YUXARI PANEL --- */
        .top-bar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 15px; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(8px); z-index: 50;
        }
        .hearts-box {
            display: flex; align-items: center; gap: 6px; font-size: 18px; font-weight: bold; cursor: pointer; background: rgba(0,0,0,0.3); padding: 4px 10px; border-radius: 20px;
        }
        .top-icons { display: flex; align-items: center; gap: 12px; }
        .icon-btn {
            width: 36px; height: 36px; border-radius: 50%;
            background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
            display: flex; align-items: center; justify-content: center; font-size: 16px; cursor: pointer;
        }
        .table-info { text-align: center; line-height: 1.2; font-size: 13px; font-weight: bold; cursor: pointer; }

        /* --- OYUN MASASI --- */
        .game-board {
            flex: 1; position: relative; display: flex; align-items: center; justify-content: center;
        }
        
        .center-bottle {
            width: 80px; height: 220px;
            background: url('https://cdn-icons-png.flaticon.com/512/963/963953.png') center/contain no-repeat;
            position: absolute; z-index: 10;
            transition: transform 3s cubic-bezier(0.25, 0.1, 0.25, 1);
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5));
            display: flex; align-items: center; justify-content: center;
        }
        .bottle-text {
            position: absolute; width: 180px; text-align: center; color: #fff; font-weight: bold; font-size: 14px; text-shadow: 1px 1px 3px #000; z-index: 11;
        }
        .spin-btn {
            position: absolute; bottom: -40px; background: rgba(255,255,255,0.2); border: 2px solid #fff; padding: 6px 12px; border-radius: 20px; font-weight: bold; cursor: pointer; display: none;
        }

        .circle-container { width: 320px; height: 320px; position: relative; border-radius: 50%; }
        .seat {
            position: absolute; width: 64px; height: 64px; top: 50%; left: 50%; margin: -32px;
            border-radius: 12px; background: rgba(0,0,0,0.2); border: 2px dashed rgba(255,255,255,0.3);
            display: flex; align-items: center; justify-content: center; transition: 0.3s;
        }
        .player-card {
            width: 100%; height: 100%; border-radius: 12px; position: relative; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.4); border: 2px solid transparent;
        }
        .player-card.is-vip { border-color: #fbbf24; }
        .player-card img { width: 100%; height: 100%; object-fit: cover; border-radius: 10px; }
        .player-name {
            position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%);
            font-size: 10px; font-weight: bold; color: #fff; background: rgba(0,0,0,0.6); padding: 2px 6px; border-radius: 6px; white-space: nowrap;
        }
        .gender-icon { position: absolute; top: -6px; right: -6px; background: #1e293b; padding: 2px; border-radius: 50%; font-size: 12px; }

        /* Köməkçi Alətlər (Klip və Hədiyyə) */
        .side-tools {
            position: absolute; right: 10px; bottom: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 20;
        }
        .tool-btn {
            width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.9); border: none; font-size: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        /* --- YOUTUBE PLEYER (Çatın üstündə) --- */
        .active-media-player {
            position: absolute; bottom: 270px; left: 10px; right: 60px; background: #fff; border-radius: 12px; display: none; align-items: center; padding: 6px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); z-index: 15;
        }
        .media-avatar { width: 36px; height: 36px; border-radius: 50%; border: 2px solid #38bdf8; margin-right: 10px; }
        .media-info { flex: 1; color: #000; font-size: 12px; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .media-controls { display: flex; align-items: center; gap: 8px; color: #333; font-size: 18px; }

        /* --- CANLI ÇAT --- */
        .chat-container {
            height: 220px; background: #fff; display: flex; flex-direction: column; border-top-left-radius: 20px; border-top-right-radius: 20px; box-shadow: 0 -5px 20px rgba(0,0,0,0.3); z-index: 30;
        }
        .chat-messages { flex: 1; padding: 10px 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .chat-line { font-size: 14px; color: #333; line-height: 1.4; background: #f1f5f9; padding: 6px 12px; border-radius: 12px; align-self: flex-start; max-width: 90%; word-break: break-word; }
        .chat-sender { font-weight: bold; color: #ec4899; cursor: pointer; }
        
        .chat-input-area { display: flex; align-items: center; gap: 10px; padding: 10px 15px; border-top: 1px solid #e2e8f0; background: #f8fafc; }
        .chat-input { flex: 1; padding: 10px 15px; border-radius: 20px; border: 1px solid #cbd5e1; outline: none; font-size: 14px; }
        .send-btn { background: #f97316; color: #fff; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 18px; cursor: pointer; }

        /* --- ƏN ALT 60 DƏQİQƏLİK BONUS SAYĞACI --- */
        .bottom-bonus-bar {
            height: 40px; background: #1e293b; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; font-size: 13px; font-weight: bold;
        }
        .bonus-btn { background: #22c55e; color: #fff; border: none; padding: 4px 12px; border-radius: 12px; font-weight: bold; cursor: pointer; display: none; }
        
        /* --- MODALLAR (OVERLAY) ÜMUMİ --- */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(4px);
        }
        .modal-content {
            background: #fff; color: #333; width: 90%; max-width: 400px; border-radius: 20px; overflow: hidden; position: relative;
        }
        .modal-header { padding: 15px; background: #f8fafc; text-align: center; font-weight: bold; font-size: 16px; border-bottom: 1px solid #e2e8f0; position: relative; }
        .close-modal-btn { position: absolute; right: 15px; top: 12px; background: #e2e8f0; border: none; width: 28px; height: 28px; border-radius: 50%; font-weight: bold; cursor: pointer; }

        /* --- ÖPÜŞMƏ / ŞİLLƏ MODALI (MƏRKƏZİ EKRAN) --- */
        .kiss-modal {
            background: transparent; color: #fff; text-align: center; width: 100%;
        }
        .kiss-title { font-size: 20px; font-weight: bold; margin-bottom: 20px; text-shadow: 1px 1px 4px #000; }
        .kiss-profiles { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 30px; }
        .kiss-prof { width: 90px; height: 90px; border-radius: 16px; border: 3px solid #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.5); object-fit: cover; }
        .kiss-timer-number { font-size: 40px; font-weight: bold; color: #fbbf24; text-shadow: 2px 2px 5px #000; }
        .kiss-actions { display: flex; justify-content: center; gap: 15px; }
        .btn-red { background: #ef4444; color: #fff; padding: 12px 25px; border-radius: 12px; border: none; font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 4px 10px rgba(239,68,68,0.5); }
        .btn-green { background: #22c55e; color: #fff; padding: 12px 25px; border-radius: 12px; border: none; font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 4px 10px rgba(34,197,94,0.5); }

    </style>
</head>
<body>

    <!-- YUXARI PANEL -->
    <div class="top-bar">
        <div class="hearts-box" onclick="openModal('shopModal')">
            <span style="color:#ef4444; font-size:20px;">❤️</span> 
            <span id="myHeartsDisplay">0</span>
        </div>
        <div class="top-icons">
            <button class="icon-btn" title="Butulka">🍾</button>
            <button class="icon-btn" title="Ayarlar" onclick="window.location.href='profil.html'">⚙️</button>
            <div class="table-info" onclick="openModal('tablesModal')">
                Masa<br><span id="tableNumberDisplay">---</span> 🔄
            </div>
            <button class="icon-btn" title="Çıxış" onclick="window.location.href='profil.html'" style="background:rgba(239,68,68,0.3);">🚪</button>
        </div>
    </div>

    <!-- OYUN MASASI -->
    <div class="game-board">
        <!-- Sağdakı Alətlər -->
        <div class="side-tools">
            <button class="tool-btn" title="Klip qoy" onclick="openModal('youtubeModal')">🎬</button>
            <button class="tool-btn" title="Hədiyyə at">🎁</button>
        </div>

        <!-- Yutub Pleyeri (Çatın üstündə çıxır) -->
        <div class="active-media-player" id="mediaPlayer">
            <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="media-avatar" id="mediaAvatar">
            <div class="media-info" id="mediaTitle">Mahni adı yüklənir...</div>
            <div class="media-controls">
                <span title="Səsi bağla">🔊</span>
                <span title="Böyüt">⛶</span>
            </div>
        </div>

        <!-- Mərkəzi Butulka -->
        <div class="center-bottle" id="bottleImg">
            <div class="bottle-text" id="bottleText">Oyuna başlamaq üçün qızları gözləyirik</div>
            <button class="spin-btn" id="spinBtn" onclick="triggerSpin()">Butulkanı fırlat!</button>
        </div>

        <!-- 12 Oturacaq Dairəsi -->
        <div class="circle-container" id="seatsContainer"></div>
    </div>

    <!-- CANLI ÇAT -->
    <div class="chat-container">
        <div class="chat-messages" id="chatBox">
            <div style="text-align:center; color:#94a3b8; font-size:12px; margin-bottom:10px;">
                📢 Sabahdan oyun arxa fonda işləyəcək, masadan atmayacaq.
            </div>
        </div>
        <div class="chat-input-area">
            <button style="border:none; background:none; font-size:20px; cursor:pointer;" onclick="alert('Smayliklər açılır')">😊</button>
            <input type="text" id="msgInput" class="chat-input" placeholder="Mesajı bura yaz...">
            <button class="send-btn" onclick="sendMsg()">➤</button>
        </div>
    </div>

    <!-- ƏN ALT BONUS SAYĞACI (60 DƏQİQƏ) -->
    <div class="bottom-bonus-bar">
        <div>⏳ 105 <span style="color:#22c55e;">+300 ürək</span></div>
        <div id="timerText" style="color:#cbd5e1;">60:00</div>
        <button class="bonus-btn" id="claimBonusBtn" onclick="claimBonus()">Götür</button>
    </div>

    <!-- ================= MODALLAR ================= -->

    <!-- 1. MASA DƏYİŞDİRMƏ MODALI -->
    <div class="modal-overlay" id="tablesModal" onclick="closeOutside(event, 'tablesModal')">
        <div class="modal-content">
            <div class="modal-header">Masanı dəyiş<button class="close-modal-btn" onclick="closeModal('tablesModal')">✕</button></div>
            <div style="padding: 15px;">
                <input type="text" placeholder="Masa nömrəsi, məs. 666" style="width:100%; padding:10px; border-radius:10px; border:1px solid #ccc; margin-bottom:10px;">
                <button style="width:100%; padding:12px; background:#f59e0b; color:#fff; border:none; border-radius:10px; font-weight:bold; margin-bottom:15px; cursor:pointer;">Təsadüfi seçilmiş masa!</button>
                <div style="font-size:12px; color:#666; margin-bottom:10px;">Ən son baş çəkmiş olduğun masalar</div>
                <div style="height:150px; overflow-y:auto;">
                    <div style="display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid #eee;">
                        <span style="font-weight:bold;">🍾 #23</span>
                        <span style="color:#666;">👩 5 &nbsp; 👨 7</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 2. YOUTUBE KLİP MODALI -->
    <div class="modal-overlay" id="youtubeModal" onclick="closeOutside(event, 'youtubeModal')">
        <div class="modal-content">
            <div class="modal-header">Musiqi axtar<button class="close-modal-btn" onclick="closeModal('youtubeModal')">✕</button></div>
            <div style="padding: 15px;">
                <input type="text" placeholder="🔍 Oyunun axtarış sistemi vasitəsilə..." style="width:100%; padding:10px; border-radius:10px; border:1px solid #ccc; margin-bottom:15px;">
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; height:200px; overflow-y:auto;">
                    <div style="background:#f1f5f9; height:80px; border-radius:10px; display:flex; align-items:center; justify-content:center; cursor:pointer;" onclick="playYoutubeVideo()">Trend Musiqi 1</div>
                    <div style="background:#f1f5f9; height:80px; border-radius:10px; display:flex; align-items:center; justify-content:center; cursor:pointer;" onclick="playYoutubeVideo()">Trend Musiqi 2</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 3. ÖPÜŞMƏ VƏ ŞİLLƏ (9 SANİYƏ) MODALI -->
    <div class="modal-overlay" id="kissModal">
        <div class="kiss-modal">
            <div class="kiss-title" id="kissTitle">Sənin seçimin</div>
            <div class="kiss-profiles">
                <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="kiss-prof" id="kissProf1">
                <div class="kiss-timer-number" id="kissTimerDisplay">9</div>
                <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="kiss-prof" id="kissProf2">
            </div>
            <!-- Bura yalnız seçilən adamlarda görünəcək -->
            <div class="kiss-actions" id="kissActionButtons" style="display:none;">
                <button class="btn-red" onclick="makeDecision('slap')">İmtina et / Şillə vur</button>
                <button class="btn-green" onclick="makeDecision('kiss')">Öp / Alovlu öp</button>
            </div>
        </div>
    </div>


    <script>
        // MƏRKƏZİ VİZUAL VƏ SİMULYASİYA MƏNTİQİ
        // Bu hissə əsasən arxitekturanı tam işlək göstərmək üçündür.
        
        // 12 stulun yaradılması
        function createSeats() {
            const container = document.getElementById("seatsContainer");
            const radius = 150;
            for (let i = 0; i < 12; i++) {
                const angle = (i * 30) * (Math.PI / 180);
                const x = radius * Math.cos(angle);
                const y = radius * Math.sin(angle);
                
                const seatDiv = document.createElement("div");
                seatDiv.className = "seat";
                seatDiv.id = `seat-${i}`;
                seatDiv.style.transform = `translate(${x}px, ${y}px)`;
                
                // 3 stula qız, 2 stula oğlan əlavə edək (Sistemi test etmək üçün vizual)
                if(i===0) seatDiv.innerHTML = `<div class="player-card"><img src="https://i.pravatar.cc/100?img=11"><div class="player-name">Əli</div></div>`;
                if(i===3) seatDiv.innerHTML = `<div class="player-card"><img src="https://i.pravatar.cc/100?img=5"><span class="gender-icon">♀️</span><div class="player-name">Aysel</div></div>`;
                if(i===7) seatDiv.innerHTML = `<div class="player-card"><img src="https://i.pravatar.cc/100?img=9"><span class="gender-icon">♀️</span><div class="player-name">Günel</div></div>`;
                if(i===9) seatDiv.innerHTML = `<div class="player-card is-vip"><img src="https://i.pravatar.cc/100?img=12"><div class="player-name" style="color:#fbbf24">👑 Akif</div></div>`;
                
                container.appendChild(seatDiv);
            }
            // Qız olduğu üçün butulkanın mətni silinir və fırlatma düyməsi çıxır
            document.getElementById("bottleText").style.display = "none";
            document.getElementById("spinBtn").style.display = "block";
        }
        createSeats();

        // Butulkanın fırlanma mexanizmi
        function triggerSpin() {
            document.getElementById("spinBtn").style.display = "none";
            const bottle = document.getElementById("bottleImg");
            
            // Random fırlanma dərəcəsi
            const randomRotation = 1440 + Math.floor(Math.random() * 360); 
            bottle.style.transform = `rotate(${randomRotation}deg)`;

            // 3 saniyə fırlanma bitdikdən sonra Öpüşmə pəncərəsi açılır
            setTimeout(() => {
                startKissSequence();
            }, 3000);
        }

        // 9 Saniyəlik Öpüşmə Mexanizmi
        let kissInterval;
        function startKissSequence() {
            document.getElementById("kissModal").style.display = "flex";
            document.getElementById("kissProf1").src = "https://i.pravatar.cc/100?img=11"; // Oğlan
            document.getElementById("kissProf2").src = "https://i.pravatar.cc/100?img=5";  // Qız
            document.getElementById("kissActionButtons").style.display = "flex"; // Əgər mən seçilmişəmsə

            let timeLeft = 9;
            document.getElementById("kissTimerDisplay").innerText = timeLeft;
            
            kissInterval = setInterval(() => {
                timeLeft--;
                document.getElementById("kissTimerDisplay").innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(kissInterval);
                    closeModal('kissModal');
                    resetBottle();
                }
            }, 1000);
        }

        // Qərar (Öp və ya İmtina)
        function makeDecision(type) {
            clearInterval(kissInterval);
            if (type === 'kiss') {
                alert("Öpüşmə baş tutdu! +1 Xal");
                // Burada real animasiya və ürək artımı olacaq
            } else {
                alert("İmtina edildi / Şillə vuruldu.");
            }
            closeModal('kissModal');
            resetBottle();
        }

        function resetBottle() {
            document.getElementById("spinBtn").style.display = "block";
        }

        // YouTube Musiqi Qoşulması
        function playYoutubeVideo() {
            const confirmed = confirm("Bu musiqini hər kəs üçün ifa etmək istəyirsiniz? (Balansdan 9 ürək çıxılacaq)");
            if (confirmed) {
                closeModal('youtubeModal');
                const player = document.getElementById("mediaPlayer");
                player.style.display = "flex";
                document.getElementById("mediaTitle").innerText = "Şalaxo Remix - Qafqaz Vibe";
                
                // 30 saniyə sonra musiqi bitsin (Nümunə)
                setTimeout(() => {
                    player.style.display = "none";
                }, 30000);
            }
        }

        // 60 Dəqiqəlik Bonus Taymeri
        let bonusTime = 60; // saniyə ilə test üçün
        setInterval(() => {
            if (bonusTime > 0) {
                bonusTime--;
                let m = Math.floor(bonusTime / 60);
                let s = bonusTime % 60;
                document.getElementById("timerText").innerText = `${m}:${s < 10 ? '0'+s : s}`;
            } else {
                document.getElementById("timerText").style.display = "none";
                document.getElementById("claimBonusBtn").style.display = "block";
            }
        }, 1000);

        function claimBonus() {
            alert("100 Ürək balansa əlavə olundu!");
            document.getElementById("claimBonusBtn").style.display = "none";
            document.getElementById("timerText").style.display = "block";
            bonusTime = 3600; // yenidən 60 dəqiqə
        }

        // Modalların İdarə Olunması
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function closeOutside(e, id) { if(e.target.id === id) closeModal(id); }

    </script>
</body>
</html>
