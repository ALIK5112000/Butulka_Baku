<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08131f">
  <title>Butulka Baku</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/splash.css">
</head>
<body>
  <main class="splash">

    <section class="stage is-active" id="stageLoading">
      <div class="bg" id="bgLoading"></div>
      <div class="veil"></div>
      <div class="loader">
        <svg class="bottle" viewBox="0 0 60 140" aria-hidden="true">
          <defs>
            <clipPath id="bottleClip">
              <path id="bottleShape" d="M24 4h12v6h-3v22c0 8 14 16 14 34v62a8 8 0 0 1-8 8H21a8 8 0 0 1-8-8V66c0-18 14-26 14-34V10h-3z"/>
            </clipPath>
          </defs>
          <rect id="bottleFill" x="0" y="140" width="60" height="140" clip-path="url(#bottleClip)" class="bottle-fill"/>
          <use href="#bottleShape" class="bottle-line"/>
        </svg>
        <p class="loader-text">Yüklənir <span id="pct">0%</span></p>
      </div>
    </section>

    <section class="stage" id="stageBrand">
      <div class="bg" id="bgBrand"></div>
      <div class="veil"></div>
      <h1 class="brand">Butulka Baku</h1>
      <span class="brand-line"></span>
    </section>

  </main>

  <script src="js/splash-config.js"></script>
  <script src="js/splash.js"></script>
</body>
</html>
