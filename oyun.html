<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Butulka Baku - Oyun Masası</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { 
            background: linear-gradient(135deg, #a66e38 0%, #6b4423 50%, #4a2c13 100%); 
            font-family: sans-serif; 
            color: white; 
            height: 100vh; 
            overflow: hidden; 
        }
        .bottle { transition: transform 3s cubic-bezier(0.15, 0.9, 0.2, 1); }
    </style>
</head>
<body class="flex flex-col justify-between h-screen">

    <!-- TOP BAR -->
    <header class="flex items-center justify-between px-4 py-3 bg-black/30 backdrop-blur-md border-b border-white/10">
        <a href="profil.html" class="text-yellow-300 text-xs font-bold flex items-center gap-1.5 bg-black/40 px-3 py-1.5 rounded-full border border-yellow-500/30 hover:bg-black/60 transition">
            <i class="fa-solid fa-arrow-left"></i> Profilə qayıt
        </a>
        <div class="bg-black/40 px-3 py-1 rounded-full text-xs text-yellow-300 font-bold border border-yellow-500/30">
            Masa 511[span_3](start_span)[span_3](end_span)
        </div>
    </header>

    <!-- GAME TABLE AREA -->
    <main class="flex-1 flex items-center justify-center relative p-4">
        
        <!-- Sol tərəfdə oturan oyunçu avatarı (məsələn, sənin profilin) -->
        <div class="absolute left-6 top-1/2 -translate-y-1/2 flex flex-col items-center">
            <div class="w-16 h-16 rounded-2xl overflow-hidden border-2 border-yellow-500 shadow-2xl bg-black/50">
                <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" class="w-full h-full object-cover">
            </div>
            <span id="tableName" class="text-[11px] mt-1.5 bg-black/50 px-2.5 py-0.5 rounded-full text-yellow-200 font-bold border border-yellow-500/20">| A | L | İ |</span>
        </div>

        <!-- Mərkəzdə Şüşə və Yazı -->
        <div class="flex flex-col items-center">
            <div id="bottleContainer" class="relative cursor-pointer mb-5" onclick="spinBottle()">
                <div class="absolute -top-3.5 left-1/2 -translate-x-1/2 bg-yellow-600 text-yellow-100 text-[9px] font-bold px-2.5 py-0.5 rounded-full shadow-lg border border-yellow-300 z-10">VIP</div>
                <!-- Realistik Şüşə Dizaynı -->
                <svg id="bottle" class="bottle w-24 h-36 drop-shadow-2xl" viewBox="0 0 100 150">
                    <path d="M42 8 L58 8 L62 35 L68 45 C78 60 78 90 68 120 C58 142 42 142 32 120 C22 90 22 60 32 45 L38 35 Z" fill="#151515" stroke="#e6c667" stroke-width="3"/>
                    <rect x="43" y="15" width="14" height="10" fill="#e6c667" rx="2"/>
                    <path d="M40 50 L60 50" stroke="#e6c667" stroke-width="1.5" opacity="0.6"/>
                </svg>
            </div>
            <div class="bg-black/40 backdrop-blur-md px-4 py-1.5 rounded-full border border-white/10 shadow-lg">
                <p class="text-xs text-yellow-100 font-medium tracking-wide">Oyuna başlamaq üçün qızları gözləyirik</p>[span_4](start_span)[span_4](end_span)
            </div>
        </div>

    </main>

    <script>
        // İstifadəçi adını yaddaşdan oxuyub masada göstərmək
        window.onload = function() {
            const storedUser = localStorage.getItem('currentUser');
            if(storedUser) {
                try {
                    const userData = JSON.parse(storedUser);
                    if(userData.username) {
                        document.getElementById('tableName').innerText = userData.username;
                    }
                } catch(e) {}
            }
        }

        let currentRotation = 0;
        function spinBottle() {
            const bottle = document.getElementById('bottle');
            const randomAngle = Math.floor(Math.random() * 1080) + 720;
            currentRotation += randomAngle;
            bottle.style.transform = `rotate(${currentRotation}deg)`;
        }
    </script>
</body>
</html>
