<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Butulka Baku - Masa 511</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
        body {
            background: #f3f1ed;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* YUXARI TAXTA MASA SAHƏSİ */
        .table-zone {
            position: relative;
            width: 100%;
            height: 58vh;
            background-color: #c88a4b;
            background-image: url('images/masa/taxta.png');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 8px 10px 10px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.25);
            z-index: 2;
        }

        /* Üst İkon Barı */
        .top-hud {
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 20;
        }
        .heart-counter {
            display: flex; align-items: center; gap: 5px;
            background: rgba(0,0,0,0.22);
            padding: 4px 11px;
            border-radius: 20px;
            color: #fff; font-weight: 800; font-size: 14px;
        }
        .hud-icons { display: flex; align-items: center; gap: 7px; }
        .hud-btn {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: rgba(255,255,255,0.25);
            border: 1px solid rgba(255,255,255,0.35);
            color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 15px; cursor: pointer;
        }
        .masa-info {
            display: flex; align-items: center; gap: 5px;
            color: #fff; font-size: 11px; font-weight: 700;
            text-align: right; line-height: 1.1;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        /* 12 OYUNÇU MEYDANÇASI */
        .seats-wrapper {
            position: relative;
            flex: 1;
            width: 100%;
            max-width: 460px;
            margin: 2px auto 0;
        }
        .seat {
            position: absolute;
            width: 68px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.25s;
            pointer-events: none;
        }
        .seat.occupied {
            pointer-events: auto;
            cursor: pointer;
        }
        /* Boş yerlərdə heç bir kölgə və çərçivə yoxdur */
        .seat-box {
            width: 62px;
            height: 62px;
            border-radius: 12px;
            background: transparent;
            border: none;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .seat.occupied .seat-box {
            border: 2px solid rgba(255,255,255,0.65);
            box-shadow: 0 3px 8px rgba(0,0,0,0.4);
            background: #231911;
        }
        .seat.active .seat-box {
            border: 3px solid #22c55e;
            box-shadow: 0 0 18px #22c55e;
            transform: scale(1.08);
        }
        .seat-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        .seat.occupied .seat-box img {
            display: block;
        }
        .seat .nick {
            margin-top: 2px;
            font-size: 10.5px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.95);
            max-width: 72px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            min-height: 14px;
        }

        .nick-oglan { color: #e0f2fe; }
        .nick-qiz { color: #fce7f3; }
        .nick-vip-oglan { color: #60a5fa; }
        .nick-vip-qiz { color: #f87171; }

        /* PİLLƏLİ DÜZÜLÜŞ KOORDİNATLARI */
        .s2 { top: 0%; left: 27.5%; }
        .s3 { top: 0%; right: 27.5%; }
        .s1 { top: 5.5%; left: 1%; }
        .s4 { top: 5.5%; right: 1%; }

        .s12 { top: 30%; left: 1%; }
        .s11 { top: 54.5%; left: 1%; }
        .s5  { top: 30%; right: 1%; }
        .s6  { top: 54.5%; right: 1%; }

        .s10 { bottom: 5.5%; left: 1%; }
        .s7  { bottom: 5.5%; right: 1%; }
        .s9  { bottom: 0%; left: 27.5%; }
        .s8  { bottom: 0%; right: 27.5%; }

        /* MƏRKƏZDƏ FIRLANAN BUTULKA */
        .center-hub {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 165px;
            height: 165px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 15;
            cursor: pointer;
        }
        #bottleCanvas {
            width: 145px;
            height: 145px;
            transform: rotate(0deg);
            transition: transform 4s cubic-bezier(0.12, 0.85, 0.15, 1);
            filter: drop-shadow(0 6px 10px rgba(0,0,0,0.45));
        }
        .turn-hint {
            position: absolute;
            bottom: -14px;
            background: rgba(0, 0, 0, 0.55);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 12px;
            white-space: nowrap;
            pointer-events: none;
        }

        /* AŞAĞI CANLI ÇAT */
        .chat-zone {
            flex: 1;
            background: #f5f3ef;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-feed {
            flex: 1;
            padding: 8px 10px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .chat-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            background: #fff;
            padding: 7px 10px;
            border-radius: 12px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.06);
        }
        .chat-row img {
            width: 30px;
            height: 30px;
            border-radius: 6px;
            object-fit: cover;
            flex-shrink: 0;
        }
        .chat-body { flex: 1; font-size: 13.5px; color: #1f2937; line-height: 1.35; word-break: break-word; }
        .chat-sender { font-weight: 800; margin-right: 4px; }
        .sender-oglan { color: #0284c7; }
        .sender-qiz { color: #db2777; }
        .sender-vip-oglan { color: #1d4ed8; }
        .sender-vip-qiz { color: #dc2626; }
        .sys-row {
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            color: #92400e;
            background: #fef3c7;
            padding: 5px 10px;
            border-radius: 10px;
        }

        .chat-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            background: #fff;
            border-top: 1px solid #e5e7eb;
        }
        .chat-bar input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 14px;
            color: #111827;
            background: transparent;
            padding: 6px;
        }
        .send-circle {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: #f59e0b;
            border: none;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>

    <div class="table-zone">
        <div class="top-hud">
            <div class="heart-counter">❤️ <span id="hudHearts">0</span></div>
            <div class="hud-icons">
                <button class="hud-btn" onclick="triggerSpin()" title="Fırlat">🎡</button>
                <button class="hud-btn" onclick="leaveAndGoProfile()" title="Profil">☰</button>
                <button class="hud-btn" onclick="leaveAndGoProfile()" title="Masadan çıx">🚪</button>
            </div>
            <div class="masa-info">
                <div>Masa<br>511</div>
                <span style="font-size:18px;">🔄</span>
            </div>
        </div>

        <div class="seats-wrapper">
            <div class="center-hub" onclick="triggerSpin()">
                <canvas id="bottleCanvas" width="200" height="200"></canvas>
                <div class="turn-hint" id="turnHint">Butulkanı fırlat</div>
            </div>

            <div class="seat s1" id="seat-1"><div class="seat-box"><img src=""></div><span class="nick"></span></div>
            <div class="seat s2" id="seat-2"><div class="seat-box"><img src=""></div><span class="nick"></span></div>
            <div class="seat s3" id="seat-3"><div class="seat-box"><img src=""></div><span class="nick"></span></div>
            <div class="seat s4" id="seat-4"><div class="seat-box"><img src=""></div><span class="nick"></span></div>
            <div class="seat s5" id="seat-5"><div class="seat-box"><img src=""></div><span class="nick"></span></div>
            <div class="seat s6" id="seat-6"><div class="seat-box"><img src=""></div><span class="nick"></span></div>
            <div class="seat s7" id="seat-7"><div class="seat-box"><img src=""></div><span class="nick"></span></div>
            <div class="seat s8" id="seat-8"><div class="seat-box"><img src=""></div><span class="nick"></span></div>
            <div class="seat s9" id="seat-9"><div class="seat-box"><img src=""></div><span class="nick"></span></div>
            <div class="seat s10" id="seat-10"><div class="seat-box"><img src=""></div><span class="nick"></span></div>
            <div class="seat s11" id="seat-11"><div class="seat-box"><img src=""></div><span class="nick"></span></div>
            <div class="seat s12" id="seat-12"><div class="seat-box"><img src=""></div><span class="nick"></span></div>
        </div>
    </div>

    <div class="chat-zone">
        <div class="chat-feed" id="chatFeed"></div>
        <div class="chat-bar">
            <input type="text" id="msgInput" placeholder="Mesajı bura yaz..." onkeypress="if(event.key==='Enter') sendRoomMessage()">
            <button class="send-circle" onclick="sendRoomMessage()">➤</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import {
            getFirestore, doc, setDoc, getDoc, updateDoc,
            collection, addDoc, onSnapshot, query, orderBy, limit
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAANVVrJKhZyaCErn8YFNVTUPF70A9xlmQ",
          authDomain: "butulka-baku-istifadeci-bazasi.firebaseapp.com",
          projectId: "butulka-baku-istifadeci-bazasi",
          storageBucket: "butulka-baku-istifadeci-bazasi.firebasestorage.app",
          messagingSenderId: "52438073026",
          appId: "1:52438073026:web:1c4a0a8d1fc1ce5f78455b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const DEFAULT_AVATAR = "https://cdn-icons-png.flaticon.com/512/149/149071.png";
        const rawUser = localStorage.getItem("currentUser");
        if (!rawUser) {
            window.location.href = "index.html";
        }
        const me = JSON.parse(rawUser);
        const isVip = Boolean(me.vip && (!me.vipUntil || Number(me.vipUntil) > Date.now()));

        document.getElementById("hudHearts").textContent = me.hearts || 0;

        function loadTransparentBottle() {
            const canvas = document.getElementById("bottleCanvas");
            const ctx = canvas.getContext("2d");
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.src = "images/masa/butulka.jpg";
            img.onload = () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const scale = Math.min(canvas.width / img.width, canvas.height / img.height) * 0.92;
                const w = img.width * scale;
                const h = img.height * scale;
                const x = (canvas.width - w) / 2;
                const y = (canvas.height - h) / 2;
                ctx.drawImage(img, x, y, w, h);

                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const d = imgData.data;
                for (let i = 0; i < d.length; i += 4) {
                    if (d[i] > 225 && d[i + 1] > 225 && d[i + 2] > 225) {
                        d[i + 3] = 0;
                    }
                }
                ctx.putImageData(imgData, 0, 0);
            };
        }
        loadTransparentBottle();

        const ROOM_ID = "masa_511";
        let mySeatNumber = null;
        let currentSeatsMap = {};
        let lastSpinId = null;

        const seatAngles = {
            1: 322, 2: 344, 3: 16, 4: 38,
            5: 72,  6: 108,
            7: 142, 8: 164, 9: 196, 10: 218,
            11: 252, 12: 288
        };

        async function joinTable() {
            const roomRef = doc(db, "rooms", ROOM_ID);
            const snap = await getDoc(roomRef);
            const data = snap.exists() ? snap.data() : { seats: {} };
            const seats = data.seats || {};
            const now = Date.now();

            let freeSeat = null;
            for (let i = 1; i <= 12; i++) {
                const s = seats[i];
                if (s && s.id === me.id) {
                    freeSeat = i;
                    break;
                }
            }
            if (!freeSeat) {
                for (let i = 1; i <= 12; i++) {
                    const s = seats[i];
                    if (!s || (now - (s.lastSeen || 0) > 90000)) {
                        freeSeat = i;
                        break;
                    }
                }
            }

            if (!freeSeat) {
                alert("Masa 511 doludur (12/12)!");
                return;
            }

            mySeatNumber = freeSeat;
            await setDoc(roomRef, {
                seats: {
                    ...seats,
                    [mySeatNumber]: {
                        id: me.id,
                        username: me.username,
                        avatar: me.avatar || DEFAULT_AVATAR,
                        gender: me.gender || "Kişi",
                        vip: isVip,
                        lastSeen: Date.now()
                    }
                }
            }, { merge: true });

            setInterval(() => {
                if (mySeatNumber) {
                    updateDoc(roomRef, {
                        [`seats.${mySeatNumber}.lastSeen`]: Date.now()
                    }).catch(() => {});
                }
            }, 25000);
        }

        onSnapshot(doc(db, "rooms", ROOM_ID), (docSnap) => {
            if (!docSnap.exists()) return;
            const data = docSnap.data();
            const seats = data.seats || {};
            currentSeatsMap = seats;
            const now = Date.now();

            for (let i = 1; i <= 12; i++) {
                const seatEl = document.getElementById(`seat-${i}`);
                const imgEl = seatEl.querySelector("img");
                const nickEl = seatEl.querySelector(".nick");
                const p = seats[i];

                if (p && (now - (p.lastSeen || 0) <= 95000)) {
                    seatEl.classList.add("occupied");
                    imgEl.src = p.avatar || DEFAULT_AVATAR;
                    nickEl.textContent = (p.vip ? "👑 " : "") + p.username;
                    const pFem = p.gender === "Qadın";
                    nickEl.className = "nick " + (p.vip ? (pFem ? "nick-vip-qiz" : "nick-vip-oglan") : (pFem ? "nick-qiz" : "nick-oglan"));
                } else {
                    seatEl.classList.remove("occupied", "active");
                    imgEl.src = "";
                    nickEl.textContent = "";
                }
            }

            if (data.spin && data.spin.spinId && data.spin.spinId !== lastSpinId) {
                lastSpinId = data.spin.spinId;
                animateBottleTo(data.spin.angle, data.spin.targetSeat, data.spin.spinnerName);
            }
        });

        let isSpinning = false;
        window.triggerSpin = async function() {
            if (isSpinning) return;

            const now = Date.now();
            const activeSeatNumbers = [];
            for (let i = 1; i <= 12; i++) {
                const p = currentSeatsMap[i];
                if (p && (now - (p.lastSeen || 0) <= 95000)) {
                    activeSeatNumbers.push(i);
                }
            }

            if (activeSeatNumbers.length === 0) return;

            const others = activeSeatNumbers.filter(n => n !== mySeatNumber);
            const pool = others.length > 0 ? others : activeSeatNumbers;
            const chosenSeat = pool[Math.floor(Math.random() * pool.length)];

            const baseAngle = seatAngles[chosenSeat] || 0;
            const finalAngle = 1800 + baseAngle + Math.floor(Math.random() * 5) * 360;

            await setDoc(doc(db, "rooms", ROOM_ID), {
                spin: {
                    spinId: Date.now() + "_" + Math.random(),
                    angle: finalAngle,
                    targetSeat: chosenSeat,
                    spinnerName: me.username
                }
            }, { merge: true });
        };

        function animateBottleTo(angle, targetSeat, spinnerName) {
            isSpinning = true;
            const canvas = document.getElementById("bottleCanvas");
            const hint = document.getElementById("turnHint");
            hint.textContent = `${spinnerName} fırladır...`;

            document.querySelectorAll(".seat").forEach(s => s.classList.remove("active"));
            canvas.style.transform = `rotate(${angle}deg)`;

            setTimeout(() => {
                isSpinning = false;
                const targetEl = document.getElementById(`seat-${targetSeat}`);
                const targetPlayer = currentSeatsMap[targetSeat];
                if (targetEl && targetPlayer) {
                    targetEl.classList.add("active");
                    hint.textContent = `Seçildi: ${targetPlayer.username}`;
                } else {
                    hint.textContent = "Butulkanı fırlat";
                }
            }, 4000);
        }

        const chatQuery = query(collection(db, "rooms", ROOM_ID, "messages"), orderBy("createdAt", "desc"), limit(30));
        onSnapshot(chatQuery, (snap) => {
            const feed = document.getElementById("chatFeed");
            const list = [];
            snap.forEach(d => list.push(d.data()));
            list.reverse();

            feed.innerHTML = list.map(m => {
                if (m.system) {
                    return `<div class="sys-row">${m.text}</div>`;
                }
                const sFem = m.gender === "Qadın";
                const cls = m.vip ? (sFem ? "sender-vip-qiz" : "sender-vip-oglan") : (sFem ? "sender-qiz" : "sender-oglan");
                return `
                    <div class="chat-row">
                        <img src="${m.avatar || DEFAULT_AVATAR}" alt="">
                        <div class="chat-body">
                            <span class="chat-sender ${cls}">${m.vip ? "👑 " : ""}${m.username}:</span>
                            <span>${m.text}</span>
                        </div>
                    </div>
                `;
            }).join("");
            feed.scrollTop = feed.scrollHeight;
        });

        window.sendRoomMessage = async function() {
            const input = document.getElementById("msgInput");
            const text = input.value.trim();
            if (!text) return;
            input.value = "";

            await addDoc(collection(db, "rooms", ROOM_ID, "messages"), {
                username: me.username,
                avatar: me.avatar || DEFAULT_AVATAR,
                gender: me.gender || "Kişi",
                vip: isVip,
                text: text,
                createdAt: Date.now()
            });
        };

        window.leaveAndGoProfile = async function() {
            if (mySeatNumber) {
                await updateDoc(doc(db, "rooms", ROOM_ID), {
                    [`seats.${mySeatNumber}`]: null
                }).catch(() => {});
            }
            window.location.href = "profil.html";
        };

        window.addEventListener("beforeunload", () => {
            if (mySeatNumber) {
                updateDoc(doc(db, "rooms", ROOM_ID), { [`seats.${mySeatNumber}`]: null }).catch(() => {});
            }
        });

        joinTable();
    </script>
</body>
</html>
