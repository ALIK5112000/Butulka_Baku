    <style>
* {
    -webkit-tap-highlight-color: transparent !important;
    outline: none !important;
}
/* ===== Ürək mağazası: ölçülər referans oyunun şəklinə görə (vw ilə) ===== */
.hs-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:10000}
.hs-overlay.open{display:flex}
.hs-modal{position:relative;width:80.7vw;border-radius:4.4vw 4.4vw 4vw 4vw;padding:0 0 1vw;
  background:linear-gradient(#ef5f60 0,#f38a8e 16%,#fbd3d4 38%,#fdeeed 62%,#fff4f3 100%);
  box-shadow:0 1vw 4vw rgba(0,0,0,.35);animation:hsin .25s ease}
.hs-modal::before{content:"";position:absolute;left:0;right:0;top:0;height:22vw;border-radius:4.4vw 4.4vw 0 0;pointer-events:none;opacity:.5;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 80'><g fill='none' stroke='white' stroke-width='2' opacity='.55'><path d='M30 40s-14-9-14-19a8 8 0 0 1 14-5 8 8 0 0 1 14 5c0 10-14 19-14 19z'/><path d='M150 30s-12-8-12-16a7 7 0 0 1 12-4 7 7 0 0 1 12 4c0 8-12 16-12 16z'/><path d='M255 45s-14-9-14-19a8 8 0 0 1 14-5 8 8 0 0 1 14 5c0 10-14 19-14 19z'/><circle cx='80' cy='55' r='5'/><circle cx='210' cy='20' r='4'/></g></svg>") center top/100% auto no-repeat}
@keyframes hsin{from{transform:translateY(5vw);opacity:0}}
.hs-title{position:relative;text-align:center;color:#fff;font:500 3.6vw/11.2vw Roboto,Arial,sans-serif;height:11.2vw}
.hs-close{position:absolute;top:-2.6vw;right:-2.6vw;width:8.3vw;height:8.3vw;border-radius:50%;background:#fff;border:0;padding:0;
  display:flex;align-items:center;justify-content:center;box-shadow:0 .6vw 1.8vw rgba(0,0,0,.3);z-index:3}
.hs-close svg{width:4.2vw;height:4.2vw}
.hs-scroll{position:relative;max-height:calc(100vh - 22vw);overflow-y:auto;padding:1vw 2.6vw 0}
.hs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4vw 2.2vw}
.hs-card{position:relative;background:#fff;border-radius:2.7vw;text-align:center;overflow:visible;
  box-shadow:0 .4vw 1.4vw rgba(0,0,0,.15);display:flex;flex-direction:column;align-items:center;height:37.6vw;padding:0 2.1vw 1.9vw}
.hs-top{padding-top:3.4vw;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;height:12.4vw;
  font:700 4.1vw/1.1 Roboto,Arial,sans-serif;color:#f0480f}
.hs-top .row{display:flex;align-items:center;gap:.3vw;justify-content:center}
.hs-top small{display:block;font:400 2.6vw/1.25 Roboto,Arial,sans-serif;color:#f59a00;margin-top:.4vw}
.hs-top.gold{color:#f59a00;font:400 2.6vw/1.3 Roboto,Arial,sans-serif;padding-top:3.2vw}
.hs-top.gold b{display:block;font:700 4.6vw/1 Roboto,Arial,sans-serif;color:#f08a00}
.hs-top.gold small{margin-top:0}
.hs-h{width:4.4vw;height:4.4vw;flex:none}
.hs-img{position:relative;flex:1;width:calc(100% + 4.2vw);margin:0 -2.1vw;display:flex;align-items:center;justify-content:center}
.hs-img::before{content:"";position:absolute;inset:0;
  background:repeating-conic-gradient(from 0deg at 50% 62%,rgba(255,232,120,.6) 0 7deg,rgba(255,255,255,0) 7deg 14deg);
  -webkit-mask-image:radial-gradient(circle at 50% 62%,#000 15%,transparent 72%);mask-image:radial-gradient(circle at 50% 62%,#000 15%,transparent 72%)}
.hs-img svg{position:relative;width:18vw;height:18vw;margin-top:.4vw}
.hs-btn{width:100%;height:6.8vw;border:0;border-radius:1.3vw;color:#fff;font:400 3.5vw/1 Roboto,Arial,sans-serif;padding:0;cursor:pointer;touch-action:manipulation;
  position:relative;overflow:hidden;transition:filter .1s,transform .1s}
.hs-btn.blue{background:#2c8ae6}.hs-btn.green{background:#93c83a}.hs-btn.cyan{background:#1ec3ee}
.hs-tag{position:absolute;top:-.8vw;left:50%;transform:translateX(-50%);white-space:nowrap;color:#fff;z-index:2;overflow:hidden;
  font:700 2.4vw/3.2vw Roboto,Arial,sans-serif;height:4.2vw;padding:0 1.8vw;border-radius:.6vw .6vw 0 0;
  clip-path:polygon(0 0,100% 0,100% 76%,50% 100%,0 76%)}
.hs-tag::after{content:"";position:absolute;top:0;bottom:0;left:-70%;width:45%;transform:skewX(-20deg);
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.85),rgba(255,255,255,0));animation:hsshine 2.6s ease-in-out infinite}
@keyframes hsshine{0%,45%{left:-70%}100%{left:140%}}
.hs-tag.pink{background:#e0007a}.hs-tag.purple{background:#9b4fc4}
.hs-sellers{margin:5.4vw 0 0;background:#fff;border-radius:3vw;height:10.6vw;display:flex;align-items:center;gap:1.6vw;padding:0 3.2vw;
  font:700 4vw/1 Roboto,Arial,sans-serif;color:#333;cursor:pointer}
.hs-sellers i{font-style:normal;font-weight:400;color:#888}
.hs-sellers .tri{font-size:3vw}
#urekBtn,#urekSayi{cursor:pointer}
#ustPanel .urek path{fill:#e8590c;stroke:#e9e2dc;stroke-width:1.9}
#urekSayi{color:#e9e2dc}

.hs-toast{position:fixed;left:50%;bottom:24vw;transform:translateX(-50%);max-width:80vw;text-align:center;z-index:10001;
  background:rgba(35,35,35,.92);color:#fff;font:500 3.5vw/1.3 Roboto,Arial,sans-serif;padding:2.6vw 4.6vw;border-radius:3vw;
  opacity:0;pointer-events:none;transition:opacity .2s}
.hs-toast.show{opacity:1}
.hs-fly{position:fixed;z-index:10002;width:5.4vw;height:5.4vw;pointer-events:none;will-change:transform,opacity}
.hs-fly svg{width:100%;height:100%;filter:drop-shadow(0 .3vw .5vw rgba(0,0,0,.3))}
.hs-btn:disabled{opacity:.6}

/* basılan düymə hissi */
.hs-btn:active{filter:brightness(1.12);transform:scale(.97)}
.hs-close{transition:transform .08s;touch-action:manipulation}
.hs-close:active{transform:scale(.88)}
.hs-sellers{transition:transform .08s,background .08s;touch-action:manipulation}
.hs-sellers:active{transform:scale(.98);background:#f1eded}

/* mətn seçilməsin / kopyalanmasın */
.hs-overlay,.hs-overlay *,.hs-toast,.hs-fly,#urekBtn,#urekSayi{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.hs-rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);opacity:1;pointer-events:none;animation:hsrip .55s ease-out forwards}
@keyframes hsrip{to{transform:scale(1);opacity:0}}

    </style>
</head>

const PACKS = [
  { top: 'PREMIUM<br>İCAZƏNAMƏ', icon: 'ticket', btn: 'Təfərrüatlar', color: 'blue' },
  { top: '<b>VIP</b><small>STATUS</small>', icon: 'crown', btn: 'Təfərrüatlar', color: 'blue' },
  { hearts: 14000, bonus: 40, cost: 10000, icon: 'chest', color: 'green', tag: ['Ən yaxşı təklif', 'pink'] },
  { hearts: 6500, bonus: 30, cost: 5000, icon: 'barrel', color: 'green' },
  { hearts: 1200, bonus: 20, cost: 1000, icon: 'pot', color: 'green', tag: ['Ən yaxşı', 'purple'] },
  { hearts: 575, bonus: 15, cost: 500, icon: 'bag', color: 'green' },
  { hearts: 270, bonus: 8, cost: 250, icon: 'gift', color: 'green' },
  { bonusKart: true, icon: 'hearts' }
];

const ov = document.createElement('div');
ov.className = 'hs-overlay';
ov.innerHTML = '<div class="hs-modal"><button class="hs-close"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19" stroke="#ef5f60" stroke-width="3.2" stroke-linecap="round"/></svg></button><div class="hs-title">Ürəklər satın al</div><div class="hs-scroll"><div class="hs-grid"></div><div class="hs-sellers"><span class="tri">▶</span><span>💬</span><span>Satıcılardan al</span><i>(1)</i></div></div></div>';
const grid = ov.querySelector('.hs-grid');
const toastEl = document.createElement('div');
toastEl.className = 'hs-toast';

let toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600);
}

const B = {};
PACKS.forEach(p => {
  if (p.bonusKart) { grid.appendChild(bonusKartiYarat(p)); return; }
  const c = document.createElement('div');
  c.className = 'hs-card';
  const top = p.hearts
    ? '<div class="hs-top"><div class="row">' + H + '<span>' + p.hearts + '</span></div>' + (p.bonus ? '<small>' + p.bonus + '% BONUS</small>' : '') + '</div>'
    : '<div class="hs-top gold">' + p.top + '</div>';
  c.innerHTML = (p.tag ? '<div class="hs-tag ' + p.tag[1] + '">' + p.tag[0] + '</div>' : '') + top +
    '<div class="hs-img">' + ICONS[p.icon] + '</div><button class="hs-btn ' + p.color + '">' + (p.cost || p.btn) + '</button>';
  const b = c.querySelector('button');
  if (p.cost) b.onclick = () => al(p, b);

});

let openedAt = 0;
const open = () => { openedAt = Date.now(); ov.classList.add('open'); };
const close = () => ov.classList.remove('open');
ov.querySelector('.hs-close').onclick = close;
ov.addEventListener('pointerdown', e => {
  const t = e.target.closest && e.target.closest('.hs-btn,.hs-close,.hs-sellers');
  if (!t) return;
  if (navigator.vibrate) navigator.vibrate(12);
  const r = t.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2;   // basılan yerdən yayılan dalğa
  const s = document.createElement('span');
  s.className = 'hs-rip';
  s.style.cssText = 'width:' + d + 'px;height:' + d + 'px;left:' + (e.clientX - r.left - d / 2) + 'px;top:' + (e.clientY - r.top - d / 2) + 'px';
  t.appendChild(s);
  setTimeout(() => s.remove(), 600);
});
['selectstart', 'contextmenu', 'dragstart'].forEach(n => ov.addEventListener(n, e => e.preventDefault()));
ov.addEventListener('click', e => { if (e.target === ov && Date.now() - openedAt > 500) close(); });
document.body.appendChild(ov);
document.body.appendChild(toastEl);

/* ---- ❤️-ə toxunanda aç (üstünü qat örtsə belə) ---- */
function inside(el, x, y) {
  if (!el) return false;
  const r = el.getBoundingClientRect();
  if (!r.width || !r.height) return false;
  return x >= r.left - 10 && x <= r.right + 10 && y >= r.top - 10 && y <= r.bottom + 10;
}
let lastOpen = 0;
window.addEventListener('click', e => {
  if (ov.classList.contains('open') || Date.now() - lastOpen < 400) return;
  if (inside(document.getElementById('urekBtn'), e.clientX, e.clientY) || inside(document.getElementById('urekSayi'), e.clientX, e.clientY)) {
    lastOpen = Date.now();
    open();
  }
}, true);

/* ---- Satın alma: jeton -> bonus ürək ---- */
function jetonAlani(p) {
  if (JETON_ALANI) return JETON_ALANI;
  for (const k of ADAYLAR) if (p[k] !== undefined && p[k] !== null && isFinite(Number(p[k]))) return k;
  return null;
}
function yaz(n) {
  if (window.urekYaz) window.urekYaz(n);
  else document.getElementById('urekSayi').textContent = n;
}
function pulse() {
  const h = document.getElementById('urekBtn');
  if (h && h.animate) h.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.3)' }, { transform: 'scale(1)' }], { duration: 240 });
}
function uc(sx, sy, evvel, qazanc, bitdi) {
  const hb = document.getElementById('urekBtn').getBoundingClientRect();
  const tx = hb.left + hb.width / 2, ty = hb.top + hb.height / 2;
  const S = innerWidth * 0.054, N = 8;
  let gelen = 0;
  for (let i = 0; i < N; i++) {
    const h = document.createElement('div');
    h.className = 'hs-fly';
    h.innerHTML = H.replace('class="hs-h"', '');
    h.style.left = (sx - S / 2) + 'px';
    h.style.top = (sy - S / 2) + 'px';
    document.body.appendChild(h);
    const dx = tx - sx, dy = ty - sy;
    const ox = (Math.random() - 0.5) * innerWidth * 0.25, oy = -Math.random() * innerWidth * 0.12;
    const a = h.animate([
      { transform: 'translate(0,0) scale(.6)', opacity: 0 },
      { transform: 'translate(' + (dx * 0.45 + ox) + 'px,' + (dy * 0.45 + oy) + 'px) scale(1)', opacity: 1, offset: 0.45 },
      { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(.55)', opacity: 1 }
    ], { duration: 850, delay: i * 70, easing: 'ease-in', fill: 'both' });
    a.onfinish = () => {
      h.remove();
      gelen++;
      yaz(Math.round(evvel + qazanc * gelen / N));
      pulse();
      if (gelen === N) bitdi();
    };
  }
}

let mesgul = false;
/* Ümumi axın: ürək artımını animasiya ilə göstərir. islem(ref) -> artan ürək sayını qaytarır */
async function satinAl(btn, islem) {
  if (mesgul) return;
  const cari = cariOyuncu();
  if (!cari || !cari.docId) { toast('Hesaba giriş edilməyib'); return; }
  mesgul = true;
  const br = btn.getBoundingClientRect();
  const sx = br.left + br.width / 2, sy = br.top + br.height / 2;
  const evvel = parseInt(document.getElementById('urekSayi').textContent) || 0;
  window.__urekHold = true;
  const sigorta = setTimeout(() => { window.__urekHold = false; }, 8000);
  const buraxdir = () => {
    clearTimeout(sigorta);
    window.__urekHold = false;
    if (window.__urekSon != null) yaz(window.__urekSon);
  };
  let qazanc;
  try {
    qazanc = await islem(doc(fsdb, 'users', cari.docId));
  } catch (e) {
    buraxdir();
    mesgul = false;
    if (e.message === 'YETMIR') toast('Kifayət qədər jetonunuz yoxdur');
    else if (e.message === 'HELE') toast('Bonus hələ hazır deyil');
    else if (e.message === 'ALAN') toast('Jeton sahəsi tapılmadı. Sahələr: ' + e.acarlar);
    else { console.error(e); toast('Xəta baş verdi, yenidən cəhd edin'); }
    return;
  }
  close();
  uc(sx, sy, evvel, qazanc, () => {
    buraxdir();
    mesgul = false;
  });
}

/* Jeton ilə alış */
function al(p, btn) {
  return satinAl(btn, ref => runTransaction(fsdb, async tx => {
    const s = await tx.get(ref);
    const d = s.data() || {};
    const sahe = jetonAlani(d);
    if (!sahe) { const e = new Error('ALAN'); e.acarlar = Object.keys(d).join(', '); throw e; }
    const jeton = Number(d[sahe]) || 0;
    if (jeton < p.cost) throw new Error('YETMIR');
    tx.update(ref, { [sahe]: jeton - p.cost, hearts: (Number(d.hearts) || 0) + p.hearts });
    return p.hearts;
  }));
}

/* ================= 40 dəqiqəlik bonus ================= */
const BONUS_SANIYE = 2400;                         // 40 dəqiqə
const ODUL = [200, 300, 400, 500, 600, 700, 800, 900, 1000]; // 1000-dən sonra yenə 200
const BONUS_PAKET = { hearts: 105, cost: 100 };               // yaşıl düymə: 100 jetona 105 ürək
const bonus = { yuklendi: false, qalan: BONUS_SANIYE, seviyye: 0 };
const CLOCK = '<svg viewBox="0 0 24 24" style="width:2.4vw;height:2.4vw;vertical-align:-.35vw;margin-right:.6vw"><circle cx="12" cy="13.5" r="8" fill="none" stroke="#fff" stroke-width="2.6"/><path d="M12 9v5l3 2M9.5 2.5h5" stroke="#fff" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg>';
const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
const lk = () => 'bonus_qalan_' + ((cariOyuncu() || {}).docId);

function bonusKartiYarat() {
  const c = document.createElement('div');
  c.className = 'hs-card';
  c.innerHTML = '<div class="hs-tag purple"></div><div class="hs-top"><div class="row">' + H + '<span></span></div><small></small></div>' +
    '<div class="hs-img">' + ICONS.hearts + '</div><button class="hs-btn green"></button>';
  B.tag = c.querySelector('.hs-tag');
  B.num = c.querySelector('.row span');
  B.sub = c.querySelector('small');
  B.btn = c.querySelector('button');
  B.btn.onclick = () => (bonus.yuklendi && bonus.qalan <= 0) ? bonusAl() : al(BONUS_PAKET, B.btn);
  return c;
}
function bonusGuncelle() {
  if (!B.tag) return;
  const l = bonus.seviyye % ODUL.length;
  const hazir = bonus.yuklendi && bonus.qalan <= 0;
  B.num.textContent = BONUS_PAKET.hearts;                    // həmişə 105 (jetonla alınır)
  B.sub.textContent = '🎁 +' + ODUL[l] + ' ürək';          // sayğac bitəndə veriləcək bonus
  B.tag.innerHTML = hazir ? 'Hazırdır' : CLOCK + fmt(bonus.qalan);
  B.btn.textContent = hazir ? 'Götür' : BONUS_PAKET.cost;
  B.btn.className = 'hs-btn ' + (hazir ? 'cyan' : 'green');
}
function saxlaLocal() {
  try { localStorage.setItem(lk(), JSON.stringify({ q: bonus.qalan, l: bonus.seviyye })); } catch (_) {}
}
function yazFs() {
  const cari = cariOyuncu();
  if (!cari || !cari.docId || !bonus.yuklendi) return;
  updateDoc(doc(fsdb, 'users', cari.docId), { bonusQalan: bonus.qalan }).catch(() => {});
}
async function bonusBasla() {
  const cari = cariOyuncu();
  if (!cari || !cari.docId) return;
  try {
    const d = (await getDoc(doc(fsdb, 'users', cari.docId))).data() || {};
    bonus.seviyye = Number.isFinite(d.bonusSeviyye) ? d.bonusSeviyye : 0;
    let q = Number.isFinite(d.bonusQalan) ? d.bonusQalan : BONUS_SANIYE;
    try { // eyni cihazda daha dəqiq qalıq varsa (eyni səviyyə üçün) onu götür
      const l = JSON.parse(localStorage.getItem(lk()) || 'null');
      if (l && l.l === bonus.seviyye && Number.isFinite(l.q) && l.q < q) q = l.q;
    } catch (_) {}
    bonus.qalan = Math.max(0, Math.min(BONUS_SANIYE, q));
    bonus.yuklendi = true;
    bonusGuncelle();
  } catch (e) { console.error(e); }
}
let sonTik = Date.now(), tikSay = 0;
setInterval(() => {
  const indi = Date.now();
  const dt = Math.min(5, Math.round((indi - sonTik) / 1000));
  if (dt < 1) return;
  sonTik = indi;
  if (!bonus.yuklendi || bonus.qalan <= 0) return;
  if (document.visibilityState !== 'visible') return;
  const oe = document.getElementById('oyunEkrani');
  if (!oe || !oe.classList.contains('aktiv')) return;   // yükləmə ekranında sayılmır
  bonus.qalan = Math.max(0, bonus.qalan - dt);
  saxlaLocal();
  bonusGuncelle();
  tikSay += dt;
  if (bonus.qalan <= 0 || tikSay >= 20) { tikSay = 0; yazFs(); }
}, 1000);
document.addEventListener('visibilitychange', () => { sonTik = Date.now(); if (document.visibilityState === 'hidden') yazFs(); });
window.addEventListener('pagehide', yazFs);

function bonusAl() {
  if (!bonus.yuklendi) return;
  if (bonus.qalan > 0) { toast('Bonus üçün hələ ' + fmt(bonus.qalan) + ' qalıb'); return; }
  return satinAl(B.btn, async ref => {
    await updateDoc(ref, { bonusQalan: 0 }).catch(() => {});
    const odul = await runTransaction(fsdb, async tx => {
      const d = (await tx.get(ref)).data() || {};
      if (Number.isFinite(d.bonusQalan) && d.bonusQalan > 0) throw new Error('HELE');
      const l = (Number.isFinite(d.bonusSeviyye) ? d.bonusSeviyye : 0) % ODUL.length;
      tx.update(ref, { hearts: (Number(d.hearts) || 0) + ODUL[l], bonusQalan: BONUS_SANIYE, bonusSeviyye: (l + 1) % ODUL.length });
      return ODUL[l];
    });
    bonus.seviyye = (bonus.seviyye + 1) % ODUL.length;
    bonus.qalan = BONUS_SANIYE;
    saxlaLocal();
    bonusGuncelle();
    return odul;
  });
}
bonusBasla();
bonusGuncelle();

window.HeartShop = { open, close };

</script>
