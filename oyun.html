<script>
(function () {
  const CLIP_COST = 9;

  // Köhnə qlobal yaddaş qalığı varsa təmizlə ki, çıxıb-girəndə ilişib qalmasın
  localStorage.removeItem("bb_global_active_clip_v1");

  const POPULAR_CLIPS = [
    { videoId: "nVjsGKrE6E8", title: "Lana Del Rey - Summertime Sadness", thumb: "https://i.ytimg.com/vi/nVjsGKrE6E8/mqdefault.jpg" },
    { videoId: "M7lc1UVf-VE", title: "OMER DEEP - Medusa (Original Mix)", thumb: "https://i.ytimg.com/vi/M7lc1UVf-VE/mqdefault.jpg" },
    { videoId: "60ItHLz5WEA", title: "Alan Walker - Faded", thumb: "https://i.ytimg.com/vi/60ItHLz5WEA/mqdefault.jpg" },
    { videoId: "kJQP7kiw5Fk", title: "Luis Fonsi - Despacito", thumb: "https://i.ytimg.com/vi/kJQP7kiw5Fk/mqdefault.jpg" },
    { videoId: "JGwWNGJdvx8", title: "Ed Sheeran - Shape of You", thumb: "https://i.ytimg.com/vi/JGwWNGJdvx8/mqdefault.jpg" },
    { videoId: "RgKAFK5djSk", title: "Wiz Khalifa - See You Again", thumb: "https://i.ytimg.com/vi/RgKAFK5djSk/mqdefault.jpg" },
    { videoId: "fRh_vgS2dFE", title: "Justin Bieber - Sorry", thumb: "https://i.ytimg.com/vi/fRh_vgS2dFE/mqdefault.jpg" },
    { videoId: "09R8_2nJtjg", title: "Maroon 5 - Sugar", thumb: "https://i.ytimg.com/vi/09R8_2nJtjg/mqdefault.jpg" },
    { videoId: "OPf0YbXqDm0", title: "Mark Ronson - Uptown Funk", thumb: "https://i.ytimg.com/vi/OPf0YbXqDm0/mqdefault.jpg" },
    { videoId: "hT_nvWreIhg", title: "OneRepublic - Counting Stars", thumb: "https://i.ytimg.com/vi/hT_nvWreIhg/mqdefault.jpg" },
    { videoId: "YQHsXMglC9A", title: "Adele - Hello", thumb: "https://i.ytimg.com/vi/YQHsXMglC9A/mqdefault.jpg" },
    { videoId: "pRpeEdMmmQ0", title: "Shakira - Waka Waka", thumb: "https://i.ytimg.com/vi/pRpeEdMmmQ0/mqdefault.jpg" }
  ];

  // Yalnız cari sessiya (tab) ərzində masa üzrə aktiv kliplər (çıxıb-girəndə sıfırlanır)
  const tableClipsMap = {};
  let activeClipData = null;
  let progressInterval = null;
  let zoomLevel = 0;
  let isMuted = false;
  let ytPlayer = null;

  function getActiveTableId() {
    return (document.getElementById("masaNo")?.textContent || "511").trim();
  }

  // 1. Oyundakı REAL profil şəklini və adını tap (həm <img>, həm background-image yoxlanır)
  function getRealPlayerInfo() {
    const uid = localStorage.getItem("userId") || localStorage.getItem("uid") || localStorage.getItem("id") || "";
    let foundAvatar = "";
    let foundName = localStorage.getItem("userName") || localStorage.getItem("ad") || localStorage.getItem("username") || "";

    const masaEl = document.getElementById("masa");
    if (masaEl) {
      // Bütün oturacaq elementlərini yoxla
      const nodes = Array.from(masaEl.querySelectorAll("*"));
      for (const el of nodes) {
        if (el.id === "butulka") continue;

        // A) <img> varsa
        if (el.tagName === "IMG" && el.src && !el.src.includes("butulka")) {
          foundAvatar = el.src;
          const parentText = el.parentElement?.innerText?.trim();
          if (parentText && !foundName) foundName = parentText.split("\n")[0];
          break;
        }

        // B) CSS background-image varsa
        const bg = window.getComputedStyle(el).backgroundImage;
        if (bg && bg !== "none" && bg.startsWith("url(") && !bg.includes("butulka") && !bg.includes("taxta")) {
          foundAvatar = bg.slice(4, -1).replace(/["']/g, "");
          const txt = el.innerText?.trim() || el.parentElement?.innerText?.trim();
          if (txt && !foundName) foundName = txt.split("\n")[0];
          break;
        }
      }
    }

    if (!foundAvatar) {
      foundAvatar = localStorage.getItem("userAvatar") || localStorage.getItem("avatar") || localStorage.getItem("sekil") || localStorage.getItem("photoURL") || "";
    }
    if (!foundName) foundName = "Oyunçu";
    return { uid, name: foundName, avatar: foundAvatar };
  }

  // 2. Masa dəyişəndə klipi həmin masaya görə yenilə (əvvəlki masanın klipi səninlə gəlməsin!)
  let lastTableId = getActiveTableId();
  setInterval(function () {
    const currentTable = getActiveTableId();
    if (currentTable !== lastTableId) {
      lastTableId = currentTable;
      const clipForNewTable = tableClipsMap[currentTable];
      if (clipForNewTable && clipForNewTable.videoId) {
        const elapsed = Math.floor((Date.now() - clipForNewTable.startedAt) / 1000);
        if (elapsed < (clipForNewTable.durationSec || 240)) {
          renderClipWidget(clipForNewTable);
          return;
        }
      }
      // Yeni masada klip yoxdursa pleyeri gizlət və dayandır
      hideAndStopWidget();
    }
  }, 500);

  // 3. Reklamsız video oynatma (Invidious/Piped təmiz embed + YouTube fallback)
  function mountCleanPlayer(videoId, startSec) {
    const wrap = document.getElementById("bb-live-video-wrap");
    wrap.innerHTML = "";
    ytPlayer = null;

    // Reklamsız təmiz pleyer iframe-i
    const iframe = document.createElement("iframe");
    iframe.style.cssText = "width:100%; height:100%; border:0; pointer-events:none;";
    iframe.allow = "autoplay; encrypted-media";
    iframe.src =
      "https://www.youtube-nocookie.com/embed/" +
      encodeURIComponent(videoId) +
      "?autoplay=1&controls=0&rel=0&modestbranding=1&iv_load_policy=3&playsinline=1&enablejsapi=1&start=" +
      Math.max(0, startSec);

    wrap.appendChild(iframe);

    // Səs və bitmə vaxtını idarə etmək üçün postMessage API
    iframe.onload = function () {
      setPlayerVolume(Number(document.getElementById("bb-volume-slider").value || 85));
    };
  }

  function sendYTCommand(func, args) {
    const iframe = document.querySelector("#bb-live-video-wrap iframe");
    if (!iframe || !iframe.contentWindow) return;
    iframe.contentWindow.postMessage(
      JSON.stringify({ event: "command", func: func, args: args || [] }),
      "*"
    );
  }

  function setPlayerVolume(vol) {
    if (vol <= 0 || isMuted) {
      sendYTCommand("mute");
    } else {
      sendYTCommand("unMute");
      sendYTCommand("setVolume", [vol]);
    }
  }

  // 4. Qoşulan mahnının adını chatda göstər
  function postMusicNoticeInChat(playerName, trackTitle) {
    const mesajlarBox = document.getElementById("mesajlar");
    if (!mesajlarBox) return;
    const row = document.createElement("div");
    row.style.cssText = "margin:4px 8px; padding:6px 10px; border-radius:10px; background:#fff8e6; border:1px solid #f5d68a; font-size:12px; color:#5a4300; font-weight:600; max-width:65%;";
    row.textContent = "🎵 " + playerName + " mahnı qoşdu: " + trackTitle;
    mesajlarBox.appendChild(row);
    mesajlarBox.scrollTop = mesajlarBox.scrollHeight;
  }

  function openClipModal() {
    const modal = document.getElementById("bb-clip-modal");
    if (modal) {
      modal.style.display = "flex";
      switchTab("popular");
    }
  }

  document.addEventListener("click", function (e) {
    const btn = e.target.closest("#musiqiBtn1, #musiqiBtn2, .musiqi-btn, #bb-dj-avatar-box");
    if (btn) {
      e.preventDefault();
      e.stopPropagation();
      openClipModal();
    }
  }, true);

  document.getElementById("bb-clip-close").addEventListener("click", function () {
    document.getElementById("bb-clip-modal").style.display = "none";
  });

  document.querySelectorAll(".bb-tab-btn").forEach(function (b) {
    b.addEventListener("click", function () { switchTab(b.dataset.tab); });
  });

  function switchTab(tab) {
    document.querySelectorAll(".bb-tab-btn").forEach(function (b) {
      b.style.opacity = b.dataset.tab === tab ? "1" : "0.45";
    });
    const titleEl = document.getElementById("bb-tab-title");
    const searchBox = document.getElementById("bb-search-box");

    if (tab === "search") {
      titleEl.textContent = "YouTube-da mahnı axtar (9 bonus)";
      searchBox.style.display = "block";
      const inp = document.getElementById("bb-yt-query");
      setTimeout(() => inp.focus(), 80);
      if (inp.value.trim()) searchYouTubeFast(inp.value.trim());
      else renderGrid(POPULAR_CLIPS.slice(0, 8));
    } else if (tab === "favorites") {
      titleEl.textContent = "Sevimli musiqilər";
      searchBox.style.display = "none";
      renderGrid(JSON.parse(localStorage.getItem("bb_fav_clips") || "[]"));
    } else if (tab === "history") {
      titleEl.textContent = "Son qoşulan kliplər";
      searchBox.style.display = "none";
      renderGrid(JSON.parse(localStorage.getItem("bb_hist_clips") || "[]"));
    } else {
      titleEl.textContent = "Populyar bölməsindən musiqi seç (9 bonus)";
      searchBox.style.display = "none";
      renderGrid(POPULAR_CLIPS);
    }
  }

  // 5. İŞLƏYƏN YOUTUBE AXTARIŞI (JSONP Suggest + çoxmənbəli video ID tapıcı)
  function getYouTubeSuggestionsJSONP(query) {
    return new Promise((resolve) => {
      const cbName = "ytSugCb_" + Date.now() + "_" + Math.floor(Math.random() * 1000);
      const script = document.createElement("script");
      const timer = setTimeout(() => {
        delete window[cbName];
        script.remove();
        resolve([]);
      }, 3000);

      window[cbName] = function (data) {
        clearTimeout(timer);
        delete window[cbName];
        script.remove();
        const list = Array.isArray(data?.[1]) ? data[1].map(item => item[0]) : [];
        resolve(list);
      };

      script.src =
        "https://suggestqueries.google.com/complete/search?client=youtube&ds=yt&q=" +
        encodeURIComponent(query) +
        "&callback=" +
        cbName;
      document.head.appendChild(script);
    });
  }

  async function resolveVideoByTitle(songTitle) {
    const endpoints = [
      "https://pipedapi.kavin.rocks/search?filter=videos&q=",
      "https://pipedapi.adminforge.de/search?filter=videos&q=",
      "https://api.piped.projectsegfau.lt/search?filter=videos&q=",
      "https://inv.nadeko.net/api/v1/search?type=video&q=",
      "https://invidious.nerdvpn.de/api/v1/search?type=video&q="
    ];

    for (const base of endpoints) {
      try {
        const ctrl = new AbortController();
        const t = setTimeout(() => ctrl.abort(), 3500);
        const r = await fetch(base + encodeURIComponent(songTitle), { signal: ctrl.signal });
        clearTimeout(t);
        if (!r.ok) continue;
        const j = await r.json();

        if (Array.isArray(j.items)) {
          const found = j.items.filter(x => x.url && x.url.includes("v=")).slice(0, 12).map(x => {
            const vid = x.url.split("v=")[1].split("&")[0];
            return {
              videoId: vid,
              title: x.title || songTitle,
              thumb: "https://i.ytimg.com/vi/" + vid + "/mqdefault.jpg"
            };
          });
          if (found.length) return found;
        }
        if (Array.isArray(j)) {
          const found = j.filter(x => x.videoId).slice(0, 12).map(x => ({
            videoId: x.videoId,
            title: x.title || songTitle,
            thumb: "https://i.ytimg.com/vi/" + x.videoId + "/mqdefault.jpg"
          }));
          if (found.length) return found;
        }
      } catch (_) {}
    }
    return [];
  }

  async function searchYouTubeFast(query) {
    const grid = document.getElementById("bb-clip-grid");
    grid.style.display = "block";
    grid.innerHTML = '<div style="text-align:center; color:#888; padding:26px 0; font-size:14px;">Axtarılır...</div>';

    // Əvvəlcə real video siyahısını yoxla
    const directVideos = await resolveVideoByTitle(query);
    if (directVideos.length > 0) {
      renderGrid(directVideos);
      return;
    }

    // Əgər şəbəkə video endpoint-lərini bloklayıbsa, YouTube-un öz JSONP təkliflərini göstər
    const suggestions = await getYouTubeSuggestionsJSONP(query);
    if (suggestions.length > 0) {
      grid.style.display = "block";
      grid.innerHTML = "";
      suggestions.forEach((sug) => {
        const row = document.createElement("div");
        row.style.cssText = "padding:10px 12px; border-bottom:1px solid #f0f0f0; display:flex; align-items:center; justify-content:space-between; cursor:pointer; font-size:13px; color:#222;";
        row.innerHTML = `<span>🎵 ${sug}</span><span style="background:#9ccc65; color:#fff; font-size:11px; padding:2px 7px; border-radius:8px; font-weight:700;">Seç</span>`;
        row.addEventListener("click", async () => {
          row.style.opacity = "0.5";
          const vids = await resolveVideoByTitle(sug);
          if (vids.length > 0) startClipWithBonus(vids[0]);
          else alert("Bu mahnı hazırda əlçatan deyil, başqasını yoxla.");
        });
        grid.appendChild(row);
      });
      return;
    }

    renderGrid(POPULAR_CLIPS.filter(c => c.title.toLowerCase().includes(query.toLowerCase())));
  }

  let searchTimer = null;
  document.getElementById("bb-yt-query").addEventListener("input", function (e) {
    clearTimeout(searchTimer);
    const q = e.target.value.trim();
    searchTimer = setTimeout(function () {
      if (!q) renderGrid(POPULAR_CLIPS.slice(0, 8));
      else searchYouTubeFast(q);
    }, 350);
  });

  function renderGrid(items) {
    const grid = document.getElementById("bb-clip-grid");
    grid.innerHTML = "";
    if (!items.length) {
      grid.style.display = "block";
      grid.innerHTML = '<div style="text-align:center; color:#777; padding:28px 0; font-size:14px;">Hər hansı musiqi tapılmadı</div>';
      return;
    }
    const favs = JSON.parse(localStorage.getItem("bb_fav_clips") || "[]");
    grid.style.display = "grid";

    items.forEach(function (clip) {
      const isFav = favs.some(x => x.videoId === clip.videoId);
      const card = document.createElement("div");
      card.style.cssText = "border-radius:10px; overflow:hidden; background:#fafafa; border:1px solid #eee; cursor:pointer; position:relative;";
      card.innerHTML = `
        <div style="position:relative;">
          <img src="${clip.thumb}" style="width:100%; height:78px; object-fit:cover; display:block;" />
          <span class="bb-fav-star" style="position:absolute; top:4px; right:5px; font-size:16px; color:#fff; text-shadow:0 1px 4px #000;">${isFav ? "⭐" : "☆"}</span>
          <span style="position:absolute; bottom:4px; right:4px; background:rgba(0,0,0,0.75); color:#fff; font-size:10px; padding:1px 5px; border-radius:4px;">9 🔶</span>
        </div>
        <div style="padding:6px; font-size:11px; font-weight:600; color:#222; line-height:1.25; height:32px; overflow:hidden;">${clip.title}</div>
      `;

      card.querySelector(".bb-fav-star").addEventListener("click", function (ev) {
        ev.stopPropagation();
        let list = JSON.parse(localStorage.getItem("bb_fav_clips") || "[]");
        if (list.some(x => x.videoId === clip.videoId)) {
          list = list.filter(x => x.videoId !== clip.videoId);
          ev.currentTarget.textContent = "☆";
        } else {
          list.unshift(clip);
          ev.currentTarget.textContent = "⭐";
        }
        localStorage.setItem("bb_fav_clips", JSON.stringify(list.slice(0, 30)));
      });

      card.addEventListener("click", function () { startClipWithBonus(clip); });
      grid.appendChild(card);
    });
  }

  function startClipWithBonus(clip) {
    const urekEl = document.getElementById("urekSayi");
    const currentHearts = parseInt(urekEl?.textContent || "0", 10);

    if (currentHearts < CLIP_COST) {
      alert("Klip qoşmaq üçün minimum 9 bonus lazımdır!");
      return;
    }

    if (urekEl) urekEl.textContent = String(currentHearts - CLIP_COST);

    const hist = JSON.parse(localStorage.getItem("bb_hist_clips") || "[]");
    localStorage.setItem("bb_hist_clips", JSON.stringify([clip, ...hist.filter(x => x.videoId !== clip.videoId)].slice(0, 20)));
    document.getElementById("bb-clip-modal").style.display = "none";

    const tableId = getActiveTableId();
    const player = getRealPlayerInfo();

    const payload = {
      tableId: tableId,
      clipInstanceId: Date.now() + "_clip",
      videoId: clip.videoId,
      title: clip.title,
      djName: player.name,
      djAvatar: player.avatar,
      startedAt: Date.now(),
      durationSec: 240
    };

    // Yalnız bu masanın yaddaşına yaz (başqa masaya keçəndə səninlə gəlməsin!)
    tableClipsMap[tableId] = payload;

    // Chatda qoşulan mahnının adını göstər
    postMusicNoticeInChat(player.name, clip.title);

    if (typeof window.bbBroadcastClip === "function") {
      window.bbBroadcastClip(payload, CLIP_COST);
    }

    renderClipWidget(payload);
  }

  function renderClipWidget(data) {
    activeClipData = data;
    const widget = document.getElementById("bb-live-clip-widget");
    const avatarEl = document.getElementById("bb-dj-avatar");

    const livePlayer = getRealPlayerInfo();
    avatarEl.src = data.djAvatar || livePlayer.avatar || "images/butulka/butulka.png";
    widget.style.display = "block";

    const elapsedSec = Math.max(0, Math.floor((Date.now() - Number(data.startedAt || Date.now())) / 1000));
    mountCleanPlayer(data.videoId, elapsedSec);
    startCircularRing(data.startedAt, data.durationSec || 240);
  }

  window.playClipOnWidget = function (data) {
    if (!data || !data.videoId) return;
    if (data.tableId && String(data.tableId) !== getActiveTableId()) return;
    tableClipsMap[getActiveTableId()] = data;
    renderClipWidget(data);
  };

  function startCircularRing(startedAt, durationSec) {
    clearInterval(progressInterval);
    const circle = document.getElementById("bb-ring-progress");
    const circumference = 2 * Math.PI * 33;

    progressInterval = setInterval(function () {
      const elapsed = (Date.now() - Number(startedAt)) / 1000;
      const ratio = Math.min(1, Math.max(0, elapsed / durationSec));
      circle.style.strokeDashoffset = String(circumference * (1 - ratio));

      if (elapsed >= durationSec) {
        delete tableClipsMap[getActiveTableId()];
        hideAndStopWidget();
      }
    }, 300);
  }

  function hideAndStopWidget() {
    clearInterval(progressInterval);
    activeClipData = null;
    const wrap = document.getElementById("bb-live-video-wrap");
    if (wrap) wrap.innerHTML = "";
    const w = document.getElementById("bb-live-clip-widget");
    if (w) w.style.display = "none";
  }

  // Kvadrat düymə: 1-ci klik -> 1x, 2-ci klik -> 2x, 3-cü klik -> orijinal
  document.getElementById("bb-zoom-clip-btn").addEventListener("click", function () {
    zoomLevel = (zoomLevel + 1) % 3;
    const widget = document.getElementById("bb-live-clip-widget");
    const topBox = document.getElementById("bb-live-top");

    if (zoomLevel === 0) {
      widget.style.width = "256px";
      topBox.style.height = "84px";
    } else if (zoomLevel === 1) {
      widget.style.width = "310px";
      topBox.style.height = "122px";
    } else {
      widget.style.width = "calc(100% - 16px)";
      topBox.style.height = "170px";
    }
  });

  const volSlider = document.getElementById("bb-volume-slider");
  const muteBtn = document.getElementById("bb-mute-clip-btn");

  volSlider.addEventListener("input", function () {
    const v = Number(volSlider.value);
    isMuted = v === 0;
    muteBtn.textContent = isMuted ? "🔇" : "🔊";
    setPlayerVolume(v);
  });

  muteBtn.addEventListener("click", function () {
    isMuted = !isMuted;
    const v = isMuted ? 0 : (Number(volSlider.value) || 80);
    if (!isMuted && Number(volSlider.value) === 0) volSlider.value = 80;
    muteBtn.textContent = isMuted ? "🔇" : "🔊";
    setPlayerVolume(v);
  });
})();
</script>
</body>
<script type="module">
for (const f of ["core/firebase", "core/config", "oyun/yardimci", "oyun/dostlar", "oyun/masalar", "oyun/masa", "oyun/panel", "oyun/raund", "oyun/chat"]) {
try { await import("./js/" + f + ".js"); }
catch (e) {
document.body.insertAdjacentHTML("afterbegin",
'<div style="position:fixed;z-index:99;top:0;left:0;right:0;background:#fff;color:red;padding:8px;font-size:14px;word-break:break-all">' + f + ".js: " + e.message + "</div>");
break;
}
}
</script>
