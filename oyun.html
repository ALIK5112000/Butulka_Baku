* {

/* ===== Ürək mağazası: ölçülər referans oyunun şəklinə görə (vw ilə) ===== */
.hs-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:10000}
.hs-overlay.open{display:flex}
.hs-modal{position:relative;width:80.7vw;border-radius:4.4vw 4.4vw 4vw 4vw;padding:0 0 1vw;
  background:linear-gradient(#ef5f60 0,#f38a8e 16%,#fbd3d4 38%,#fdeeed 62%,#fff4f3 100%);
  box-shadow:0 1vw 4vw rgba(0,0,0,.35);animation:hsin .25s ease}
.hs-modal::before{content:"";position:absolute;left:0;right:0;top:0;height:22vw;border-radius:4.4vw 4.4vw 0 0;pointer-events:none;opacity:.5;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 80'><g fill='none' stroke='white' stroke-width='2' opacity='.55'><path d='M30 40s-14-9-14-19a8 8 0 0 1 14-5 8 8 0 0 1 14 5c0 10-14 19-14 19z'/><path d='M150 30s-12-8-12-16a7 7 0 0 1 12-4 7 7 0 0 1 12 4c0 8-12 16-12 16z'/><path d='M255 45s-14-9-14-19a8 8 0 0 1 14-5 8 8 0 0 1 14 5c0 10-14 19-14 19z'/><circle cx='80' cy='55' r='5'/><circle cx='210' cy='20' r='4'/></g></svg>") center top/100% auto no-repeat}
@keyframes hsin{from{transform:translateY(5vw);opacity:0}}
.hs-title{position:relative;text-align:center;color:#fff;font:500 3.6vw/11.2vw Roboto,Arial,sans-serif;height:11.2vw}
.hs-close{position:absolute;top:-2.6vw;right:-2.6vw;width:8.3vw;height:8.3vw;border-radius:50%;background:#fff;border:0;padding:0;
  display:flex;align-items:center;justify-content:center;box-shadow:0 .6vw 1.8vw rgba(0,0,0,.3);z-index:3}
.hs-close svg{width:4.2vw;height:4.2vw}
.hs-scroll{position:relative;max-height:calc(100vh - 22vw);overflow-y:auto;padding:1vw 2.6vw 0}
.hs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4vw 2.2vw}
.hs-card{position:relative;background:#fff;border-radius:2.7vw;text-align:center;overflow:visible;
  box-shadow:0 .4vw 1.4vw rgba(0,0,0,.15);display:flex;flex-direction:column;align-items:center;height:37.6vw;padding:0 2.1vw 1.9vw}
.hs-top{padding-top:3.4vw;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;height:12.4vw;
  font:700 4.1vw/1.1 Roboto,Arial,sans-serif;color:#f0480f}
.hs-top .row{display:flex;align-items:center;gap:.3vw;justify-content:center}
.hs-top small{display:block;font:400 2.6vw/1.25 Roboto,Arial,sans-serif;color:#f59a00;margin-top:.4vw}
.hs-top.gold{color:#f59a00;font:400 2.6vw/1.3 Roboto,Arial,sans-serif;padding-top:3.2vw}
.hs-top.gold b{display:block;font:700 4.6vw/1 Roboto,Arial,sans-serif;color:#f08a00}
.hs-top.gold small{margin-top:0}
.hs-h{width:4.4vw;height:4.4vw;flex:none}
.hs-img{position:relative;flex:1;width:calc(100% + 4.2vw);margin:0 -2.1vw;display:flex;align-items:center;justify-content:center}
.hs-img::before{content:"";position:absolute;inset:0;
  background:repeating-conic-gradient(from 0deg at 50% 62%,rgba(255,232,120,.6) 0 7deg,rgba(255,255,255,0) 7deg 14deg);
  -webkit-mask-image:radial-gradient(circle at 50% 62%,#000 15%,transparent 72%);mask-image:radial-gradient(circle at 50% 62%,#000 15%,transparent 72%)}
.hs-img span{position:relative;font-size:11vw;line-height:1}
.hs-btn{width:100%;height:6.8vw;border:0;border-radius:1.3vw;color:#fff;font:400 3.5vw/1 Roboto,Arial,sans-serif;padding:0}
.hs-btn.blue{background:#2c8ae6}.hs-btn.green{background:#93c83a}.hs-btn.cyan{background:#1ec3ee}
.hs-tag{position:absolute;top:-.6vw;left:50%;transform:translateX(-50%);white-space:nowrap;color:#fff;z-index:2;
  font:700 2.4vw/3.2vw Roboto,Arial,sans-serif;height:3.2vw;padding:0 1.8vw;border-radius:.6vw}
.hs-tag.pink{background:#e0007a}.hs-tag.purple{background:#9b4fc4}
.hs-sellers{margin:5.4vw 0 0;background:#fff;border-radius:3vw;height:10.6vw;display:flex;align-items:center;gap:1.6vw;padding:0 3.2vw;
  font:700 4vw/1 Roboto,Arial,sans-serif;color:#333;cursor:pointer}
.hs-sellers i{font-style:normal;font-weight:400;color:#888}
.hs-sellers .tri{font-size:3vw}
#urekBtn,#urekSayi{cursor:pointer}
#ustPanel .urek path{fill:#e8590c;stroke:#e9e2dc;stroke-width:1.9}
#urekSayi{color:#e9e2dc}

.hs-toast{position:fixed;left:50%;bottom:24vw;transform:translateX(-50%);max-width:80vw;text-align:center;z-index:10001;
  background:rgba(35,35,35,.92);color:#fff;font:500 3.5vw/1.3 Roboto,Arial,sans-serif;padding:2.6vw 4.6vw;border-radius:3vw;
  opacity:0;pointer-events:none;transition:opacity .2s}
.hs-toast.show{opacity:1}
.hs-fly{position:fixed;z-index:10002;width:5.4vw;height:5.4vw;pointer-events:none;will-change:transform,opacity}
.hs-fly svg{width:100%;height:100%;filter:drop-shadow(0 .3vw .5vw rgba(0,0,0,.3))}
.hs-btn:disabled{opacity:.6}

    </style>
</head>

<!-- ÜRƏK MAĞAZASI PƏNCƏRƏSİ -->
<script type="module">
import { fsdb } from "./js/core/firebase.js";
import { cariOyuncu } from "./js/oyun/yardimci.js";
import { doc, runTransaction } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

/* Profildəki jeton sahəsinin adı. Bilinmirsə null saxla, aşağıdakı adaylardan özü tapır.
   Dəqiq adı bilirsənsə yaz, məs.: const JETON_ALANI = "coins"; */
const JETON_ALANI = null;
const ADAYLAR = ["jeton", "jetonlar", "jetons", "coins", "coin", "tokens", "token"];

const H = '<svg class="hs-h" viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z" fill="#f0541a"/></svg>';
const PACKS = [
  { top: 'PREMIUM<br>İCAZƏNAMƏ', icon: '🎟️', btn: 'Təfərrüatlar', color: 'blue' },
  { top: '<b>VIP</b><small>STATUS</small>', icon: '👑', btn: 'Təfərrüatlar', color: 'blue' },
  { hearts: 14000, bonus: 40, cost: 10000, icon: '🧰', color: 'green', tag: ['Ən yaxşı təklif', 'pink'] },
  { hearts: 6500, bonus: 30, cost: 5000, icon: '🛢️', color: 'green' },
  { hearts: 1200, bonus: 20, cost: 1000, icon: '🏺', color: 'green', tag: ['Ən yaxşı', 'purple'] },
  { hearts: 575, bonus: 15, cost: 500, icon: '👝', color: 'green' },
  { hearts: 270, bonus: 8, cost: 250, icon: '🎁', color: 'green' },
  { hearts: 300, icon: '❤️', btn: 'Götür', color: 'cyan', tag: ['Pulsuz', 'purple'], free: true }
];

const ov = document.createElement('div');
ov.className = 'hs-overlay';
ov.innerHTML = '<div class="hs-modal"><button class="hs-close"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19" stroke="#ef5f60" stroke-width="3.2" stroke-linecap="round"/></svg></button><div class="hs-title">Ürəklər satın al</div><div class="hs-scroll"><div class="hs-grid"></div><div class="hs-sellers"><span class="tri">▶</span><span>💬</span><span>Satıcılardan al</span><i>(1)</i></div></div></div>';
const grid = ov.querySelector('.hs-grid');
const toastEl = document.createElement('div');
toastEl.className = 'hs-toast';

let toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2600);
}

PACKS.forEach(p => {
  const c = document.createElement('div');
  c.className = 'hs-card';
  const top = p.hearts
    ? '<div class="hs-top"><div class="row">' + H + '<span>' + p.hearts + '</span></div>' + (p.bonus ? '<small>' + p.bonus + '% BONUS</small>' : '') + '</div>'
    : '<div class="hs-top gold">' + p.top + '</div>';
  c.innerHTML = (p.tag ? '<div class="hs-tag ' + p.tag[1] + '">' + p.tag[0] + '</div>' : '') + top +
    '<div class="hs-img"><span>' + p.icon + '</span></div><button class="hs-btn ' + p.color + '">' + (p.cost || p.btn) + '</button>';
  const b = c.querySelector('button');
  if (p.cost) b.onclick = () => al(p, b);
  grid.appendChild(c);
});

let openedAt = 0;
const open = () => { openedAt = Date.now(); ov.classList.add('open'); };
const close = () => ov.classList.remove('open');
ov.querySelector('.hs-close').onclick = close;
ov.addEventListener('click', e => { if (e.target === ov && Date.now() - openedAt > 500) close(); });
document.body.appendChild(ov);
document.body.appendChild(toastEl);

/* ---- ❤️-ə toxunanda aç (üstünü qat örtsə belə) ---- */
function inside(el, x, y) {
  if (!el) return false;
  const r = el.getBoundingClientRect();
  if (!r.width || !r.height) return false;
  return x >= r.left - 10 && x <= r.right + 10 && y >= r.top - 10 && y <= r.bottom + 10;
}
let lastOpen = 0;
window.addEventListener('click', e => {
  if (ov.classList.contains('open') || Date.now() - lastOpen < 400) return;
  if (inside(document.getElementById('urekBtn'), e.clientX, e.clientY) || inside(document.getElementById('urekSayi'), e.clientX, e.clientY)) {
    lastOpen = Date.now();
    open();
  }
}, true);

/* ---- Satın alma: jeton -> bonus ürək ---- */
function jetonAlani(p) {
  if (JETON_ALANI) return JETON_ALANI;
  for (const k of ADAYLAR) if (p[k] !== undefined && p[k] !== null && isFinite(Number(p[k]))) return k;
  return null;
}
function yaz(n) {
  if (window.urekYaz) window.urekYaz(n);
  else document.getElementById('urekSayi').textContent = n;
}
function pulse() {
  const h = document.getElementById('urekBtn');
  if (h && h.animate) h.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.3)' }, { transform: 'scale(1)' }], { duration: 240 });
}
function uc(sx, sy, evvel, qazanc, bitdi) {
  const hb = document.getElementById('urekBtn').getBoundingClientRect();
  const tx = hb.left + hb.width / 2, ty = hb.top + hb.height / 2;
  const S = innerWidth * 0.054, N = 8;
  let gelen = 0;
  for (let i = 0; i < N; i++) {
    const h = document.createElement('div');
    h.className = 'hs-fly';
    h.innerHTML = H.replace('class="hs-h"', '');
    h.style.left = (sx - S / 2) + 'px';
    h.style.top = (sy - S / 2) + 'px';
    document.body.appendChild(h);
    const dx = tx - sx, dy = ty - sy;
    const ox = (Math.random() - 0.5) * innerWidth * 0.25, oy = -Math.random() * innerWidth * 0.12;
    const a = h.animate([
      { transform: 'translate(0,0) scale(.6)', opacity: 0 },
      { transform: 'translate(' + (dx * 0.45 + ox) + 'px,' + (dy * 0.45 + oy) + 'px) scale(1)', opacity: 1, offset: 0.45 },
      { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(.55)', opacity: 1 }
    ], { duration: 850, delay: i * 70, easing: 'ease-in', fill: 'both' });
    a.onfinish = () => {
      h.remove();
      gelen++;
      yaz(Math.round(evvel + qazanc * gelen / N));
      pulse();
      if (gelen === N) bitdi();
    };
  }
}

let mesgul = false;
async function al(p, btn) {
  if (mesgul) return;
  const cari = cariOyuncu();
  if (!cari || !cari.docId) { toast('Hesaba giriş edilməyib'); return; }
  mesgul = true;
  const br = btn.getBoundingClientRect();
  const sx = br.left + br.width / 2, sy = br.top + br.height / 2;
  const evvel = parseInt(document.getElementById('urekSayi').textContent) || 0;
  window.__urekHold = true;
  const sigorta = setTimeout(() => { window.__urekHold = false; }, 8000);
  const buraxdir = () => {
    clearTimeout(sigorta);
    window.__urekHold = false;
    if (window.__urekSon != null) yaz(window.__urekSon);
  };
  try {
    const ref = doc(fsdb, 'users', cari.docId);
    await runTransaction(fsdb, async tx => {
      const s = await tx.get(ref);
      const d = s.data() || {};
      const sahe = jetonAlani(d);
      if (!sahe) { const e = new Error('ALAN'); e.acarlar = Object.keys(d).join(', '); throw e; }
      const jeton = Number(d[sahe]) || 0;
      if (jeton < p.cost) throw new Error('YETMIR');
      tx.update(ref, { [sahe]: jeton - p.cost, hearts: (Number(d.hearts) || 0) + p.hearts });
    });
  } catch (e) {
    buraxdir();
    mesgul = false;
    if (e.message === 'YETMIR') toast('Kifayət qədər jetonunuz yoxdur');
    else if (e.message === 'ALAN') toast('Jeton sahəsi tapılmadı. Sahələr: ' + e.acarlar);
    else { console.error(e); toast('Xəta baş verdi, yenidən cəhd edin'); }
    return;
  }
  close();
  uc(sx, sy, evvel, p.hearts, () => {
    buraxdir();
    mesgul = false;
  });
}

window.HeartShop = { open, close };

</script>

<!-- MUSİQİ PANELİ UI + CANLI AXTARIŞ + PLEYER -->
<script>
(function () {
  const CLIP_COST = 9;

  const POPULAR_CLIPS = [
    { videoId: "nVjsGKrE6E8", title: "Lana Del Rey - Summertime Sadness", durationSec: 265, thumb: "https://i.ytimg.com/vi/nVjsGKrE6E8/mqdefault.jpg" },
    { videoId: "M7lc1UVf-VE", title: "OMER DEEP - Medusa (Original Mix)", durationSec: 377, thumb: "https://i.ytimg.com/vi/M7lc1UVf-VE/mqdefault.jpg" },
    { videoId: "60ItHLz5WEA", title: "Alan Walker - Faded", durationSec: 212, thumb: "https://i.ytimg.com/vi/60ItHLz5WEA/mqdefault.jpg" },
    { videoId: "kJQP7kiw5Fk", title: "Luis Fonsi - Despacito", durationSec: 281, thumb: "https://i.ytimg.com/vi/kJQP7kiw5Fk/mqdefault.jpg" },
    { videoId: "JGwWNGJdvx8", title: "Ed Sheeran - Shape of You", durationSec: 263, thumb: "https://i.ytimg.com/vi/JGwWNGJdvx8/mqdefault.jpg" },
    { videoId: "RgKAFK5djSk", title: "Wiz Khalifa - See You Again", durationSec: 237, thumb: "https://i.ytimg.com/vi/RgKAFK5djSk/mqdefault.jpg" },
    { videoId: "fRh_vgS2dFE", title: "Justin Bieber - Sorry", durationSec: 205, thumb: "https://i.ytimg.com/vi/fRh_vgS2dFE/mqdefault.jpg" },
    { videoId: "09R8_2nJtjg", title: "Maroon 5 - Sugar", durationSec: 301, thumb: "https://i.ytimg.com/vi/09R8_2nJtjg/mqdefault.jpg" },
    { videoId: "OPf0YbXqDm0", title: "Mark Ronson - Uptown Funk", durationSec: 270, thumb: "https://i.ytimg.com/vi/OPf0YbXqDm0/mqdefault.jpg" },
    { videoId: "hT_nvWreIhg", title: "OneRepublic - Counting Stars", durationSec: 283, thumb: "https://i.ytimg.com/vi/hT_nvWreIhg/mqdefault.jpg" },
    { videoId: "YQHsXMglC9A", title: "Adele - Hello", durationSec: 366, thumb: "https://i.ytimg.com/vi/YQHsXMglC9A/mqdefault.jpg" },
    { videoId: "pRpeEdMmmQ0", title: "Shakira - Waka Waka", durationSec: 210, thumb: "https://i.ytimg.com/vi/pRpeEdMmmQ0/mqdefault.jpg" }
  ];

  let progressInterval = null;
  let zoomLevel = 0;
  let isMuted = false;
  let currentKlipId = null;

  function sendYTCommand(func, args) {
    const iframe = document.querySelector("#bb-live-video-wrap iframe");
    if (!iframe || !iframe.contentWindow) return;
    iframe.contentWindow.postMessage(
      JSON.stringify({ event: "command", func: func, args: args || [] }),
      "*"
    );
  }

  function applyVolume(vol) {
    if (vol <= 0 || isMuted) {
      sendYTCommand("mute");
    } else {
      sendYTCommand("unMute");
      sendYTCommand("setVolume", [vol]);
    }
  }

  function mountVideoIframe(videoId, startSec) {
    const wrap = document.getElementById("bb-live-video-wrap");
    wrap.innerHTML = "";
    const iframe = document.createElement("iframe");
    iframe.style.cssText = "width:100%; height:100%; border:0; pointer-events:none;";
    iframe.allow = "autoplay; encrypted-media";
    iframe.src =
      "https://www.youtube-nocookie.com/embed/" +
      encodeURIComponent(videoId) +
      "?autoplay=1&controls=0&rel=0&modestbranding=1&iv_load_policy=3&playsinline=1&enablejsapi=1&start=" +
      Math.max(0, startSec);

    iframe.onload = function () {
      applyVolume(Number(document.getElementById("bb-volume-slider").value || 85));
    };
    wrap.appendChild(iframe);
  }

  function startCircularRing(startedAt, durationSec) {
    clearInterval(progressInterval);
    const circle = document.getElementById("bb-ring-progress");
    const circumference = 2 * Math.PI * 33;

    progressInterval = setInterval(function () {
      const elapsed = (Date.now() - Number(startedAt)) / 1000;
      const ratio = Math.min(1, Math.max(0, elapsed / durationSec));
      circle.style.strokeDashoffset = String(circumference * (1 - ratio));

      if (elapsed >= durationSec) {
        stopPlayer();
        if (window.MusiqiFirebase && typeof window.MusiqiFirebase.klipBitir === "function") {
          window.MusiqiFirebase.klipBitir();
        }
      }
    }, 300);
  }

  function stopPlayer() {
    clearInterval(progressInterval);
    currentKlipId = null;
    const wrap = document.getElementById("bb-live-video-wrap");
    if (wrap) wrap.innerHTML = "";
    const widget = document.getElementById("bb-live-clip-widget");
    if (widget) widget.style.display = "none";
  }

  function playClip(data) {
    if (!data || !data.videoId) return;
    if (currentKlipId === data.klipId) return;
    currentKlipId = data.klipId;

    const widget = document.getElementById("bb-live-clip-widget");
    const avatarEl = document.getElementById("bb-dj-avatar");
    avatarEl.src = data.djAvatar || "images/avatar/nophoto.svg";
    widget.style.display = "block";

    const elapsedSec = Math.max(0, Math.floor((Date.now() - Number(data.startedAt || Date.now())) / 1000));
    mountVideoIframe(data.videoId, elapsedSec);
    startCircularRing(data.startedAt || Date.now(), Number(data.durationSec || 240));
  }

  function openModal(initialTab) {
    const modal = document.getElementById("bb-clip-modal");
    modal.style.display = "flex";
    switchTab(initialTab || "popular");
  }

  // Dairəvi avatar klikində yenidən mahnı seçimi açılsın
  document.getElementById("bb-dj-avatar-box").addEventListener("click", function () {
    openModal("popular");
  });

  document.getElementById("bb-clip-close").addEventListener("click", function () {
    document.getElementById("bb-clip-modal").style.display = "none";
  });

  document.querySelectorAll(".bb-tab-btn").forEach(function (b) {
    b.addEventListener("click", function () { switchTab(b.dataset.tab); });
  });

  function switchTab(tab) {
    document.querySelectorAll(".bb-tab-btn").forEach(function (b) {
      b.style.opacity = b.dataset.tab === tab ? "1" : "0.45";
    });
    const titleEl = document.getElementById("bb-tab-title");
    const searchBox = document.getElementById("bb-search-box");

    if (tab === "search") {
      titleEl.textContent = "YouTube-da mahnı axtar (9 bonus)";
      searchBox.style.display = "block";
      const inp = document.getElementById("bb-yt-query");
      setTimeout(() => inp.focus(), 80);
      if (inp.value.trim()) searchYouTube(inp.value.trim());
      else renderGrid(POPULAR_CLIPS.slice(0, 8));
    } else if (tab === "favorites") {
      titleEl.textContent = "Sevimli musiqilər";
      searchBox.style.display = "none";
      renderGrid(JSON.parse(localStorage.getItem("bb_fav_clips") || "[]"));
    } else if (tab === "history") {
      titleEl.textContent = "Son qoşulan kliplər";
      searchBox.style.display = "none";
      renderGrid(JSON.parse(localStorage.getItem("bb_hist_clips") || "[]"));
    } else {
      titleEl.textContent = "Populyar bölməsindən musiqi seç (9 bonus)";
      searchBox.style.display = "none";
      renderGrid(POPULAR_CLIPS);
    }
  }

  // Canlı YouTube Axtarışı (AllOrigins + CorsProxy + YouTube JSONP Suggest)
  async function searchYouTube(query) {
    const grid = document.getElementById("bb-clip-grid");
    grid.style.display = "block";
    grid.innerHTML = '<div style="text-align:center; color:#888; padding:26px 0; font-size:14px;">YouTube-da axtarılır...</div>';

    const ytUrl = "https://www.youtube.com/results?search_query=" + encodeURIComponent(query);
    const proxyList = [
      "https://api.allorigins.win/raw?url=" + encodeURIComponent(ytUrl),
      "https://corsproxy.io/?" + encodeURIComponent(ytUrl),
      "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(ytUrl)
    ];

    for (const pUrl of proxyList) {
      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 5000);
        const res = await fetch(pUrl, { signal: ctrl.signal });
        clearTimeout(timer);
        if (!res.ok) continue;
        const html = await res.text();

        // HTML içindən bütün videoId + başlıq cütlərini çıxar
        const regex = /"videoId":"([a-zA-Z0-9_-]{11})".*?"title":\{"runs":\[\{"text":"([^"]+)"\}/g;
        const seen = new Set();
        const found = [];
        let m;
        while ((m = regex.exec(html)) !== null && found.length < 16) {
          const vid = m[1];
          const rawTitle = m[2].replace(/\\u0026/g, "&").replace(/\\"/g, '"');
          if (!seen.has(vid)) {
            seen.add(vid);
            found.push({
              videoId: vid,
              title: rawTitle,
              durationSec: 240,
              thumb: "https://i.ytimg.com/vi/" + vid + "/mqdefault.jpg"
            });
          }
        }
        if (found.length > 0) {
          renderGrid(found);
          return;
        }
      } catch (_) {}
    }

    renderGrid(POPULAR_CLIPS.filter(c => c.title.toLowerCase().includes(query.toLowerCase())));
  }

  let searchTimer = null;
  document.getElementById("bb-yt-query").addEventListener("input", function (e) {
    clearTimeout(searchTimer);
    const q = e.target.value.trim();
    searchTimer = setTimeout(function () {
      if (!q) renderGrid(POPULAR_CLIPS.slice(0, 8));
      else searchYouTube(q);
    }, 400);
  });

  function renderGrid(items) {
    const grid = document.getElementById("bb-clip-grid");
    grid.innerHTML = "";
    if (!items.length) {
      grid.style.display = "block";
      grid.innerHTML = '<div style="text-align:center; color:#777; padding:28px 0; font-size:14px;">Hər hansı musiqi tapılmadı</div>';
      return;
    }
    const favs = JSON.parse(localStorage.getItem("bb_fav_clips") || "[]");
    grid.style.display = "grid";

    items.forEach(function (clip) {
      const isFav = favs.some(x => x.videoId === clip.videoId);
      const card = document.createElement("div");
      card.style.cssText = "border-radius:10px; overflow:hidden; background:#fafafa; border:1px solid #eee; cursor:pointer; position:relative;";
      card.innerHTML = `
        <div style="position:relative;">
          <img src="${clip.thumb}" style="width:100%; height:78px; object-fit:cover; display:block;" />
          <span class="bb-fav-star" style="position:absolute; top:4px; right:5px; font-size:16px; color:#fff; text-shadow:0 1px 4px #000;">${isFav ? "⭐" : "☆"}</span>
          <span style="position:absolute; bottom:4px; right:4px; background:rgba(0,0,0,0.75); color:#fff; font-size:10px; padding:1px 5px; border-radius:4px;">9 🔶</span>
        </div>
        <div style="padding:6px; font-size:11px; font-weight:600; color:#222; line-height:1.25; height:32px; overflow:hidden;">${clip.title}</div>
      `;

      card.querySelector(".bb-fav-star").addEventListener("click", function (ev) {
        ev.stopPropagation();
        let list = JSON.parse(localStorage.getItem("bb_fav_clips") || "[]");
        if (list.some(x => x.videoId === clip.videoId)) {
          list = list.filter(x => x.videoId !== clip.videoId);
          ev.currentTarget.textContent = "☆";
        } else {
          list.unshift(clip);
          ev.currentTarget.textContent = "⭐";
        }
        localStorage.setItem("bb_fav_clips", JSON.stringify(list.slice(0, 30)));
      });

      card.addEventListener("click", async function () {
        const hist = JSON.parse(localStorage.getItem("bb_hist_clips") || "[]");
        localStorage.setItem("bb_hist_clips", JSON.stringify([clip, ...hist.filter(x => x.videoId !== clip.videoId)].slice(0, 20)));
        document.getElementById("bb-clip-modal").style.display = "none";

        if (window.MusiqiFirebase && typeof window.MusiqiFirebase.klipQos === "function") {
          await window.MusiqiFirebase.klipQos(clip, CLIP_COST);
        }
      });

      grid.appendChild(card);
    });
  }

  // Kvadrat düymə: 1-ci klik -> 1x, 2-ci klik -> 2x, 3-cü klik -> orijinal
  document.getElementById("bb-zoom-clip-btn").addEventListener("click", function () {
    zoomLevel = (zoomLevel + 1) % 3;
    const widget = document.getElementById("bb-live-clip-widget");
    const topBox = document.getElementById("bb-live-top");

    if (zoomLevel === 0) {
      widget.style.width = "254px";
      topBox.style.height = "84px";
    } else if (zoomLevel === 1) {
      widget.style.width = "310px";
      topBox.style.height = "122px";
    } else {
      widget.style.width = "calc(100% - 16px)";
      topBox.style.height = "170px";
    }
  });

  const volSlider = document.getElementById("bb-volume-slider");
  const muteBtn = document.getElementById("bb-mute-clip-btn");

  volSlider.addEventListener("input", function () {
    const v = Number(volSlider.value);
    isMuted = v === 0;
    muteBtn.textContent = isMuted ? "🔇" : "🔊";
    applyVolume(v);
  });

  muteBtn.addEventListener("click", function () {
    isMuted = !isMuted;
    const v = isMuted ? 0 : (Number(volSlider.value) || 80);
    if (!isMuted && Number(volSlider.value) === 0) volSlider.value = 80;
    muteBtn.textContent = isMuted ? "🔇" : "🔊";
    applyVolume(v);
  });

  // chat.js-in çağırdığı qlobal MusiqiPanel obyekti
  window.MusiqiPanel = {
    open: openModal,
    play: playClip,
    stop: stopPlayer
  };
})();
</script>
