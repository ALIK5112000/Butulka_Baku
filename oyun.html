<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Butulka Baku - Oyun Masası</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body {
            background: #120c06;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            color: #fff;
        }
        .game-container {
            display: flex;
            width: 100%;
            max-width: 1200px;
            height: 100vh;
            background: #1a1108;
        }
        .play-area {
            flex: 1.6;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #2e1d0e 0%, #120c06 100%);
        }
        .back-btn {
            position: absolute;
            top: 14px;
            left: 14px;
            background: rgba(0,0,0,0.6);
            border: 1px solid #ffcc00;
            color: #ffcc00;
            padding: 7px 14px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            z-index: 20;
        }
        .table-bg {
            width: 440px;
            height: 440px;
            background-image: url('images/masa/taxta.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            position: relative;
        }
        .bottle {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 50px;
            height: 125px;
            background-image: url('images/masa/butulka.jpg');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            transform: translate(-50%, -50%) rotate(0deg);
            transform-origin: center center;
            transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1);
            z-index: 10;
            mix-blend-mode: multiply;
        }
        .player {
            position: absolute;
            width: 68px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 5;
            transition: 0.3s;
        }
        .player img {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            border: 2.5px solid #ffcc00;
            object-fit: cover;
            background: #333;
        }
        .player .name {
            font-size: 11px;
            background: rgba(0,0,0,0.85);
            padding: 2px 7px;
            border-radius: 10px;
            margin-top: 3px;
            max-width: 75px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .p1 { top: 2%; left: 50%; transform: translateX(-50%); }
        .p2 { top: 10%; left: 74%; }
        .p3 { top: 27%; left: 88%; }
        .p4 { top: 50%; left: 91%; transform: translateY(-50%); }
        .p5 { bottom: 27%; left: 88%; }
        .p6 { bottom: 10%; left: 74%; }
        .p7 { bottom: 2%; left: 50%; transform: translateX(-50%); }
        .p8 { bottom: 10%; left: 14%; }
        .p9 { bottom: 27%; left: 1%; }
        .p10 { top: 50%; left: -2%; transform: translateY(-50%); }
        .p11 { top: 27%; left: 1%; }
        .p12 { top: 10%; left: 14%; }

        .player.active img {
            border-color: #22c55e;
            box-shadow: 0 0 18px #22c55e;
            transform: scale(1.12);
        }
        .spin-btn {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #ffcc00, #f97316);
            color: #000;
            border: none;
            padding: 11px 34px;
            font-size: 16px;
            font-weight: 800;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(249, 115, 22, 0.45);
            z-index: 15;
        }
        .chat-area {
            flex: 1;
            background: #110c07;
            border-left: 1px solid rgba(255, 204, 0, 0.25);
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            padding: 12px;
            background: rgba(255, 204, 0, 0.08);
            font-weight: 700;
            text-align: center;
            border-bottom: 1px solid rgba(255, 204, 0, 0.2);
            color: #ffcc00;
            font-size: 14px;
        }
        .chat-messages {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .msg { font-size: 13px; line-height: 1.4; word-break: break-word; }
        .name-oglan { color: #38bdf8; font-weight: 700; }
        .name-qiz { color: #f472b6; font-weight: 700; }
        .name-vip-oglan { color: #2563eb; font-weight: 800; }
        .name-vip-qiz { color: #ef4444; font-weight: 800; }

        .chat-input-area {
            padding: 8px;
            display: flex;
            gap: 6px;
            border-top: 1px solid rgba(255, 204, 0, 0.2);
        }
        .chat-input {
            flex: 1;
            background: #221910;
            border: 1px solid rgba(255, 204, 0, 0.4);
            border-radius: 20px;
            padding: 9px 14px;
            color: #fff;
            outline: none;
            font-size: 14px;
        }
        .send-btn {
            background: #ffcc00;
            border: none;
            color: #000;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: 800;
        }
        @media (max-width: 768px) {
            .game-container { flex-direction: column; }
            .play-area { flex: 1.45; }
            .table-bg { width: 310px; height: 310px; }
            .chat-area { flex: 1; border-left: none; border-top: 1px solid rgba(255, 204, 0, 0.25); }
            .player { width: 52px; }
            .player img { width: 42px; height: 42px; }
            .player .name { font-size: 9px; max-width: 52px; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="play-area">
            <button class="back-btn" onclick="window.location.href='profil.html'">← Profil</button>
            <div class="table-bg">
                <div class="bottle" id="bottle"></div>

                <div class="player p1 active" id="seat1">
                    <img id="mySeatAvatar" src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="">
                    <span class="name name-vip-oglan" id="mySeatName">Oyunçu</span>
                </div>
                <div class="player p2"><img src="https://cdn-icons-png.flaticon.com/512/149/149071.png"><span class="name name-qiz">Nura</span></div>
                <div class="player p3"><img src="https://cdn-icons-png.flaticon.com/512/149/149071.png"><span class="name name-oglan">Elnur</span></div>
                <div class="player p4"><img src="https://cdn-icons-png.flaticon.com/512/149/149071.png"><span class="name name-vip-qiz">Ayan 👑</span></div>
                <div class="player p5"><img src="https://cdn-icons-png.flaticon.com/512/149/149071.png"><span class="name name-oglan">Ramil</span></div>
                <div class="player p6"><img src="https://cdn-icons-png.flaticon.com/512/149/149071.png"><span class="name name-qiz">Ləman</span></div>
                <div class="player p7"><img src="https://cdn-icons-png.flaticon.com/512/149/149071.png"><span class="name name-oglan">Murad</span></div>
                <div class="player p8"><img src="https://cdn-icons-png.flaticon.com/512/149/149071.png"><span class="name name-qiz">Fidan</span></div>
                <div class="player p9"><img src="https://cdn-icons-png.flaticon.com/512/149/149071.png"><span class="name name-vip-oglan">Seymur 👑</span></div>
                <div class="player p10"><img src="https://cdn-icons-png.flaticon.com/512/149/149071.png"><span class="name name-oglan">Vasif</span></div>
                <div class="player p11"><img src="https://cdn-icons-png.flaticon.com/512/149/149071.png"><span class="name name-qiz">Günel</span></div>
                <div class="player p12"><img src="https://cdn-icons-png.flaticon.com/512/149/149071.png"><span class="name name-qiz">Aysel</span></div>
            </div>
            <button class="spin-btn" onclick="spinBottle()">Fırlat</button>
        </div>

        <div class="chat-area">
            <div class="chat-header">Masa Çatı - Masa 511</div>
            <div class="chat-messages" id="chatBox"></div>
            <div class="chat-input-area">
                <input type="text" class="chat-input" id="msgInput" placeholder="Mesaj yazın...">
                <button class="send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <script>
        const DEFAULT_AVATAR = "https://cdn-icons-png.flaticon.com/512/149/149071.png";
        const rawUser = localStorage.getItem("currentUser");
        const me = rawUser ? JSON.parse(rawUser) : { username: "Qonaq", gender: "Kişi", vip: false };

        const isVip = me.vip && (!me.vipUntil || Number(me.vipUntil) > Date.now());
        const isFemale = me.gender === "Qadın";
        const myColorClass = isVip
            ? (isFemale ? "name-vip-qiz" : "name-vip-oglan")
            : (isFemale ? "name-qiz" : "name-oglan");

        document.getElementById("mySeatAvatar").src = me.avatar || DEFAULT_AVATAR;
        const myNameEl = document.getElementById("mySeatName");
        myNameEl.textContent = (isVip ? "👑 " : "") + me.username;
        myNameEl.className = "name " + myColorClass;

        let currentRotation = 0;
        let isSpinning = false;

        function spinBottle() {
            if (isSpinning) return;
            isSpinning = true;

            const bottle = document.getElementById('bottle');
            const randomPlayerIndex = Math.floor(Math.random() * 12) + 1;
            const targetDegrees = (randomPlayerIndex - 1) * 30;
            currentRotation += 1800 + targetDegrees - (currentRotation % 360);

            bottle.style.transform = `translate(-50%, -50%) rotate(${currentRotation}deg)`;
            document.querySelectorAll('.player').forEach(p => p.classList.remove('active'));

            setTimeout(() => {
                isSpinning = false;
                const luckyPlayer = document.querySelector(`.p${randomPlayerIndex}`);
                if (luckyPlayer) {
                    luckyPlayer.classList.add('active');
                    const playerName = luckyPlayer.querySelector('.name').innerText;
                    addSystemMessage(`Butulka ${playerName} üzərində dayandı! 🎯`);
                }
            }, 4000);
        }

        function sendMessage() {
            const input = document.getElementById('msgInput');
            const chatBox = document.getElementById('chatBox');
            if (input.value.trim() === "") return;

            const msgDiv = document.createElement('div');
            msgDiv.className = 'msg';
            msgDiv.innerHTML = `<span class="${myColorClass}">${me.username}:</span> ${input.value}`;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            input.value = "";
        }

        function addSystemMessage(text) {
            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'msg';
            msgDiv.style.color = '#ffcc00';
            msgDiv.innerHTML = `<strong>Sistem:</strong> ${text}`;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        document.getElementById('msgInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        addSystemMessage(`${me.username} masaya qoşuldu!`);
    </script>
</body>
</html>
