<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin the Bottle - Canlı Oyun</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body {
            background: #090314;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Orijinal Oyun Pəncərəsi (Mobil Çərçivə) */
        .game-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 850px;
            background: #1a0b2e;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        /* Yuxarı Status Paneli (Balans, Ürək, Jeton) */
        .top-bar {
            background: linear-gradient(180deg, #2a1147, #150624);
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(255, 215, 0, 0.2);
            z-index: 30;
        }
        .user-info-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .currency-badge {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .exit-game-btn {
            background: #e74c3c;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Taxta Stol Sahəsi (Orijinal Mərkəz) */
        .wood-table-area {
            flex: 1;
            position: relative;
            background-color: #b26c31;
            background-image: url("https://www.transparenttextures.com/patterns/wood-pattern.png"), linear-gradient(135deg, #c67d3e, #96521d);
            box-shadow: inset 0 0 60px rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Şüşə Fırlanma Elementi */
        .bottle-element {
            width: 75px;
            position: absolute;
            z-index: 15;
            cursor: pointer;
            transition: transform 4s cubic-bezier(0.15, 0.85, 0.15, 1);
            filter: drop-shadow(0 15px 15px rgba(0,0,0,0.8));
        }

        /* Masada Dairəvi Oturan Oyunçular */
        .seats-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .seat-box {
            position: absolute;
            width: 70px;
            height: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: translate(-50%, -50%);
            pointer-events: auto;
            z-index: 10;
        }
        .seat-avatar-img {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 2px solid #f1c40f;
            object-fit: cover;
            background: #000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .seat-username {
            font-size: 10px;
            font-weight: bold;
            color: #fff;
            background: rgba(0, 0, 0, 0.75);
            padding: 2px 6px;
            border-radius: 8px;
            margin-top: 4px;
            white-space: nowrap;
            max-width: 70px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Aşağı Çat və Mesajlaşma Paneli */
        .bottom-chat-panel {
            background: #150624;
            height: 180px;
            display: flex;
            flex-direction: column;
            padding: 10px;
            border-top: 2px solid rgba(255, 255, 255, 0.08);
            z-index: 30;
        }
        .chat-feed {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-right: 4px;
        }
        .chat-line {
            font-size: 12px;
            background: rgba(255, 255, 255, 0.05);
            padding: 5px 10px;
            border-radius: 8px;
            color: #ddd;
        }
        .chat-line span {
            color: #ff6b95;
            font-weight: bold;
            margin-right: 5px;
        }
        .chat-typing-box {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .chat-typing-box input {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 12px;
            border-radius: 15px;
            color: #fff;
            outline: none;
            font-size: 13px;
        }
        .send-msg-btn {
            background: #f39c12;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- Üst Balans Paneli -->
        <div class="top-bar">
            <div class="user-info-group">
                <div class="currency-badge">❤️ <span id="displayHearts">5000</span></div>
                <div class="currency-badge">💎 <span id="displayJetons">1000</span></div>
            </div>
            <button class="exit-game-btn" onclick="location.href='profile.html'">Çıxış</button>
        </div>

        <!-- Taxta Masa və Şüşə -->
        <div class="wood-table-area" id="tableArea">
            <img id="bottle" class="bottle-element" src="https://cdn-icons-png.flaticon.com/512/869/869688.png" alt="Butulka" onclick="spinBottleAction()">
            <div class="seats-layer" id="seatsContainer"></div>
        </div>

        <!-- Çat Paneli -->
        <div class="bottom-chat-panel">
            <div class="chat-feed" id="chatFeed">
                <div class="chat-line"><span>Sistem:</span> Oyuna uğurla qoşuldunuz! Şüşəni fırladın.</div>
            </div>
            <div class="chat-typing-box">
                <input type="text" id="chatInput" placeholder="Mesaj yaz..." onkeypress="handleKey(event)">
                <button class="send-msg-btn" onclick="sendMsg()">➤</button>
            </div>
        </div>
    </div>

    <!-- Firebase Real-Time Oyun Məntiqi -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, onSnapshot, query, orderBy, limit, serverTimestamp, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAANVVrJKhZyaCErn8YFNVTUPF70A9xlmQ",
          authDomain: "butulka-baku-istifadeci-bazasi.firebaseapp.com",
          projectId: "butulka-baku-istifadeci-bazasi"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // İstifadəçi təyin etmək
        let currentUser = JSON.parse(localStorage.getItem("currentUser"));
        if (!currentUser) {
            currentUser = {
                id: Math.floor(Math.random() * 90000) + 10000,
                username: "Oyunçu_" + Math.floor(Math.random() * 900 + 100),
                hearts: 5000,
                jetons: 1000
            };
            localStorage.setItem("currentUser", JSON.stringify(currentUser));
        }

        document.getElementById('displayHearts').innerText = currentUser.hearts;
        document.getElementById('displayJetons').innerText = currentUser.jetons;

        const tableArea = document.getElementById('tableArea');
        const seatsContainer = document.getElementById('seatsContainer');

        // Masaya avtomatik oturma
        async function joinGameTable() {
            try {
                const playerRef = doc(db, "live_table_1_players", currentUser.id.toString());
                await setDoc(playerRef, {
                    id: currentUser.id,
                    username: currentUser.username,
                    online: true,
                    timestamp: serverTimestamp()
                }, { merge: true });
            } catch(err) {
                console.log("Xəta:", err);
            }
        }
        joinGameTable();

        // Oyunçuları dairəvi düzmək riyaziyyatı
        const playersRef = collection(db, "live_table_1_players");
        onSnapshot(playersRef, (snapshot) => {
            const players = [];
            snapshot.forEach(d => {
                if(d.data().online) players.push(d.data());
            });

            seatsContainer.innerHTML = '';
            const total = players.length;
            if(total === 0) return;

            const radius = 120; // Masanın mərkəzindən məsafə
            const centerX = tableArea.clientWidth / 2;
            const centerY = tableArea.clientHeight / 2;

            players.forEach((p, index) => {
                const angle = (index / total) * (2 * Math.PI) - (Math.PI / 2);
                const x = centerX + radius * Math.cos(angle);
                const y = centerY + radius * Math.sin(angle);

                seatsContainer.innerHTML += `
                <div class="seat-box" style="left: ${x}px; top: ${y}px;">
                    <img class="seat-avatar-img" src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80">
                    <div class="seat-username">${p.username}</div>
                </div>`;
            });
        });

        // Şüşə fırlanma mexanizmi
        const stateRef = doc(db, "live_game_state", "table_1");
        onSnapshot(stateRef, (docSnap) => {
            if(docSnap.exists()) {
                const data = docSnap.data();
                document.getElementById('bottle').style.transform = `rotate(${data.rotation}deg)`;
            }
        });

        window.spinBottleAction = async function() {
            const bottle = document.getElementById('bottle');
            const currentTransform = bottle.style.transform;
            let currentRot = 0;
            if(currentTransform) {
                currentRot = parseInt(currentTransform.replace(/[^0-9\-]/g,'')) || 0;
            }
            const newRot = currentRot + 1440 + Math.floor(Math.random() * 360);
            await setDoc(stateRef, { rotation: newRot }, { merge: true });
        };

        // Çat sistemi
        const chatRef = collection(db, "live_table_1_chat");
        const qChat = query(chatRef, orderBy("timestamp", "asc"), limit(30));
        onSnapshot(qChat, (snapshot) => {
            const chatFeed = document.getElementById('chatFeed');
            snapshot.forEach(d => {
                if(!document.getElementById(`msg-${d.id}`)) {
                    const m = d.data();
                    chatFeed.innerHTML += `<div class="chat-line" id="msg-${d.id}"><span>${m.username}:</span> ${m.text}</div>`;
                    chatFeed.scrollTop = chatFeed.scrollHeight;
                }
            });
        });

        window.sendMsg = async function() {
            const input = document.getElementById('chatInput');
            const txt = input.value.trim();
            if(!txt) return;
            input.value = '';
            await addDoc(chatRef, { username: currentUser.username, text: txt, timestamp: serverTimestamp() });
        };

        window.handleKey = function(e) { if(e.key === 'Enter') sendMsg(); };
    </script>
</body>
</html>
