<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Butulka Baku - Oyun Masası</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f0b15; font-family: sans-serif; color: white; height: 100vh; overflow: hidden; }
        .wood-table { background: linear-gradient(135deg, #b5835a 0%, #8c5830 50%, #663d1e 100%); }
        .bottle { transition: transform 3s cubic-bezier(0.15, 0.9, 0.2, 1); }
    </style>
</head>
<body class="flex flex-col justify-between h-screen">

    <!-- TOP BAR -->
    <header class="flex items-center justify-between px-4 py-3 bg-[#161022] border-b border-[#291f3d]">
        <a href="profil.html" class="text-yellow-400 text-xs font-bold flex items-center gap-1 bg-[#251b38] px-3 py-1.5 rounded-full border border-yellow-500/30">
            <i class="fa-solid fa-arrow-left"></i> Profilə qayıt
        </a>
        <div class="bg-black/40 px-3 py-1 rounded-full text-xs text-yellow-300 font-bold">
            Masa 511[span_7](start_span)[span_7](end_span)
        </div>
    </header>

    <!-- GAME TABLE AREA -->
    <main class="flex-1 wood-table flex items-center justify-center relative p-4">
        <div class="flex flex-col items-center">
            <div id="bottleContainer" class="relative cursor-pointer mb-4" onclick="spinBottle()">
                <div class="absolute -top-3 left-1/2 -translate-x-1/2 bg-yellow-600 text-yellow-100 text-[9px] font-bold px-2 py-0.5 rounded-full shadow border border-yellow-300 z-10">VIP</div>
                <svg id="bottle" class="bottle w-28 h-36 drop-shadow-2xl" viewBox="0 0 100 150">
                    <path d="M40 10 L60 10 L65 40 L70 50 C80 65 80 90 70 120 C60 140 40 140 30 120 C20 90 20 65 30 50 L35 40 Z" fill="#1e1e1e" stroke="#d4af37" stroke-width="3"/>
                    <rect x="42" y="20" width="16" height="8" fill="#d4af37"/>
                </svg>
            </div>
            <p class="text-xs text-yellow-100/90 font-medium tracking-wide bg-black/30 px-4 py-1.5 rounded-full backdrop-blur-sm shadow">Oyuna başlamaq üçün qızları gözləyirik</p>
        </div>
    </main>

    <script>
        let currentRotation = 0;
        function spinBottle() {
            const bottle = document.getElementById('bottle');
            const randomAngle = Math.floor(Math.random() * 1080) + 360;
            currentRotation += randomAngle;
            bottle.style.transform = `rotate(${currentRotation}deg)`;
        }
    </script>
</body>
</html>
