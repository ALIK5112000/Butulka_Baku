<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#c9772c">
  <title>Butulka Baku</title>
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <div class="app">

    <!-- MASA -->
    <section class="stage" id="stage">
      <div class="topbar">
        <div class="hearts"><span class="heart-icon">❤️</span><span id="heartCount">0</span></div>
        <!-- Gələcəkdə yeni düymələr (hədiyyə, çarx, menyu və s.) bu qutuya əlavə olunacaq -->
        <div class="slots" id="topSlots">
          <div class="table-label" id="tableLabel">Masa</div>
          <button class="round-btn" id="changeBtn" title="Masanı dəyiş">⟳</button>
          <button class="round-btn" id="exitBtn" title="Çıxış">⎋</button>
        </div>
      </div>

      <div class="seats" id="seats">
        <div class="bottle" id="bottle">
          <svg viewBox="0 0 60 140" aria-hidden="true">
            <defs>
              <linearGradient id="glass" x1="0" x2="1">
                <stop offset="0" stop-color="#3a2330"/>
                <stop offset=".45" stop-color="#1a0e15"/>
                <stop offset="1" stop-color="#0c0609"/>
              </linearGradient>
            </defs>
            <path d="M24 4h12v6h-3v22c0 8 14 16 14 34v62a8 8 0 0 1-8 8H21a8 8 0 0 1-8-8V66c0-18 14-26 14-34V10h-3z" fill="url(#glass)"/>
            <path d="M19 70v54" stroke="#fff" stroke-opacity=".18" stroke-width="3" stroke-linecap="round"/>
            <rect x="24" y="4" width="12" height="7" fill="#c9a45c"/>
            <rect x="16" y="86" width="28" height="26" rx="13" fill="#c9a45c"/>
            <text x="30" y="104" text-anchor="middle" font-size="10" font-weight="800" fill="#3a2a10" font-family="Georgia,serif">VIP</text>
          </svg>
        </div>
        <div class="waiting" id="waiting" hidden></div>
      </div>
    </section>

    <!-- ÇAT -->
    <section class="chat">
      <div class="chat-box" id="chatBox"></div>
      <div class="composer-wrap">
        <div class="emoji-panel" id="emojiPanel" hidden></div>
        <div class="composer">
          <input type="text" id="chatInput" placeholder="Mesajı bura yaz" maxlength="200" autocomplete="off">
          <button class="emoji-btn" id="emojiBtn" type="button" title="Smaylik">☺</button>
          <button class="send-btn" id="sendBtn" type="button" title="Göndər">➤</button>
        </div>
      </div>
    </section>

  </div>
  <div class="toast" id="toast"></div>

  <script type="module" src="js/game-main.js"></script>
</body>
</html>
