    <div id="chatYeri" style="position:relative;">

<!-- KLİP SEÇİM VƏ AXTARIŞ PƏNCƏRƏSİ -->
<div id="bb-clip-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.52); z-index:99999; align-items:center; justify-content:center; padding:14px; font-family:sans-serif;">
    <div style="width:100%; max-width:390px; height:82vh; background:#fff; border-radius:22px; padding:16px 14px; display:flex; flex-direction:column; gap:12px; box-shadow:0 14px 36px rgba(0,0,0,0.3); position:relative;">
        <button id="bb-clip-close" type="button" style="position:absolute; top:-10px; right:-8px; width:36px; height:36px; border-radius:50%; border:3px solid #fff; background:#9ccc65; color:#fff; font-size:18px; font-weight:700; cursor:pointer; box-shadow:0 3px 10px rgba(0,0,0,0.25);">✕</button>

        <div style="display:flex; justify-content:space-around; align-items:center; padding:4px 12px; border-bottom:1px solid #f0f0f0;">
            <button class="bb-tab-btn" data-tab="popular" style="background:none; border:none; font-size:22px; cursor:pointer; opacity:1;">🔥</button>
            <button class="bb-tab-btn" data-tab="favorites" style="background:none; border:none; font-size:22px; cursor:pointer; opacity:0.45;">⭐</button>
            <button class="bb-tab-btn" data-tab="history" style="background:none; border:none; font-size:22px; cursor:pointer; opacity:0.45;">🕒</button>
            <button class="bb-tab-btn" data-tab="search" style="background:none; border:none; font-size:22px; cursor:pointer; opacity:0.45;">🔍</button>
        </div>

        <div id="bb-tab-title" style="font-size:14px; font-weight:700; color:#888; padding:0 4px;">Populyar bölməsindən musiqi seç (9 bonus)</div>

        <div id="bb-search-box" style="display:none;">
            <input id="bb-yt-query" type="text" placeholder="Mahnı və ya müğənni adı yaz..."
                style="width:100%; padding:11px 14px; border-radius:12px; border:none; background:#f2f2f2; font-size:14px; outline:none; box-sizing:border-box;" />
        </div>

        <div id="bb-clip-grid" style="flex:1; overflow-y:auto; display:grid; grid-template-columns:1fr 1fr; gap:10px; align-content:start; padding-right:2px;"></div>
    </div>
</div>

<script>
(function () {
  const CLIP_COST = 9;

  // Geniş Populyar Siyahı (Azərbaycan, Türk, Rus, Qafqaz, Xarici hitlər)
  const POPULAR_CLIPS = [
    { videoId: "nVjsGKrE6E8", title: "Lana Del Rey - Summertime Sadness", duration: "04:25", thumb: "https://i.ytimg.com/vi/nVjsGKrE6E8/mqdefault.jpg" },
    { videoId: "M7lc1UVf-VE", title: "OMER DEEP - Medusa (Original Mix)", duration: "06:17", thumb: "https://i.ytimg.com/vi/M7lc1UVf-VE/mqdefault.jpg" },
    { videoId: "60ItHLz5WEA", title: "Alan Walker - Faded", duration: "03:32", thumb: "https://i.ytimg.com/vi/60ItHLz5WEA/mqdefault.jpg" },
    { videoId: "kJQP7kiw5Fk", title: "Luis Fonsi - Despacito", duration: "04:41", thumb: "https://i.ytimg.com/vi/kJQP7kiw5Fk/mqdefault.jpg" },
    { videoId: "JGwWNGJdvx8", title: "Ed Sheeran - Shape of You", duration: "04:23", thumb: "https://i.ytimg.com/vi/JGwWNGJdvx8/mqdefault.jpg" },
    { videoId: "RgKAFK5djSk", title: "Wiz Khalifa - See You Again", duration: "03:57", thumb: "https://i.ytimg.com/vi/RgKAFK5djSk/mqdefault.jpg" },
    { videoId: "fRh_vgS2dFE", title: "Justin Bieber - Sorry", duration: "03:25", thumb: "https://i.ytimg.com/vi/fRh_vgS2dFE/mqdefault.jpg" },
    { videoId: "09R8_2nJtjg", title: "Maroon 5 - Sugar", duration: "05:01", thumb: "https://i.ytimg.com/vi/09R8_2nJtjg/mqdefault.jpg" },
    { videoId: "OPf0YbXqDm0", title: "Mark Ronson - Uptown Funk", duration: "04:30", thumb: "https://i.ytimg.com/vi/OPf0YbXqDm0/mqdefault.jpg" },
    { videoId: "hT_nvWreIhg", title: "OneRepublic - Counting Stars", duration: "04:43", thumb: "https://i.ytimg.com/vi/hT_nvWreIhg/mqdefault.jpg" },
    { videoId: "YQHsXMglC9A", title: "Adele - Hello", duration: "06:06", thumb: "https://i.ytimg.com/vi/YQHsXMglC9A/mqdefault.jpg" },
    { videoId: "CevxZvSJLk8", title: "Katy Perry - Roar", duration: "04:29", thumb: "https://i.ytimg.com/vi/CevxZvSJLk8/mqdefault.jpg" },
    { videoId: "pRpeEdMmmQ0", title: "Shakira - Waka Waka", duration: "03:30", thumb: "https://i.ytimg.com/vi/pRpeEdMmmQ0/mqdefault.jpg" },
    { videoId: "SlPhMPnQ58k", title: "Maroon 5 - Memories", duration: "03:15", thumb: "https://i.ytimg.com/vi/SlPhMPnQ58k/mqdefault.jpg" },
    { videoId: "2Vv-BfVoq4g", title: "Ed Sheeran - Perfect", duration: "04:39", thumb: "https://i.ytimg.com/vi/2Vv-BfVoq4g/mqdefault.jpg" },
    { videoId: "e-ORhEE9VVg", title: "Taylor Swift - Blank Space", duration: "04:32", thumb: "https://i.ytimg.com/vi/e-ORhEE9VVg/mqdefault.jpg" }
  ];

  // Çoxmənbəli canlı YouTube axtarış serverləri
  const YT_SEARCH_APIS = [
    "https://pipedapi.kavin.rocks/search?filter=all&q=",
    "https://pipedapi.adminforge.de/search?filter=all&q=",
    "https://api.piped.projectsegfau.lt/search?filter=all&q=",
    "https://inv.nadeko.net/api/v1/search?type=video&q=",
    "https://invidious.nerdvpn.de/api/v1/search?type=video&q=",
    "https://yt.artemislena.eu/api/v1/search?type=video&q="
  ];

  let ytLivePlayer = null;
  let ytReady = false;
  let progressInterval = null;
  let zoomLevel = 0;

  // YouTube No-Cookie IFrame API (Reklamları minimuma endirir)
  if (!window.YT) {
    const s = document.createElement("script");
    s.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(s);
  }
  const prevReady = window.onYouTubeIframeAPIReady;
  window.onYouTubeIframeAPIReady = function () {
    if (typeof prevReady === "function") prevReady();
    ytLivePlayer = new YT.Player("bb-live-yt-frame", {
      width: "100%",
      height: "100%",
      host: "https://www.youtube-nocookie.com",
      playerVars: {
        autoplay: 1,
        controls: 0,
        disablekb: 1,
        modestbranding: 1,
        playsinline: 1,
        rel: 0,
        iv_load_policy: 3,
        fs: 0
      },
      events: {
        onReady: () => { ytReady = true; },
        onStateChange: (e) => {
          if (e.data === 0) stopAndHideClip();
        }
      }
    });
  };

  // Oyundakı aktiv istifadəçinin REAL profil şəklini tap (butulka şəklini deyil!)
  function getRealPlayerAvatar() {
    const uid = localStorage.getItem("userId") || localStorage.getItem("uid") || "";
    // 1. Masadakı oyunçu kartlarından öz profil şəklini tap (butulka.png olmayan ilk real profil şəkli)
    const seatImgs = Array.from(document.querySelectorAll("#masa img")).filter(
      img => img.id !== "butulka" && img.src && !img.src.includes("butulka")
    );
    if (uid) {
      const mySeat = document.querySelector(`#masa [data-uid="${uid}"] img, #masa [data-id="${uid}"] img`);
      if (mySeat && mySeat.src && !mySeat.src.includes("butulka")) return mySeat.src;
    }
    if (seatImgs.length > 0) return seatImgs[0].src;

    // 2. LocalStorage-də saxlanılan profil şəkli
    const stored = localStorage.getItem("userAvatar") || localStorage.getItem("avatar") || localStorage.getItem("photoURL") || localStorage.getItem("sekil");
    if (stored && !stored.includes("butulka")) return stored;

    return "https://ui-avatars.com/api/?background=ff6a10&color=fff&name=DJ";
  }

  function openClipModal() {
    const modal = document.getElementById("bb-clip-modal");
    if (modal) {
      modal.style.display = "flex";
      switchTab("popular");
    }
  }

  // Sağ üst klip düyməsinə və ya dairəvi DJ şəklinə basanda seçim pəncərəsini aç
  document.addEventListener("click", function (e) {
    const btn = e.target.closest("#musiqiBtn1, #musiqiBtn2, .musiqi-btn, #bb-dj-avatar-box");
    if (btn) {
      e.preventDefault();
      e.stopPropagation();
      openClipModal();
    }
  }, true);

  document.getElementById("bb-clip-close").addEventListener("click", function () {
    document.getElementById("bb-clip-modal").style.display = "none";
  });

  document.querySelectorAll(".bb-tab-btn").forEach(function (b) {
    b.addEventListener("click", function () { switchTab(b.dataset.tab); });
  });

  function switchTab(tab) {
    document.querySelectorAll(".bb-tab-btn").forEach(function (b) {
      b.style.opacity = b.dataset.tab === tab ? "1" : "0.45";
    });
    const titleEl = document.getElementById("bb-tab-title");
    const searchBox = document.getElementById("bb-search-box");

    if (tab === "search") {
      titleEl.textContent = "Musiqi axtar (9 bonus)";
      searchBox.style.display = "block";
      const inp = document.getElementById("bb-yt-query");
      setTimeout(() => inp.focus(), 80);
      if (inp.value.trim()) searchYouTubeLive(inp.value.trim());
      else renderGrid(POPULAR_CLIPS.slice(0, 8));
    } else if (tab === "favorites") {
      titleEl.textContent = "Sevimli musiqilər";
      searchBox.style.display = "none";
      renderGrid(JSON.parse(localStorage.getItem("bb_fav_clips") || "[]"));
    } else if (tab === "history") {
      titleEl.textContent = "Son qoşulan kliplər";
      searchBox.style.display = "none";
      renderGrid(JSON.parse(localStorage.getItem("bb_hist_clips") || "[]"));
    } else {
      titleEl.textContent = "Populyar bölməsindən musiqi seç (9 bonus)";
      searchBox.style.display = "none";
      renderGrid(POPULAR_CLIPS);
    }
  }

  // Canlı YouTube Axtarışı (Bütün serverləri paralel yoxlayır, hansı tez cavab versə onu göstərir)
  async function searchYouTubeLive(query) {
    const grid = document.getElementById("bb-clip-grid");
    grid.style.display = "block";
    grid.innerHTML = '<div style="text-align:center; color:#888; padding:26px 0; font-size:14px;">Mahnılar axtarılır...</div>';

    const requests = YT_SEARCH_APIS.map(async (base) => {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 4500);
      try {
        const res = await fetch(base + encodeURIComponent(query), { signal: ctrl.signal });
        clearTimeout(t);
        if (!res.ok) throw new Error("bad");
        const data = await res.json();

        if (Array.isArray(data.items)) {
          const list = data.items
            .filter(it => it.url && it.url.includes("v="))
            .slice(0, 16)
            .map(it => {
              const vid = it.url.split("v=")[1].split("&")[0];
              return {
                videoId: vid,
                title: it.title || "YouTube Musiqi",
                thumb: "https://i.ytimg.com/vi/" + vid + "/mqdefault.jpg"
              };
            });
          if (list.length) return list;
        }

        if (Array.isArray(data)) {
          const list = data
            .filter(it => it.videoId)
            .slice(0, 16)
            .map(it => ({
              videoId: it.videoId,
              title: it.title || "YouTube Musiqi",
              thumb: "https://i.ytimg.com/vi/" + it.videoId + "/mqdefault.jpg"
            }));
          if (list.length) return list;
        }
        throw new Error("empty");
      } catch (e) {
        clearTimeout(t);
        throw e;
      }
    });

    try {
      const results = await Promise.any(requests);
      renderGrid(results);
    } catch (_) {
      const localMatch = POPULAR_CLIPS.filter(c => c.title.toLowerCase().includes(query.toLowerCase()));
      renderGrid(localMatch);
    }
  }

  let searchTimer = null;
  document.getElementById("bb-yt-query").addEventListener("input", function (e) {
    clearTimeout(searchTimer);
    const q = e.target.value.trim();
    searchTimer = setTimeout(function () {
      if (!q) renderGrid(POPULAR_CLIPS.slice(0, 8));
      else searchYouTubeLive(q);
    }, 350);
  });

  function renderGrid(items) {
    const grid = document.getElementById("bb-clip-grid");
    grid.innerHTML = "";
    if (!items.length) {
      grid.style.display = "block";
      grid.innerHTML = '<div style="text-align:center; color:#777; padding:28px 0; font-size:14px;">Hər hansı musiqi tapılmadı</div>';
      return;
    }
    const favs = JSON.parse(localStorage.getItem("bb_fav_clips") || "[]");
    grid.style.display = "grid";

    items.forEach(function (clip) {
      const isFav = favs.some(x => x.videoId === clip.videoId);
      const card = document.createElement("div");
      card.style.cssText = "border-radius:10px; overflow:hidden; background:#fafafa; border:1px solid #eee; cursor:pointer; position:relative;";
      card.innerHTML = `
        <div style="position:relative;">
          <img src="${clip.thumb}" style="width:100%; height:78px; object-fit:cover; display:block;" />
          <span class="bb-fav-star" style="position:absolute; top:4px; right:5px; font-size:16px; color:#fff; text-shadow:0 1px 4px #000;">${isFav ? "⭐" : "☆"}</span>
          <span style="position:absolute; bottom:4px; right:4px; background:rgba(0,0,0,0.75); color:#fff; font-size:10px; padding:1px 5px; border-radius:4px;">9 🔶</span>
        </div>
        <div style="padding:6px; font-size:11px; font-weight:600; color:#222; line-height:1.25; height:32px; overflow:hidden;">${clip.title}</div>
      `;

      card.querySelector(".bb-fav-star").addEventListener("click", function (ev) {
        ev.stopPropagation();
        let list = JSON.parse(localStorage.getItem("bb_fav_clips") || "[]");
        if (list.some(x => x.videoId === clip.videoId)) {
          list = list.filter(x => x.videoId !== clip.videoId);
          ev.currentTarget.textContent = "☆";
        } else {
          list.unshift(clip);
          ev.currentTarget.textContent = "⭐";
        }
        localStorage.setItem("bb_fav_clips", JSON.stringify(list.slice(0, 30)));
      });

      card.addEventListener("click", function () { startClipWithBonus(clip); });
      grid.appendChild(card);
    });
  }

  function startClipWithBonus(clip) {
    const urekEl = document.getElementById("urekSayi");
    const currentHearts = parseInt(urekEl?.textContent || "0", 10);

    if (currentHearts < CLIP_COST) {
      alert("Klip qoşmaq üçün minimum 9 bonus lazımdır!");
      return;
    }

    if (urekEl) urekEl.textContent = String(currentHearts - CLIP_COST);

    const hist = JSON.parse(localStorage.getItem("bb_hist_clips") || "[]");
    localStorage.setItem("bb_hist_clips", JSON.stringify([clip, ...hist.filter(x => x.videoId !== clip.videoId)].slice(0, 20)));
    document.getElementById("bb-clip-modal").style.display = "none";

    const payload = {
      clipInstanceId: Date.now() + "_clip",
      videoId: clip.videoId,
      title: clip.title,
      djAvatar: getRealPlayerAvatar(),
      startedAt: Date.now()
    };

    if (typeof window.bbBroadcastClip === "function") {
      window.bbBroadcastClip(payload, CLIP_COST);
    }

    playClipOnWidget(payload);
  }

  window.playClipOnWidget = function (data) {
    if (!data || !data.videoId) return;
    const widget = document.getElementById("bb-live-clip-widget");
    document.getElementById("bb-dj-avatar").src = data.djAvatar || getRealPlayerAvatar();
    widget.style.display = "block";

    const elapsedSec = Math.max(0, Math.floor((Date.now() - Number(data.startedAt || Date.now())) / 1000));

    const run = function () {
      ytLivePlayer.loadVideoById({ videoId: data.videoId, startSeconds: elapsedSec });
      const vol = Number(document.getElementById("bb-volume-slider").value || 85);
      ytLivePlayer.unMute();
      ytLivePlayer.setVolume(vol);
      ytLivePlayer.playVideo();
      startCircularRing();
    };

    if (ytReady && ytLivePlayer && typeof ytLivePlayer.loadVideoById === "function") {
      run();
    } else {
      const wait = setInterval(function () {
        if (ytReady && ytLivePlayer && typeof ytLivePlayer.loadVideoById === "function") {
          clearInterval(wait);
          run();
        }
      }, 200);
    }
  };

  function startCircularRing() {
    clearInterval(progressInterval);
    const circle = document.getElementById("bb-ring-progress");
    const circumference = 2 * Math.PI * 33;

    progressInterval = setInterval(function () {
      if (!ytLivePlayer || typeof ytLivePlayer.getCurrentTime !== "function") return;
      const cur = ytLivePlayer.getCurrentTime() || 0;
      const dur = ytLivePlayer.getDuration() || 0;

      if (dur > 0) {
        const ratio = Math.min(1, cur / dur);
        circle.style.strokeDashoffset = String(circumference * (1 - ratio));
        if (cur >= dur - 0.5) {
          stopAndHideClip();
        }
      }
    }, 250);
  }

  function stopAndHideClip() {
    clearInterval(progressInterval);
    if (ytLivePlayer && typeof ytLivePlayer.stopVideo === "function") {
      ytLivePlayer.stopVideo();
    }
    const w = document.getElementById("bb-live-clip-widget");
    if (w) w.style.display = "none";
  }

  // Kvadrat düymə: 1-ci klik -> 1x, 2-ci klik -> 2x, 3-cü klik -> orijinal
  document.getElementById("bb-zoom-clip-btn").addEventListener("click", function () {
    zoomLevel = (zoomLevel + 1) % 3;
    const widget = document.getElementById("bb-live-clip-widget");
    const topBox = document.getElementById("bb-live-top");

    if (zoomLevel === 0) {
      widget.style.width = "258px";
      topBox.style.height = "86px";
    } else if (zoomLevel === 1) {
      widget.style.width = "315px";
      topBox.style.height = "125px";
    } else {
      widget.style.width = "calc(100% - 12px)";
      topBox.style.height = "175px";
    }
  });

  const volSlider = document.getElementById("bb-volume-slider");
  const muteBtn = document.getElementById("bb-mute-clip-btn");

  volSlider.addEventListener("input", function () {
    const v = Number(volSlider.value);
    if (!ytLivePlayer) return;
    if (v === 0) {
      ytLivePlayer.mute();
      muteBtn.textContent = "🔇";
    } else {
      ytLivePlayer.unMute();
      ytLivePlayer.setVolume(v);
      muteBtn.textContent = "🔊";
    }
  });

  muteBtn.addEventListener("click", function () {
    if (!ytLivePlayer) return;
    if (ytLivePlayer.isMuted()) {
      ytLivePlayer.unMute();
      const v = Number(volSlider.value) || 80;
      volSlider.value = v;
      ytLivePlayer.setVolume(v);
      muteBtn.textContent = "🔊";
    } else {
      ytLivePlayer.mute();
      muteBtn.textContent = "🔇";
    }
  });
})();
</script>
</body>

try { await import("./js/" + f + ".js"); }
catch (e) {
document.body.insertAdjacentHTML("afterbegin",
'<div style="position:fixed;z-index:99;top:0;left:0;right:0;background:#fff;color:red;padding:8px;font-size:14px;word-break:break-all">' + f + ".js: " + e.message + "</div>");
break;
}
}
