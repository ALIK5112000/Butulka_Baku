<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Butulka Baku - Profil</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body {
            background: linear-gradient(135deg, #090314, #120624, #180933, #090314);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 15px 90px 15px;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .top-nav {
            width: 100%;
            max-width: 450px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 6px;
        }
        .vip-btn {
            background: linear-gradient(135deg, #ff6b95, #ff8da1);
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            color: #fff;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 15px rgba(255, 107, 149, 0.4);
            cursor: pointer;
        }
        .top-icons {
            display: flex;
            gap: 6px;
        }
        .icon-pill {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 15px;
            transition: 0.3s;
        }
        .icon-pill:hover { background: rgba(255, 255, 255, 0.12); }

        .profile-card {
            width: 100%;
            max-width: 450px;
            background: rgba(18, 9, 36, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 107, 149, 0.2);
            border-radius: 26px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            margin-bottom: 15px;
        }

        .user-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        .avatar-box {
            position: relative;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            border: 2px solid #ff6b95;
            overflow: hidden;
            background: #0d041a;
            box-shadow: 0 0 15px rgba(255, 107, 149, 0.3);
        }
        .avatar-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .user-info { flex: 1; }
        .username-badge {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 107, 149, 0.25);
            padding: 8px 14px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            display: inline-block;
            margin-bottom: 8px;
        }
        .id-badge-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .id-pill {
            background: linear-gradient(135deg, #d4af37, #f1c40f);
            color: #000;
            font-weight: bold;
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(241, 196, 15, 0.3);
        }
        .tasdiq-pill {
            background: rgba(255, 255, 255, 0.08);
            color: #bbb;
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 10px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .status-box {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 14px 16px;
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        .stat-card {
            background: rgba(14, 6, 28, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 14px 10px;
            text-align: center;
            transition: 0.3s;
        }
        .stat-card:hover {
            border-color: rgba(255, 107, 149, 0.3);
        }
        .stat-icon { font-size: 16px; margin-bottom: 4px; color: #ff6b95; }
        .stat-value { font-size: 18px; font-weight: bold; color: #fff; margin-bottom: 2px; }
        .stat-label { font-size: 12px; color: #888; }

        .store-banner {
            background: linear-gradient(135deg, rgba(30, 12, 56, 0.9), rgba(45, 18, 78, 0.9));
            border: 1px solid rgba(255, 170, 51, 0.25);
            border-radius: 18px;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            margin-top: 15px;
        }
        .store-title { font-weight: bold; font-size: 16px; color: #ffaa33; margin-bottom: 3px; }
        .store-desc { font-size: 12px; color: #999; }

        .footer-menu {
            position: fixed;
            bottom: 0; left: 0; width: 100%;
            background: rgba(10, 4, 22, 0.95);
            backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 8px 5px;
            z-index: 1000;
        }
        .footer-item {
            text-align: center;
            color: #777;
            font-size: 11px;
            cursor: pointer;
            text-decoration: none;
        }
        .footer-item.active { color: #ff6b95; }
        .footer-item div:first-child { font-size: 20px; margin-bottom: 2px; }
        
        .footer-center-btn {
            width: 46px;
            height: 46px;
            background: linear-gradient(135deg, #ff6b95, #956bff);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 107, 149, 0.5);
            margin-top: -12px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <button class="vip-btn">👑 VIP</button>
        <div class="top-icons">
            <div class="icon-pill">🛒</div>
            <div class="icon-pill">🔍</div>
            <div class="icon-pill">🎧</div>
            <div class="icon-pill">🔔</div>
            <div class="icon-pill" onclick="logout()" title="Çıxış">🚪</div>
        </div>
    </div>

    <div class="profile-card">
        <div class="user-header">
            <div class="avatar-box">
                <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80" alt="Avatar">
            </div>
            <div class="user-info">
                <div class="username-badge" id="profileUsername">Yüklənir...</div>
                <div class="id-badge-row">
                    <div class="id-pill">ID <span id="profileId">-----</span></div>
                    <div class="tasdiq-pill">Təsdiq al</div>
                </div>
            </div>
        </div>

        <div class="status-box">
            <span>✏️</span> Status yaz...
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">❤️</div>
                <div class="stat-value" id="profileHearts">7200</div>
                <div class="stat-label">Ürək</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">💎</div>
                <div class="stat-value" id="profileJetons">1400</div>
                <div class="stat-label">Kristal</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">👥</div>
                <div class="stat-value" id="profileFriends">0</div>
                <div class="stat-label">Dostlar</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">👁️</div>
                <div class="stat-value" id="profileViews">1</div>
                <div class="stat-label">Baxanlar</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">👤</div>
                <div class="stat-value">0</div>
                <div class="stat-label">İzlədiyim</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⭐</div>
                <div class="stat-value">0</div>
                <div class="stat-label">İzləyən</div>
            </div>
        </div>

        <div class="store-banner">
            <div>
                <div class="store-title">🦋 Mağaza</div>
                <div class="store-desc">Qanad satışı · VIP · Ramkalar</div>
            </div>
            <div style="font-size: 24px;">✨</div>
        </div>
    </div>

    <!-- Aşağı Menü (Oyunlar səhifəsinə düzgün keçid ilə) -->
    <div class="footer-menu">
        <a href="profile.html" class="footer-item active">
            <div>🏠</div>
            <div>Ana səhifə</div>
        </a>
        <a href="oyun.html" class="footer-item">
            <div>🎮</div>
            <div>Oyunlar</div>
        </a>
        <div class="footer-center-btn">+</div>
        <div class="footer-item" onclick="alert('Mesajlar bölməsi açılır...')">
            <div>💬</div>
            <div>Mesajlar</div>
        </div>
        <div class="footer-item" onclick="alert('Videolar bölməsi...')">
            <div>🎬</div>
            <div>Videolar</div>
        </div>
    </div>

    <!-- Firebase Canlı Bağlantı və Real Göstəricilər Skripti -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAANVVrJKhZyaCErn8YFNVTUPF70A9xlmQ",
          authDomain: "butulka-baku-istifadeci-bazasi.firebaseapp.com",
          projectId: "butulka-baku-istifadeci-bazasi",
          storageBucket: "butulka-baku-istifadeci-bazasi.firebasestorage.app",
          messagingSenderId: "52438073026",
          appId: "1:52438073026:web:1c4a0a8d1fc1ce5f78455b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadProfileData() {
            const savedUser = localStorage.getItem("currentUser");
            if (!savedUser) {
                window.location.href = "index.html";
                return;
            }

            const userData = JSON.parse(savedUser);
            
            document.getElementById('profileUsername').innerText = userData.username || "İstifadəçi";
            document.getElementById('profileId').innerText = userData.id || "0000";
            if(userData.jetons) document.getElementById('profileJetons').innerText = userData.jetons;
            if(userData.hearts) document.getElementById('profileHearts').innerText = userData.hearts;

            try {
                const q = query(collection(db, "users"), where("id", "==", userData.id));
                const querySnapshot = await getDocs(q);
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    if(data.username) document.getElementById('profileUsername').innerText = data.username;
                    if(data.jetons !== undefined) document.getElementById('profileJetons').innerText = data.jetons;
                    if(data.hearts !== undefined) document.getElementById('profileHearts').innerText = data.hearts;
                });
            } catch(e) {
                console.log("Bazadan oxuma xətası:", e);
            }

            let viewKey = "profile_views_" + userData.id;
            let currentViews = parseInt(localStorage.getItem(viewKey) || "1");
            document.getElementById('profileViews').innerText = currentViews;
        }

        loadProfileData();

        window.logout = function() {
            localStorage.removeItem("currentUser");
            window.location.href = "index.html";
        };
    </script>
</body>
</html>
