<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Butulka Baku - Giriş</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0b0713; color: #ffffff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 15px; }

        .hidden { display: none !important; }
        
        .auth-container { width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; }
        .lang-bar { display: flex; gap: 6px; background: rgba(255, 255, 255, 0.05); padding: 6px 10px; border-radius: 20px; margin-bottom: 25px; border: 1px solid rgba(255, 255, 255, 0.1); flex-wrap: wrap; justify-content: center; }
        .lang-btn { padding: 5px 10px; border-radius: 15px; font-size: 12px; cursor: pointer; color: #b3b3b3; }
        .lang-btn.active { background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%); color: white; }
        
        .logo-box { text-align: center; margin-bottom: 20px; }
        .logo-icon { width: 70px; height: 70px; background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%); border-radius: 22px; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; font-size: 32px; color: white; box-shadow: 0 0 25px rgba(236, 72, 153, 0.5); }
        .brand-title { font-size: 32px; font-weight: 700; font-style: italic; color: #f472b6; }
        
        .auth-card { background: rgba(23, 15, 38, 0.9); border-radius: 28px; padding: 25px; width: 100%; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.08); }
        .tab-switcher { display: flex; background: rgba(10, 6, 18, 0.6); border-radius: 16px; padding: 4px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; text-align: center; border-radius: 12px; font-weight: 600; font-size: 15px; cursor: pointer; color: #94a3b8; }
        .tab-btn.active { background: linear-gradient(135deg, #ec4899 0%, #d946ef 100%); color: white; }
        
        .notice-box { background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 14px; padding: 12px 15px; margin-bottom: 20px; font-size: 13px; color: #fbbf24; }
        .form-group { margin-bottom: 16px; }
        .form-label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 8px; }
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-icon { position: absolute; left: 16px; color: #64748b; }
        .input-field { width: 100%; background: rgba(10, 6, 18, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 14px; padding: 14px 16px 14px 45px; color: white; font-size: 14px; outline: none; }
        
        .gender-options { display: flex; gap: 12px; }
        .gender-btn { flex: 1; padding: 15px; background: rgba(10, 6, 18, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; color: #64748b; }
        .gender-btn.active { border-color: #3b82f6; background: rgba(59, 130, 246, 0.1); color: #3b82f6; }
        .submit-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #ff4b8b 0%, #ff2a70 100%); border: none; border-radius: 16px; color: white; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="lang-bar">
            <div class="lang-btn active" onclick="changeLang('az')">🇦🇿 Azərbaycanca</div>
            <div class="lang-btn" onclick="changeLang('ka')">🇬🇪 ქართული</div>
            <div class="lang-btn" onclick="changeLang('tr')">🇹🇷 Türkçe</div>
            <div class="lang-btn" onclick="changeLang('en')">🇬🇧 English</div>
        </div>

        <div class="logo-box">
            <div class="logo-icon"><i class="fa-solid fa-heart"></i></div>
            <h1 class="brand-title">Butulka Baku</h1>
            <p style="color:#94a3b8; font-size: 14px;" data-t="tSub">Hesabına daxil ol və oyuna davam et</p>
        </div>

        <div class="auth-card">
            <div class="tab-switcher">
                <div class="tab-btn active" id="tab-login" onclick="switchTab('login')" data-t="tLogin">Giriş</div>
                <div class="tab-btn" id="tab-register" onclick="switchTab('register')" data-t="tReg">Qeydiyyat</div>
            </div>

            <!-- GİRİŞ FORMASI -->
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label" data-t="tUserLabel">İstifadəçi adı və ya ID</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-user input-icon"></i>
                        <input type="text" id="login-user" class="input-field" placeholder="Nik və ya ID yazın" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" data-t="tPassLabel">Şifrə</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="login-pass" class="input-field" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" class="submit-btn" data-t="tLoginBtn">Daxil ol</button>
            </form>

            <!-- QEYDİYYAT FORMASI -->
            <form id="register-form" class="hidden" onsubmit="handleRegister(event)">
                <div class="notice-box" data-t="tNotice">⚠️ <strong>Diqqət!</strong> 1 cihazdan ən çox 2 nik açmaq olar.</div>
                <div class="form-group">
                    <label class="form-label" data-t="tUserLabel">İstifadəçi adı (Nik)</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-user input-icon"></i>
                        <input type="text" id="reg-user" class="input-field" placeholder="Nik seçin" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" data-t="tPassLabel">Şifrə</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="reg-pass" class="input-field" placeholder="Ən azı 6 simvol" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" data-t="tGenderLabel">Cinsiyyət</label>
                    <div class="gender-options">
                        <div class="gender-btn active" id="gender-male" onclick="selectGender('male')"><i class="fa-solid fa-mars"></i> <span data-t="tMale">Kişi</span></div>
                        <div class="gender-btn" id="gender-female" onclick="selectGender('female')"><i class="fa-solid fa-venus"></i> <span data-t="tFemale">Qadın</span></div>
                    </div>
                </div>
                <button type="submit" class="submit-btn" data-t="tRegBtn">Hesab yarat</button>
            </form>
        </div>
    </div>

    <script>
        let selectedGender = 'male';

        const dict = {
            az: { tSub: "Hesabına daxil ol və oyuna davam et", tLogin: "Giriş", tReg: "Qeydiyyat", tUserLabel: "İstifadəçi adı və ya ID", tPassLabel: "Şifrə", tLoginBtn: "Daxil ol", tRegBtn: "Hesab yarat", tNotice: "⚠️ <strong>Diqqət!</strong> 1 cihazdan ən çox 2 nik açmaq olar.", tGenderLabel: "Cinsiyyət", tMale: "Kişi", tFemale: "Qadın" },
            ka: { tSub: "შედით თქვენს ანგარიშში", tLogin: "შესვლა", tReg: "რეგისტრაცია", tUserLabel: "მომხმარებელი ან ID", tPassLabel: "პაროლი", tLoginBtn: "შესვლა", tRegBtn: "რეგისტრაცია", tNotice: "⚠️ <strong>ყურადღება!</strong> 1 მოწყობილობიდან მაქსიმუმ 2 ნიკია დასაშვები.", tGenderLabel: "სქესი", tMale: "კაცი", tFemale: "ქალი" },
            tr: { tSub: "Hesabınıza giriş yapın", tLogin: "Giriş", tReg: "Kayıt Ol", tUserLabel: "Kullanıcı adı veya ID", tPassLabel: "Şifre", tLoginBtn: "Giriş Yap", tRegBtn: "Hesap Oluştur", tNotice: "⚠️ <strong>Dikkat!</strong> 1 cihazdan en fazla 2 nick açılabilir.", tGenderLabel: "Cinsiyet", tMale: "Erkek", tFemale: "Kadın" },
            en: { tSub: "Log in to your account", tLogin: "Login", tRegister: "Register", tUserLabel: "Username or ID", tPassLabel: "Password", tLoginBtn: "Log In", tRegBtn: "Create Account", tNotice: "⚠️ <strong>Attention!</strong> Max 2 nicknames per device.", tGenderLabel: "Gender", tMale: "Male", tFemale: "Female" }
        };

        function changeLang(lang) {
            document.querySelectorAll('.lang-bar .lang-btn').forEach(b => b.classList.remove('active'));
            if(event && event.target) event.target.classList.add('active');

            document.querySelectorAll('[data-t]').forEach(el => {
                const k = el.getAttribute('data-t');
                if(dict[lang][k]) el.innerHTML = dict[lang][k];
            });
        }

        function generateUniqueId() {
            let existingIds = [];
            for(let i=0; i<localStorage.length; i++) {
                const key = localStorage.key(i);
                if(key.startsWith('user_')) {
                    const uData = JSON.parse(localStorage.getItem(key));
                    if(uData.id) existingIds.push(uData.id.toString());
                }
            }
            let newId;
            do {
                newId = Math.floor(1000 + Math.random() * 9000).toString();
            } while (existingIds.includes(newId));
            return parseInt(newId);
        }

        window.onload = function() {
            // Admin profilinin həmişə mövcud olmasını təmin edirik
            if(!localStorage.getItem('user_Alik')) {
                const defaultAdmin = {
                    username: "Alik", pass: "ALIYEV511@", gender: 'male', 
                    id: 1836, coins: 5100, hearts: 185, status: "Baş Admin 👑",
                    country: "🇦🇿 Azərbaycan", city: "Bakı", age: "25",
                    role: 'admin', muteUntil: 0, banUntil: 0, notification: null,
                    avatar: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150"
                };
                localStorage.setItem('user_Alik', JSON.stringify(defaultAdmin));
            } else {
                let alikData = JSON.parse(localStorage.getItem('user_Alik'));
                alikData.pass = "ALIYEV511@";
                localStorage.setItem('user_Alik', JSON.stringify(alikData));
            }
        };

        function switchTab(type) {
            document.getElementById('login-form').classList.toggle('hidden', type !== 'login');
            document.getElementById('register-form').classList.toggle('hidden', type === 'login');
            document.getElementById('tab-login').classList.toggle('active', type === 'login');
            document.getElementById('tab-register').classList.toggle('active', type !== 'login');
        }

        function selectGender(g) {
            selectedGender = g;
            document.getElementById('gender-male').classList.toggle('active', g === 'male');
            document.getElementById('gender-female').classList.toggle('active', g === 'female');
        }

        function handleRegister(e) {
            e.preventDefault();
            const u = document.getElementById('reg-user').value.trim();
            const p = document.getElementById('reg-pass').value;

            if(localStorage.getItem('user_' + u)) {
                alert('Bu istifadəçi adı artıq mövcuddur!');
                return;
            }

            const uniqueId = generateUniqueId();
            const newUser = { 
                username: u, pass: p, gender: selectedGender, 
                id: uniqueId, 
                coins: 5100, hearts: 185, status: "Şirin Dil 😔",
                country: "🇦🇿 Azərbaycan", city: "Bakı", age: "20",
                role: 'user', muteUntil: 0, banUntil: 0, notification: null,
                avatar: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150"
            };

            localStorage.setItem('user_' + u, JSON.stringify(newUser));
            localStorage.setItem('putulka_logged_user', JSON.stringify(newUser));
            
            // profil səhifəsinə keçid
            window.location.href = "profil.html";
        }

        function handleLogin(e) {
            e.preventDefault();
            const inputVal = document.getElementById('login-user').value.trim();
            const p = document.getElementById('login-pass').value;

            let parsedUser = null;
            for(let i=0; i<localStorage.length; i++) {
                const key = localStorage.key(i);
                if(key.startsWith('user_')) {
                    const uData = JSON.parse(localStorage.getItem(key));
                    if(uData.username.toLowerCase() === inputVal.toLowerCase() || uData.id.toString() === inputVal) {
                        parsedUser = uData;
                        break;
                    }
                }
            }

            if(!parsedUser) { alert('İstifadəçi tapılmadı!'); return; }
            if(parsedUser.pass !== p) { alert('Şifrə yanlışdır!'); return; }

            const now = new Date().getTime();
            if(parsedUser.banUntil && now < parsedUser.banUntil) {
                alert('Diqqət! Bu hesab bloklanmışdır.');
                return;
            }

            localStorage.setItem('putulka_logged_user', JSON.stringify(parsedUser));
            
            // profil səhifəsinə keçid
            window.location.href = "profil.html";
        }
    </script>
</body>
</html>
