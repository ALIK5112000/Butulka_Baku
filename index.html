<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Butulka Baku - Giriş</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Hərəkətli Neon Arxa Fon (putulka.com stili) */
        body {
            background: linear-gradient(135deg, #0d061f, #1a0b36, #2d1254, #120324);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Arxa fonda hərəkət edən kiçik neon icon elementləri */
        .bg-particles {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }
        .particle {
            position: absolute;
            display: block;
            list-style: none;
            width: 20px;
            height: 20px;
            background: rgba(255, 117, 140, 0.15);
            box-shadow: 0 0 10px rgba(255, 117, 140, 0.3);
            animation: animateParticle 20s linear infinite;
            bottom: -150px;
            border-radius: 50%;
        }
        .particle:nth-child(1) { left: 10%; width: 40px; height: 40px; animation-duration: 15s; }
        .particle:nth-child(2) { left: 20%; width: 20px; height: 20px; animation-duration: 12s; animation-delay: 2s; }
        .particle:nth-child(3) { left: 35%; width: 50px; height: 50px; animation-duration: 18s; animation-delay: 4s; }
        .particle:nth-child(4) { left: 50%; width: 25px; height: 25px; animation-duration: 10s; animation-delay: 1s; }
        .particle:nth-child(5) { left: 65%; width: 35px; height: 35px; animation-duration: 14s; animation-delay: 3s; }
        .particle:nth-child(6) { left: 80%; width: 45px; height: 45px; animation-duration: 16s; animation-delay: 5s; }

        @keyframes animateParticle {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-1000px) rotate(720deg); opacity: 0; }
        }

        /* Əsas Konteyner (Neon Çərçivə) */
        .container {
            width: 100%;
            max-width: 420px;
            background: rgba(22, 10, 46, 0.85);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 117, 140, 0.4);
            border-radius: 28px;
            padding: 35px 30px;
            box-shadow: 0 0 30px rgba(255, 117, 140, 0.25), 0 15px 35px rgba(0, 0, 0, 0.6);
            z-index: 2;
            position: relative;
        }

        /* Neon Logo və Başlıq */
        .logo-box {
            text-align: center;
            margin-bottom: 25px;
        }
        .logo-icon {
            font-size: 45px;
            margin-bottom: 5px;
            filter: drop-shadow(0 0 12px rgba(255, 117, 140, 0.8));
            animation: pulseIcon 2s infinite ease-in-out;
        }
        @keyframes pulseIcon {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .logo-title {
            font-size: 34px;
            font-weight: 800;
            background: linear-gradient(135deg, #ff758c, #ff7eb3, #ffa8b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 117, 140, 0.5);
            font-style: italic;
            letter-spacing: 1px;
        }

        /* Tabs (Giriş / Qeydiyyat düymələri) */
        .tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            padding: 6px;
            margin-bottom: 25px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            cursor: pointer;
            border-radius: 12px;
            font-weight: 600;
            color: #aaa;
            transition: 0.3s;
        }
        .tab.active {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 117, 140, 0.6);
        }

        /* Formalar */
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #ff9eb3;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 117, 140, 0.2);
            border-radius: 14px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }
        .form-group input:focus {
            border-color: #ff758c;
            box-shadow: 0 0 15px rgba(255, 117, 140, 0.4);
            background: rgba(0, 0, 0, 0.6);
        }

        /* Neon Düymə */
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 117, 140, 0.5);
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn:hover {
            box-shadow: 0 0 25px rgba(255, 117, 140, 0.8);
            transform: translateY(-2px);
        }
        .btn:active { transform: scale(0.98); }
        
        .form-section { display: none; }
        .form-section.active { display: block; }
        
        /* Modal Popup */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #1a0b36;
            padding: 35px 30px;
            border-radius: 24px;
            text-align: center;
            max-width: 340px;
            width: 90%;
            border: 2px solid rgba(255, 117, 140, 0.5);
            box-shadow: 0 0 30px rgba(255, 117, 140, 0.4);
        }
    </style>
</head>
<body>

    <!-- Arxa fonda hərəkət edən neon hissəciklər -->
    <ul class="bg-particles">
        <li></li><li></li><li></li><li></li><li></li><li></li>
    </ul>

    <div class="container">
        <div class="logo-box">
            <div class="logo-icon">🍾</div>
            <div class="logo-title">Butulka Baku</div>
        </div>
        
        <div class="tabs">
            <div class="tab active" onclick="switchTab('login')">Giriş</div>
            <div class="tab" onclick="switchTab('register')">Qeydiyyat</div>
        </div>

        <!-- GİRİŞ FORMASI -->
        <div id="loginForm" class="form-section active">
            <div class="form-group">
                <label>İstifadəçi adı və ya ID</label>
                <input type="text" id="loginUser" placeholder="İstifadəçi adı və ya ID">
            </div>
            <div class="form-group">
                <label>Şifrə</label>
                <input type="password" id="loginPass" placeholder="••••••••">
            </div>
            <button class="btn" onclick="loginUser()">Daxil ol</button>
        </div>

        <!-- QEYDİYYAT FORMASI -->
        <div id="registerForm" class="form-section">
            <div class="form-group">
                <label>İstifadəçi adı</label>
                <input type="text" id="regUser" placeholder="İstifadəçi adı seç">
            </div>
            <div class="form-group">
                <label>Şifrə (ən azı 6 simvol)</label>
                <input type="password" id="regPass" placeholder="••••••••">
            </div>
            <button class="btn" onclick="registerUser()">Hesab yarat</button>
        </div>
    </div>

    <!-- UĞURLU QEYDİYYAT MODALI -->
    <div id="successModal" class="modal">
        <div class="modal-content">
            <h3 style="color:#ff758c; margin-bottom:15px; font-size: 22px;">Uğurlu Qeydiyyat!</h3>
            <p style="color:#ddd; margin-bottom:10px;">Sizin unikal ID nömrəniz:</p>
            <h2 id="newIdText" style="color:#fff; margin-bottom:25px; font-size: 36px; text-shadow: 0 0 10px #ff758c;">1836</h2>
            <button class="btn" onclick="goToProfile()">Bağla</button>
        </div>
    </div>

    <!-- Firebase Bazası ilə Əlaqə -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAANVVrJKhZyaCErn8YFNVTUPF70A9xlmQ",
          authDomain: "butulka-baku-istifadeci-bazasi.firebaseapp.com",
          projectId: "butulka-baku-istifadeci-bazasi",
          storageBucket: "butulka-baku-istifadeci-bazasi.firebasestorage.app",
          messagingSenderId: "52438073026",
          appId: "1:52438073026:web:1c4a0a8d1fc1ce5f78455b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.switchTab = function(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form-section').forEach(f => f.classList.remove('active'));
            if(tab === 'login') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
        };

        window.registerUser = async function() {
            const username = document.getElementById('regUser').value;
            const password = document.getElementById('regPass').value;

            if(!username || password.length < 6) {
                alert("Zəhmət olmasa adı daxil edin və şifrə ən az 6 simvol olsun!");
                return;
            }

            const uniqueId = Math.floor(10000 + Math.random() * 90000);

            try {
                await addDoc(collection(db, "users"), {
                    username: username,
                    password: password,
                    id: uniqueId,
                    jetons: 1400,
                    hearts: 7200,
                    vip: false,
                    createdAt: new Date()
                });

                localStorage.setItem("currentUser", JSON.stringify({username, id: uniqueId, jetons: 1400, hearts: 7200}));
                document.getElementById('newIdText').innerText = uniqueId;
                document.getElementById('successModal').style.display = 'flex';
            } catch(e) {
                alert("Xəta baş verdi: " + e.message);
            }
        };

        window.loginUser = async function() {
            const userInput = document.getElementById('loginUser').value;
            const passwordInput = document.getElementById('loginPass').value;

            if(!userInput || !passwordInput) {
                alert("Xanaları doldurun!");
                return;
            }

            try {
                const q = query(collection(db, "users"), where("username", "==", userInput));
                const querySnapshot = await getDocs(q);
                
                let found = false;
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    if(data.password === passwordInput) {
                        found = true;
                        localStorage.setItem("currentUser", JSON.stringify(data));
                        window.location.href = "profile.html";
                    }
                });

                if(!found) {
                    alert("İstifadəçi adı və ya şifrə yanlışdır!");
                }
            } catch(e) {
                alert("Giriş xətası: " + e.message);
            }
        };

        window.goToProfile = function() {
            window.location.href = "profile.html";
        };
    </script>
</body>
</html>
