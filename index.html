    <script>
        // --- GAME STATE & PLAYERS DATA ---
        let currentUser = {
            id: 0,
            name: "Aysel",
            gender: "female",
            avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&h=150&fit=crop&crop=faces",

        const initialBotPlayers = [
            { id: 1, name: "Elvin", gender: "male", avatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&h=150&fit=crop&crop=faces", kisses: 98 },
            { id: 2, name: "Leyla", gender: "female", avatar: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150&h=150&fit=crop&crop=faces", kisses: 210 },
            { id: 3, name: "Murad", gender: "male", avatar: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150&h=150&fit=crop&crop=faces", kisses: 75 },
            { id: 4, name: "Nərgiz", gender: "female", avatar: "https://images.unsplash.com/photo-1517841905240-472988babdf9?w=150&h=150&fit=crop&crop=faces", kisses: 145 },
            { id: 5, name: "Rauf", gender: "male", avatar: "https://images.unsplash.com/photo-1522075469751-3a6694fb2f61?w=150&h=150&fit=crop&crop=faces", kisses: 189 },
            { id: 6, name: "Gunay", gender: "female", avatar: "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=150&h=150&fit=crop&crop=faces", kisses: 88 },
            { id: 7, name: "Tural", gender: "male", avatar: "https://images.unsplash.com/photo-1539571696357-5a69c17a67c6?w=150&h=150&fit=crop&crop=faces", kisses: 302 }
        ];

        let players = [];
        let isSpinning = false;
        let currentRotation = 0; // bottle angle in degrees
        let bottleCanvas, ctx;

        // --- INITIALIZATION ---
        window.onload = function() {
            // Merge current user with bots (Total 8 players)
            players = [currentUser, ...initialBotPlayers];
            
            initCanvas();
            renderSeats();
            renderLeaderboard();
            initChat();
            updateUserUI();

            // Setup Profile Edit listener

            // Simulated bot chat periodic generator
            setInterval(simulateBotChat, 12000);

        // --- CANVAS BOTTLE DRAWING ---
        function initCanvas() {
            bottleCanvas = document.getElementById('bottleCanvas');
            ctx = bottleCanvas.getContext('2d');
            drawBottle(0);
        }

        function drawBottle(angleDegrees) {
            ctx.clearRect(0, 0, bottleCanvas.width, bottleCanvas.height);
            ctx.save();
            
            // Move origin to center
            ctx.translate(150, 150);
            ctx.rotate((angleDegrees * Math.PI) / 180);

            // Draw Stylized Glass Bottle Body
            // Shadow
            ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
            ctx.shadowBlur = 12;
            ctx.shadowOffsetY = 8;

            // Bottle base (Green gradient)
            let grad = ctx.createLinearGradient(-25, -70, 25, 70);
            grad.addColorStop(0, '#2ecc71');
            grad.addColorStop(0.5, '#117a65');
            grad.addColorStop(1, '#0b5345');

            ctx.fillStyle = grad;
            
            // Bottle Shape Path (Pointing UPWARDS initially)
            ctx.beginPath();
            ctx.moveTo(-15, -70); // Top neck
            ctx.lineTo(15, -70);
            ctx.lineTo(12, -40);  // Neck base
            ctx.lineTo(26, -10);  // Shoulder right
            ctx.lineTo(26, 60);   // Body right
            ctx.arcTo(26, 75, 0, 75, 10); // Bottom right curve
            ctx.arcTo(-26, 75, -26, 60, 10); // Bottom left curve
            ctx.lineTo(-26, -10); // Body left
            ctx.lineTo(-12, -40); // Shoulder left
            ctx.closePath();
            ctx.fill();

            // Glass Highlights / Reflection Lines
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
            ctx.beginPath();
            ctx.moveTo(-20, -10);
            ctx.lineTo(-10, -35);
            ctx.lineTo(-6, -35);
            ctx.lineTo(-14, -10);
            ctx.closePath();
            ctx.fill();

            // Bottle Cap / Cork (Golden)
            ctx.fillStyle = '#f1c40f';
            ctx.fillRect(-12, -78, 24, 9);

            // Red Label around bottle
            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(-26, 0, 52, 25);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 9px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('OK.RU', 0, 16);

            ctx.restore();
        }

        // --- RENDER PLAYERS AROUND CIRCULAR TABLE ---
        function renderSeats() {
            const ring = document.getElementById('players-ring');
            ring.innerHTML = '';
            const total = players.length;

            players.forEach((player, index) => {
                // Calculate angle for positioning around circle (0 at top, clockwise)
                const angle = (index * (360 / total) - 90) * (Math.PI / 180);
                // Radius ratio relative to table
                const radius = 42; // Percentage offset from center
                const left = 50 + radius * Math.cos(angle);
                const top = 50 + radius * Math.sin(angle);

                const isMe = player.id === currentUser.id;
                const genderIcon = player.gender === 'female' ? '<span class="text-pink-400">♀</span>' : '<span class="text-blue-400">♂</span>';

                const seatElem = document.createElement('div');
                seatElem.className = 'absolute transform -translate-x-1/2 -translate-y-1/2 flex flex-col items-center pointer-events-auto transition-transform hover:scale-110';
                seatElem.style.left = `${left}%`;
                seatElem.style.top = `${top}%`;

                seatElem.innerHTML = `
                    <div class="relative cursor-pointer group" onclick="showPlayerInfo(${player.id})">
                        <img src="${player.avatar}" class="w-11 h-11 sm:w-16 sm:h-16 rounded-full object-cover border-2 ${isMe ? 'border-yellow-400 neon-border-gold' : 'border-white/40'} shadow-md">
                        <div class="absolute -bottom-1 -right-1 bg-black/80 px-1.5 py-0.5 rounded-full text-[10px] font-bold border border-white/20">
                            ${genderIcon}
                        </div>
                    </div>
                    <div class="mt-1 bg-black/70 backdrop-blur px-2 py-0.5 rounded-full border border-white/10 text-center max-w-[70px] sm:max-w-[90px]">
                        <p class="text-[10px] font-semibold truncate text-white">${player.name}</p>
                        <p class="text-[9px] text-yellow-400 flex items-center justify-center gap-0.5">
                            <i class="fa-solid fa-heart text-[8px] text-pink-500"></i> ${player.kisses}
                        </p>
                    </div>
                `;

                ring.appendChild(seatElem);
            });
        }

        // --- SPIN LOGIC ---
        function triggerSpin() {
            if (isSpinning) return;
            isSpinning = true;

            const spinBtn = document.getElementById('spin-btn');
            const statusText = document.getElementById('game-status-text');
            spinBtn.disabled = true;
            spinBtn.classList.add('opacity-50', 'cursor-not-allowed');

            statusText.innerText = "Butulka fırlanır...";

            // Random spinner calculation
            // Pick a random player target (excluding player 0 if we want random target)
            const targetIndex = Math.floor(Math.random() * players.length);
            const totalPlayers = players.length;

            // Calculate angle for selected player
            // Player 0 is at -90 deg (top). Angle per seat = 360 / 8 = 45 deg.
            const targetAngleDegrees = targetIndex * (360 / totalPlayers);
            
            // Add 5-8 full spins (1800-2880 deg) + target angle
            const extraRounds = (5 + Math.floor(Math.random() * 4)) * 360;
            const finalAngle = currentRotation + extraRounds + targetAngleDegrees - (currentRotation % 360);

            const duration = 4000; // 4 seconds spin
            const startTime = performance.now();
            const startAngle = currentRotation;

            // Sound simulator (click tick)
            let lastTickAngle = startAngle;

            function animateSpin(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);

                // Cubic Easing out for realistic slowdown
                const easeOut = 1 - Math.pow(1 - progress, 3);
                currentRotation = startAngle + (finalAngle - startAngle) * easeOut;

                drawBottle(currentRotation);

                // Trigger small tick sound simulation every 45deg
                if (Math.abs(currentRotation - lastTickAngle) > 35) {
                    playTickSound();
                    lastTickAngle = currentRotation;
                }

                if (progress < 1) {
                    requestAnimationFrame(animateSpin);
                } else {
                    // Spin Completed!
                    isSpinning = false;
                    spinBtn.disabled = false;
                    spinBtn.classList.remove('opacity-50', 'cursor-not-allowed');

                    onSpinFinished(targetIndex);
                }
            }

            requestAnimationFrame(animateSpin);
        }

        // --- AFTER SPIN ACTIONS ---
        function onSpinFinished(targetIndex) {
            const targetPlayer = players[targetIndex];
            const spinnerPlayer = players[0]; // Current user turned

            document.getElementById('game-status-text').innerText = `Butulka ${targetPlayer.name} üzərində dayandı!`;

            // Open Action Kiss Modal
            showKissModal(spinnerPlayer, targetPlayer);
        }

        function showKissModal(p1, p2) {
            document.getElementById('modal-p1-img').src = p1.avatar;
            document.getElementById('modal-p1-name').innerText = p1.name;

            document.getElementById('modal-p2-img').src = p2.avatar;
            document.getElementById('modal-p2-name').innerText = p2.name;

            document.getElementById('kiss-modal').classList.remove('hidden');
        }

        function handleActionChoice(choice) {
            document.getElementById('kiss-modal').classList.add('hidden');

            if (choice === 'kiss') {
                // Award points
                currentUser.kisses += 10;
                currentUser.coins += 15;
                updateUserUI();

                // Confetti & Hearts effect
                triggerHeartsAnimation();
                confetti({
                    particleCount: 50,
                    spread: 60,
                    origin: { y: 0.6 }
                });

                // Add to chat
                addChatMessage("Sistem", `💋 ${currentUser.name} və ${players[1].name} öpüşdülər! (+10 Xal)`, true);
            } else {
                addChatMessage("Sistem", `❌ Öpüşdən imtina edildi.`, false);
            }

            renderSeats();
            renderLeaderboard();
        }

        // --- LEADERBOARD & CHAT UI ---
        function renderLeaderboard() {
            const list = document.getElementById('leaderboard-list');
            list.innerHTML = '';

            // Sort players by kisses
            const sorted = [...players].sort((a, b) => b.kisses - a.kisses);

            sorted.forEach((p, idx) => {
                const item = document.createElement('div');
                item.className = 'flex items-center justify-between bg-black/40 p-2 rounded-xl border border-white/5';
                
                let rankBadge = `<span class="text-xs font-bold text-gray-400 w-5">#${idx + 1}</span>`;
                if (idx === 0) rankBadge = `<span class="text-yellow-400 font-bold w-5"><i class="fa-solid fa-crown text-xs"></i></span>`;
                if (idx === 1) rankBadge = `<span class="text-gray-300 font-bold w-5">#2</span>`;
                if (idx === 2) rankBadge = `<span class="text-amber-600 font-bold w-5">#3</span>`;

                item.innerHTML = `
                    <div class="flex items-center gap-2">
                        ${rankBadge}
                        <img src="${p.avatar}" class="w-7 h-7 rounded-full object-cover">
                        <span class="text-xs font-medium text-white truncate max-w-[90px]">${p.name}</span>
                    </div>
                    <span class="text-xs font-bold text-pink-400 flex items-center gap-1">
                        <i class="fa-solid fa-heart text-[10px]"></i> ${p.kisses}
                    </span>
                `;
                list.appendChild(item);
            });
        }

        function initChat() {
            addChatMessage("Sistem", "Otağa xoş gəldiniz! Fırladın və həzz alın.", true);
            addChatMessage("Elvin", "Hamıya salam! Kim fırladır?");
            addChatMessage("Leyla", "Salammm 💖");
        }

        function addChatMessage(sender, text, isSystem = false) {
            const chatBox = document.getElementById('chat-messages');
            const msg = document.createElement('div');
            
            if (isSystem) {
                msg.className = "bg-pink-950/40 border border-pink-500/30 p-2 rounded-xl text-center text-pink-300 text-[11px] font-semibold";
                msg.innerText = text;
            } else {
                msg.className = "bg-black/30 p-2 rounded-xl border border-white/5";
                msg.innerHTML = `<span class="font-bold text-yellow-400">${sender}:</span> <span class="text-gray-200">${text}</span>`;
            }

            chatBox.appendChild(msg);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function sendChatMessage(e) {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const val = input.value.trim();
            if (val) {
                addChatMessage(currentUser.name, val);
                input.value = '';
            }
        }

        function sendMobileChatMessage() {
            const input = document.getElementById('mobile-chat-input');
            const val = input.value.trim();
            if (val) {
                addChatMessage(currentUser.name, val);
                input.value = '';
            }
        }

        function simulateBotChat() {
            const botNames = ["Elvin", "Leyla", "Murad", "Nərgiz", "Rauf"];
            const botMessages = [
                "Uşaqlar çox maraqlıdır oyundayıq!",
                "Kimin növbəsidir indi?",
                "Super oyundur ok.ru-dakı kimidir tam 🍾",
                "Mənə bir gül göndərin də :)",
                "Hər kəsə salamlar!"
            ];

            const randomBot = botNames[Math.floor(Math.random() * botNames.length)];
            const randomMsg = botMessages[Math.floor(Math.random() * botMessages.length)];
            addChatMessage(randomBot, randomMsg);
        }

        // --- GIFTS & EFFECTS ---
        function sendGift(emoji, giftName) {
            if (currentUser.coins < 10) {
                alert("Kafi qədər sikkəniz yoxdur!");
                return;
            }
            currentUser.coins -= 10;
            updateUserUI();

            addChatMessage(currentUser.name, `Otağa ${giftName} ${emoji} hədiyyə etdi!`);
            triggerHeartsAnimation();
        }

        function triggerHeartsAnimation() {
            const container = document.body;
            for (let i = 0; i < 8; i++) {
                const heart = document.createElement('div');
                heart.className = 'floating-heart text-2xl text-pink-500 z-50';
                heart.innerHTML = '💖';
                heart.style.left = `${Math.random() * 80 + 10}%`;
                heart.style.top = `${Math.random() * 40 + 40}%`;
                container.appendChild(heart);
                setTimeout(() => heart.remove(), 2000);
            }
        }

        function playTickSound() {
            // Web Audio API tick generator (No external audio needed)
            try {
                const ctxAudio = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctxAudio.createOscillator();
                const gain = ctxAudio.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(120, ctxAudio.currentTime);
                gain.gain.setValueAtTime(0.05, ctxAudio.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctxAudio.currentTime + 0.05);
                osc.connect(gain);
                gain.connect(ctxAudio.destination);
                osc.start();
                osc.stop(ctxAudio.currentTime + 0.05);
            } catch (e) {}
        }

        // --- USER PROFILE MODAL & LOGIC ---
        function updateUserUI() {
            document.getElementById('user-kisses-count').innerText = currentUser.kisses;
            document.getElementById('user-coins-count').innerText = currentUser.coins;
            document.getElementById('header-username').innerText = currentUser.name;
            document.getElementById('header-avatar').src = currentUser.avatar;
        }

        function openProfileModal() {
            document.getElementById('input-username').value = currentUser.name;
            document.getElementById('select-gender').value = currentUser.gender;
            document.getElementById('profile-modal').classList.remove('hidden');
        }

        function closeProfileModal() {
            document.getElementById('profile-modal').classList.add('hidden');
        }

        function saveProfile() {
            const newName = document.getElementById('input-username').value.trim();
            const newGender = document.getElementById('select-gender').value;

            if (newName) currentUser.name = newName;
            currentUser.gender = newGender;

            updateUserUI();
            renderSeats();
            renderLeaderboard();
            closeProfileModal();
        }

        function showPlayerInfo(id) {
            const p = players.find(player => player.id === id);
            if (p) {
                addChatMessage("Sistem", `👤 ${p.name} - Öpüş xalları: ${p.kisses}`);
            }
        }
    </script>
