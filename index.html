<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Butulka Baku - Giriş və Qeydiyyat</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: radial-gradient(circle at center, #1b023a 0%, #050014 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      overflow: hidden;
    }

    /* Arxa fonda parıldayan neon kürələr */
    .glow-bg {
      position: absolute;
      width: 300px;
      height: 300px;
      background: #ff007f;
      border-radius: 50%;
      filter: blur(120px);
      z-index: 1;
      top: 10%;
      left: 20%;
      animation: float 6s ease-in-out infinite alternate;
    }

    .glow-bg-2 {
      position: absolute;
      width: 350px;
      height: 350px;
      background: #00f0ff;
      border-radius: 50%;
      filter: blur(140px);
      z-index: 1;
      bottom: 10%;
      right: 20%;
      animation: float 8s ease-in-out infinite alternate-reverse;
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(30px); }
    }

    /* Glassmorphism Qutusu */
    .card-container {
      position: relative;
      z-index: 2;
      width: 380px;
      padding: 40px 30px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.2), inset 0 0 15px rgba(255, 255, 255, 0.05);
    }

    .logo-title {
      text-align: center;
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 25px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ff007f, #00f0ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(255, 0, 127, 0.5);
    }

    /* Tab Düyümələri */
    .tabs {
      display: flex;
      margin-bottom: 25px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 10px;
      padding: 4px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      text-align: center;
      border: none;
      background: transparent;
      color: #aaa;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .tab-btn.active {
      background: linear-gradient(90deg, #ff007f, #7928ca);
      color: #fff;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.6);
    }

    /* Form Xanaları */
    .form-group {
      display: none;
      flex-direction: column;
      gap: 15px;
    }

    .form-group.active {
      display: flex;
    }

    .input-box {
      width: 100%;
      padding: 14px 16px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: all 0.3s ease;
    }

    .input-box:focus {
      border-color: #00f0ff;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
    }

    .submit-btn {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #00f0ff, #7928ca);
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
    }

    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.8);
    }
  </style>
</head>
<body>

  <div class="glow-bg"></div>
  <div class="glow-bg-2"></div>

  <div class="card-container">
    <div class="logo-title">Butulka Baku</div>

    <div class="tabs">
      <button class="tab-btn active" onclick="showTab('login')">Giriş</button>
      <button class="tab-btn" onclick="showTab('register')">Qeydiyyat</button>
    </div>

    <!-- Giriş Formu -->
    <form id="login" class="form-group active">
      <input type="text" class="input-box" placeholder="İstifadəçi adı və ya Nik" required>
      <input type="password" class="input-box" placeholder="Şifrə" required>
      <button type="submit" class="submit-btn">Oyuna Daxil Ol</button>
    </form>

    <!-- Qeydiyyat Formu -->
    <form id="register" class="form-group">
      <input type="text" class="input-box" placeholder="İstifadəçi adı" required>
      <input type="email" class="input-box" placeholder="E-poçt (istəyə bağlı)">
      <input type="password" class="input-box" placeholder="Şifrə təyin et" required>
      <button type="submit" class="submit-btn">Hesab Yarat</button>
    </form>
  </div>

  <script>
    function showTab(tabName) {
      document.querySelectorAll('.form-group').forEach(form => form.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      
      document.getElementById(tabName).classList.add('active');
      event.target.classList.add('active');
    }
  </script>
</body>
</html>
