<html lang="az">
<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0f0715;
            background: radial-gradient(circle at center, #240b36 0%, #0c0514 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px 15px;
        }

        /* Lang Bar */
        .lang-bar {
            display: flex;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 12px;
            border-radius: 20px;
            margin-bottom: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .lang-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            color: #b3b3b3;
            transition: all 0.3s;
        }

        .lang-btn.active {
            background: linear-gradient(135deg, #a855f7 0%, #ec4899 100%);
            color: white;
            box-shadow: 0 0 12px rgba(236, 72, 153, 0.4);
        }

        /* Logo */
        .logo-box {
            text-align: center;
            margin-bottom: 20px;
        }

        .logo-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.5);
        }

        .logo-icon i {
            font-size: 32px;
            color: white;
        }

        .brand-title {
            font-size: 36px;
            font-weight: 700;
            font-family: 'Georgia', serif;
            font-style: italic;
            background: linear-gradient(to right, #ffffff, #f472b6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        .brand-subtitle {
            font-size: 14px;
            color: #94a3b8;
        }

        /* Card Container */
        .auth-card {
            background: rgba(23, 15, 38, 0.85);
            border-radius: 28px;
            padding: 25px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
        }

        .tab-switcher {
            display: flex;

            border-radius: 16px;
            padding: 4px;
            margin-bottom: 20px;
        }

            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            color: #94a3b8;
            transition: all 0.3s;
