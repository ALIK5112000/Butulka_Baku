<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Butulka Baku</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #0d0614;
      background: linear-gradient(180deg, #160a26 0%, #08030d 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
      color: #fff;
    }

    /* Dil Seçimi */
    .lang-bar {
      display: flex;
      gap: 6px;
      background: rgba(255, 255, 255, 0.05);
      padding: 5px 8px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 20px;
      overflow-x: auto;
      max-width: 100%;
    }

    .lang-btn {
      display: flex;
      align-items: center;
      gap: 5px;
      background: transparent;
      border: none;
      color: #a89bc2;
      padding: 6px 10px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
      white-space: nowrap;
    }

    .lang-btn.active {
      background: linear-gradient(90deg, #f7387d, #8f27ec);
      color: #fff;
      box-shadow: 0 0 10px rgba(247, 56, 125, 0.5);
    }

    /* Xüsusi Yeni Loqo Alanı */
    .logo-container {
      width: 75px;
      height: 75px;
      background: linear-gradient(135deg, #ff2a8d, #8a2be2);
      border-radius: 22px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 15px;
      box-shadow: 0 8px 25px rgba(255, 42, 141, 0.4);
      position: relative;
    }

    .logo-icon {
      font-size: 40px;
      transform: rotate(-15deg);
      filter: drop-shadow(0 2px 5px rgba(0,0,0,0.3));
    }

    .brand-title {
      font-size: 34px;
      font-weight: 800;
      font-style: italic;
      color: #fff;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      text-align: center;
      text-shadow: 0 2px 10px rgba(255, 42, 141, 0.3);
    }

    .subtitle {
      font-size: 13px;
      color: #9d8ec4;
      margin-bottom: 22px;
      text-align: center;
    }

    /* Əsas Kart */
    .card {
      width: 100%;
      max-width: 380px;
      background: rgba(30, 18, 50, 0.75);
      border-radius: 26px;
      padding: 24px 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(12px);
    }

    /* Tablar */
    .tabs {
      display: flex;
      background: rgba(14, 7, 25, 0.7);
      padding: 4px;
      border-radius: 16px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 13px;
      border: none;
      background: transparent;
      color: #8f82a9;
      font-size: 15px;
      font-weight: 700;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .tab-btn.active {
      background: linear-gradient(90deg, #f7387d, #e03268);
      color: #fff;
      box-shadow: 0 4px 15px rgba(247, 56, 125, 0.4);
    }

    /* Xəbərdarlıq Qutusu */
    .alert-box {
      background: rgba(255, 179, 0, 0.08);
      border: 1px solid rgba(255, 179, 0, 0.25);
      border-radius: 14px;
      padding: 12px;
      font-size: 12px;
      color: #ffd54f;
      line-height: 1.4;
      margin-bottom: 18px;
    }

    /* Form */
    .form-group {
      display: none;
      flex-direction: column;
      gap: 14px;
    }

    .form-group.active {
      display: flex;
    }

    .field-label {
      font-size: 12px;
      font-weight: 600;
      color: #b1a4cb;
      margin-bottom: -6px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-box {
      width: 100%;
      background: rgba(13, 6, 23, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 14px 14px 14px 42px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border 0.3s;
    }

    .input-box:focus {
      border-color: #f7387d;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0.5;
    }

    /* Cinsiyyət */
    .gender-title {
      font-size: 12px;
      font-weight: 600;
      color: #b1a4cb;
    }

    .gender-group {
      display: flex;
      gap: 12px;
    }

    .gender-card {
      flex: 1;
      background: rgba(13, 6, 23, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 13px;
    }

    .gender-card.active {
      border-color: #f7387d;
      background: rgba(247, 56, 125, 0.1);
      box-shadow: 0 0 10px rgba(247, 56, 125, 0.3);
    }

    .submit-btn {
      width: 100%;
      background: linear-gradient(90deg, #f7387d, #e03268);
      border: none;
      border-radius: 14px;
      padding: 15px;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
      box-shadow: 0 5px 20px rgba(247, 56, 125, 0.4);
    }

    .forgot-link {
      text-align: right;
      font-size: 12px;
      color: #ffab40;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <!-- Yuxarı Dil Paneli -->
  <div class="lang-bar">
    <button class="lang-btn active" onclick="setLang('az')">🇦🇿 Azərbaycanca</button>
    <button class="lang-btn" onclick="setLang('ru')">🇷🇺 Русский</button>
    <button class="lang-btn" onclick="setLang('en')">🇬🇧 English</button>
    <button class="lang-btn" onclick="setLang('ge')">🇬🇪 ქართული</button>
  </div>

  <!-- Saytın Loqosu -->
  <div class="logo-container">
    <span class="logo-icon">🍾</span>
  </div>

  <div class="brand-title">Butulka Baku</div>
  <div class="subtitle" id="t-subtitle">Hesabına daxil ol və oyuna davam et</div>

  <div class="card">
    <div class="tabs">
      <button class="tab-btn active" id="t-tab-login" onclick="showTab('login')">Giriş</button>
      <button class="tab-btn" id="t-tab-reg" onclick="showTab('register')">Qeydiyyat</button>
    </div>

    <!-- GİRİŞ FORMU -->
    <form id="login-form" class="form-group active">
      <span class="field-label" id="t-lbl-user">İstifadəçi adı</span>
      <div class="input-wrapper">
        <span class="input-icon">👤</span>
        <input type="text" class="input-box" id="p-user" placeholder="İstifadəçi adı və ya ID" required>
      </div>

      <span class="field-label" id="t-lbl-pass">Şifrə</span>
      <div class="input-wrapper">
        <span class="input-icon">🔒</span>
        <input type="password" class="input-box" id="p-pass" placeholder="Şifrənizi yazın" required>
      </div>

      <a href="#" class="forgot-link" id="t-forgot" onclick="alert('Şifrəni unutmusansa Adminlə əlaqə saxla!')">Şifrəni unutmusan?</a>

      <button type="submit" class="submit-btn" id="t-btn-login">Daxil ol</button>
    </form>

    <!-- QEYDİYYAT FORMU -->
    <form id="register-form" class="form-group">
      <div class="alert-box" id="t-alert">
        ⚠️ <strong>Diqqət!</strong> 1 cihazdan ən çox 2 nik açmaq olar. 3-cü nik qadağandır və ban olunur.
      </div>

      <span class="field-label" id="t-lbl-reguser">İstifadəçi adı</span>
      <div class="input-wrapper">
        <span class="input-icon">👤</span>
        <input type="text" class="input-box" id="p-reguser" placeholder="İstifadəçi adı seç" required>
      </div>

      <span class="field-label" id="t-lbl-regpass">Şifrə</span>
      <div class="input-wrapper">
        <span class="input-icon">🔒</span>
        <input type="password" class="input-box" id="p-regpass" placeholder="Ən azı 6 simvol" required>
      </div>

      <span class="gender-title" id="t-lbl-gender">Cinsiyyət</span>
      <div class="gender-group">
        <div class="gender-card active" onclick="selectGender(this)">
          <span style="font-size: 20px;">♂️</span>
          <span id="t-male">Kişi</span>
        </div>
        <div class="gender-card" onclick="selectGender(this)">
          <span style="font-size: 20px;">♀️</span>
          <span id="t-female">Qadın</span>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="t-btn-reg">Hesab yarat</button>
    </form>
  </div>

  <script>
    const dict = {
      az: {
        subtitle: "Hesabına daxil ol və oyuna davam et",
        tabLogin: "Giriş",
        tabReg: "Qeydiyyat",
        lblUser: "İstifadəçi adı",
        lblPass: "Şifrə",
        pUser: "İstifadəçi adı və ya ID",
        pPass: "Şifrənizi yazın",
        forgot: "Şifrəni unutmusan?",
        btnLogin: "Daxil ol",
        alert: "⚠️ <strong>Diqqət!</strong> 1 cihazdan ən çox 2 nik açmaq olar. 3-cü nik qadağandır və ban olunur.",
        pRegPass: "Ən azı 6 simvol",
        lblGender: "Cinsiyyət",
        male: "Kişi",
        female: "Qadın",
        btnReg: "Hesab yarat"
      },
      ru: {
        subtitle: "Войдите в аккаунт и продолжайте игру",
        tabLogin: "Вход",
        tabReg: "Регистрация",
        lblUser: "Имя пользователя",
        lblPass: "Пароль",
        pUser: "Имя пользователя или ID",
        pPass: "Введите пароль",
        forgot: "Забыли пароль?",
        btnLogin: "Войти",
        alert: "⚠️ <strong>Внимание!</strong> С 1 устройства можно создать максимум 2 ника. 3-й ник заблокирован.",
        pRegPass: "Не менее 6 символов",
        lblGender: "Пол",
        male: "Мужской",
        female: "Женский",
        btnReg: "Создать аккаунт"
      },
      en: {
        subtitle: "Log in to your account and continue playing",
        tabLogin: "Login",
        tabReg: "Register",
        lblUser: "Username",
        lblPass: "Password",
        pUser: "Username or ID",
        pPass: "Enter password",
        forgot: "Forgot password?",
        btnLogin: "Log In",
        alert: "⚠️ <strong>Warning!</strong> Maximum 2 nicknames allowed per device. 3rd nick will be banned.",
        pRegPass: "At least 6 characters",
        lblGender: "Gender",
        male: "Male",
        female: "Female",
        btnReg: "Create Account"
      },
      ge: {
        subtitle: "შესულით ანგარიშზე და გააგრძელეთ თამაში",
        tabLogin: "შესვლა",
        tabReg: "რეგისტრაცია",
        lblUser: "მომხმარებელი",
        lblPass: "პაროლი",
        pUser: "მომხმარებელი ან ID",
        pPass: "შეიყვანეთ პაროლი",
        forgot: "დაგავიწყდათ პაროლი?",
        btnLogin: "შესვლა",
        alert: "⚠️ <strong>ყურადღება!</strong> 1 მოწყობილობიდან მაქსიმუმ 2 ნიკი. მე-3 ბლოკირებულია.",
        pRegPass: "მინიმუმ 6 სიმბოლო",
        lblGender: "სქესი",
        male: "კაცი",
        female: "ქალი",
        btnReg: "ანგარიშის შექმნა"
      }
    };

    function setLang(lang) {
      document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      const data = dict[lang];
      document.getElementById('t-subtitle').innerText = data.subtitle;
      document.getElementById('t-tab-login').innerText = data.tabLogin;
      document.getElementById('t-tab-reg').innerText = data.tabReg;
      document.getElementById('t-lbl-user').innerText = data.lblUser;
      document.getElementById('t-lbl-pass').innerText = data.lblPass;
      document.getElementById('p-user').placeholder = data.pUser;
      document.getElementById('p-pass').placeholder = data.pPass;
      document.getElementById('t-forgot').innerText = data.forgot;
      document.getElementById('t-btn-login').innerText = data.btnLogin;
      document.getElementById('t-alert').innerHTML = data.alert;
      document.getElementById('t-lbl-reguser').innerText = data.lblUser;
      document.getElementById('p-reguser').placeholder = data.pUser;
      document.getElementById('t-lbl-regpass').innerText = data.lblPass;
      document.getElementById('p-regpass').placeholder = data.pRegPass;
      document.getElementById('t-lbl-gender').innerText = data.lblGender;
      document.getElementById('t-male').innerText = data.male;
      document.getElementById('t-female').innerText = data.female;
      document.getElementById('t-btn-reg').innerText = data.btnReg;
    }

    function showTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.form-group').forEach(f => f.classList.remove('active'));
      
      if (tab === 'login') {
        document.getElementById('t-tab-login').classList.add('active');
        document.getElementById('login-form').classList.add('active');
      } else {
        document.getElementById('t-tab-reg').classList.add('active');
        document.getElementById('register-form').classList.add('active');
      }
    }

    function selectGender(element) {
      document.querySelectorAll('.gender-card').forEach(c => c.classList.remove('active'));
      element.classList.add('active');
    }
  </script>
</body>
</html>
