<!DOCTYPE html>
<html lang="az">
<head>
    <script src="js/core/qoruma.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0b12">
    <link rel="icon" type="image/jpeg" href="icons/icon-192.jpg">
    <link rel="apple-touch-icon" href="icons/icon-192.jpg">
    <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script>
    <title>Butulka Baku - Giriş</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Roboto', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        :root { --g1:#f6e3a1; --g2:#d9ae5c; --g3:#a67a35; --g4:#6e4f20; --panel:#0f0f1a; }
        body {
            /* qara mərmər fon */
            background:
                linear-gradient(118deg, transparent 38%, rgba(255,255,255,.045) 39%, transparent 41%),
                linear-gradient(62deg, transparent 55%, rgba(255,255,255,.035) 56%, transparent 58%),
                radial-gradient(ellipse at 15% 20%, rgba(70,70,85,.35), transparent 50%),
                radial-gradient(ellipse at 85% 70%, rgba(60,60,75,.3), transparent 55%),
                #08080d;
            background-attachment: fixed;
            color: #fff; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            overflow-x: hidden;
        }
        .lang-bar {
            display: flex; gap: 14px; width: 100%;
            padding: 16px 16px; margin-bottom: 105px;
            background: #12121a; border-bottom: 1px solid rgba(255,255,255,.06);
            overflow-x: auto; justify-content: flex-start;
            scrollbar-width: none;
        }
        .lang-bar::-webkit-scrollbar { display: none; }
        .lang-btn {
            background: #101018; border: 1.5px solid rgba(255,255,255,.08);
            color: var(--g1); padding: 11px 22px; border-radius: 26px; cursor: pointer;
            font-size: 17px; font-weight: 600; transition: .3s; white-space: nowrap;
        }
        .lang-btn.active {
            border: 2px solid var(--g2);
            background: linear-gradient(180deg, rgba(217,174,92,.28), rgba(110,79,32,.28));
            box-shadow: 0 0 14px rgba(246,227,161,.4), inset 0 0 0 2px rgba(0,0,0,.35);
        }
        .container {
            position: relative; width: calc(100% - 32px); max-width: 440px;
            background: var(--panel);
            border: 2px solid var(--g3);
            border-radius: 42px; padding: 82px 24px 30px; margin-bottom: 40px;
            box-shadow: 0 0 22px rgba(217,174,92,.2), 0 18px 40px rgba(0,0,0,.7);
        }
        .logo-icon {
            position: absolute; top: -96px; left: 50%; transform: translateX(-50%);
            width: 128px; filter: drop-shadow(0 4px 10px rgba(0,0,0,.7)) drop-shadow(0 0 8px rgba(246,227,161,.35));
        }
        .logo-box { text-align: center; margin-bottom: 22px; }
        .logo-title {
            font-size: 48px; font-weight: 800; font-style: italic; letter-spacing: .5px; line-height: 1.1;
            background: linear-gradient(180deg, #f6dd98 0%, #d1a24b 55%, #9b6f2a 100%);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            filter: drop-shadow(0 3px 3px rgba(0,0,0,.6));
        }
        .subtitle { font-size: 19px; color: #eee; margin-top: 12px; }
        .tabs { display: flex; gap: 14px; padding: 0 8px; margin-bottom: 18px; }
        .tab {
            flex: 1; text-align: center; padding: 17px 8px; cursor: pointer;
            border-radius: 22px; font-weight: 700; font-size: 21px; color: var(--g2);
            background: var(--panel); border: 2.5px solid var(--g3); transition: .3s;
        }
        .tab.active {
            color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.5);
            background: linear-gradient(180deg, #f0d68c 0%, #cfa354 45%, #b58a3e 100%);
            border: 2.5px solid var(--g1);
            box-shadow: 0 0 0 4px var(--g4), 0 0 18px rgba(246,227,161,.45), inset 0 2px 6px rgba(255,255,255,.35);
            margin: 4px; padding: 13px 8px;
        }
        .form-section { padding: 0 8px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 10px; font-size: 19px; color: #f1e4c4; font-weight: 400; }
        .form-group input {
            width: 100%; height: 66px; padding: 0 22px; background: #0c0c15;
            border: 2px solid #4a3a27; border-radius: 24px;
            color: #fff; font-size: 18px; outline: none; transition: .3s;
        }
        .form-group input::placeholder { color: transparent; }
        .form-group input:focus { border-color: var(--g2); box-shadow: 0 0 14px rgba(217,174,92,.35); }

        /* Cins Seçimi Düymələri */
        .gender-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .gender-btn {
            padding: 16px 12px; border-radius: 22px; background: #0c0c15;
            border: 2px solid #4a3a27; color: #e6d7b0; font-size: 17px; font-weight: 700;
            cursor: pointer; transition: .25s; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .gender-btn.active-boy { border-color: #38bdf8; background: rgba(56,189,248,.18); color: #7dd3fc; box-shadow: 0 0 14px rgba(56,189,248,.35); }
        .gender-btn.active-girl { border-color: #f472b6; background: rgba(244,114,182,.18); color: #f9a8d4; box-shadow: 0 0 14px rgba(244,114,182,.35); }

        .btn {
            width: 100%; height: 72px; margin-top: 18px;
            background: linear-gradient(180deg, #f1dc9c 0%, #d3a959 45%, #a97d36 100%);
            border: 2px solid #f3dc9a; border-radius: 26px; color: #fff; font-size: 26px; font-weight: 700;
            text-shadow: 0 1px 3px rgba(0,0,0,.45);
            cursor: pointer; box-shadow: 0 0 22px rgba(217,174,92,.35), inset 0 2px 6px rgba(255,255,255,.35); transition: .3s;
        }
        .btn:active { transform: scale(.985); }
        .btn:disabled { opacity: .6; cursor: not-allowed; }
        .form-section { display: none; }
        .form-section.active { display: block; }
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,.88); backdrop-filter: blur(8px);
            justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: var(--panel); padding: 35px 30px; border-radius: 30px; text-align: center;
            max-width: 340px; width: 90%; border: 2px solid var(--g3);
        }
        .modal-content .btn { height: 60px; font-size: 20px; }
    </style>
</head>
<body>

    <div class="lang-bar">
        <button class="lang-btn active" onclick="setLanguage('az', this)">🇦🇿 Azerbaycanca</button>
        <button class="lang-btn" onclick="setLanguage('ru', this)">🇷🇺 Русский</button>
        <button class="lang-btn" onclick="setLanguage('en', this)">🇬🇧 English</button>
        <button class="lang-btn" onclick="setLanguage('ka', this)">🇬🇪 ქართული</button>
    </div>

    <div class="container">
        <svg class="logo-icon" viewBox="0 0 100 112" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="gd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8e3a0"/><stop offset=".6" stop-color="#d4a443"/><stop offset="1" stop-color="#8e6420"/></linearGradient>
                <radialGradient id="rb" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="#ff5468"/><stop offset=".6" stop-color="#c8132d"/><stop offset="1" stop-color="#7b0a1c"/></radialGradient>
            </defs>
            <path d="M24 30 L26 6 L39 20 L50 2 L61 20 L74 6 L76 30 Z" fill="url(#gd)" stroke="#f8e3a0" stroke-width="1.5"/>
            <circle cx="26" cy="6" r="2.5" fill="#f8e3a0"/><circle cx="50" cy="2.5" r="2.5" fill="#f8e3a0"/><circle cx="74" cy="6" r="2.5" fill="#f8e3a0"/>
            <rect x="23" y="30" width="54" height="7" rx="3.5" fill="url(#gd)"/>
            <g fill="#fff" opacity=".9"><circle cx="31" cy="33.5" r="1.3"/><circle cx="40" cy="33.5" r="1.3"/><circle cx="50" cy="33.5" r="1.3"/><circle cx="60" cy="33.5" r="1.3"/><circle cx="69" cy="33.5" r="1.3"/></g>
            <path d="M50 108 C6 76 4 48 25 46 C37 45 46 52 50 60 C54 52 63 45 75 46 C96 48 94 76 50 108Z" fill="url(#gd)"/>
            <path d="M50 99 C14 72 13 52 28 51 C38 50 46 56 50 63 C54 56 62 50 72 51 C87 52 86 72 50 99Z" fill="#6d0f20"/>
            <path d="M50 91 C22 70 21 55 32 54 C40 53 47 58 50 65 C53 58 60 53 68 54 C79 55 78 70 50 91Z" fill="url(#gd)"/>
            <path d="M50 86 C27 68 26 58 34 57.5 C41 57 47 61 50 67 C53 61 59 57 66 57.5 C74 58 73 68 50 86Z" fill="url(#rb)"/>
        </svg>
        <div class="logo-box">
            <div class="logo-title">Butulka Baku</div>
            <div id="subtitleText" class="subtitle">Hesabına daxil ol və oyuna davam et</div>
        </div>

        <div class="tabs">
            <div id="tabLogin" class="tab active" onclick="switchTab('login')">Giriş</div>
            <div id="tabRegister" class="tab" onclick="switchTab('register')">Qeydiyyat</div>
        </div>

        <div id="loginForm" class="form-section active">
            <div class="form-group">
                <label id="lblUserInput">İstifadəçi adı və ya ID</label>
                <input type="text" id="loginUser" placeholder="İstifadəçi adı və ya ID">
            </div>
            <div class="form-group">
                <label id="lblPassword">Şifrə</label>
                <input type="password" id="loginPass" placeholder="••••••••">
            </div>
            <button id="btnLogin" class="btn" onclick="loginUser()">Daxil ol</button>
        </div>

        <div id="registerForm" class="form-section">
            <div class="form-group">
                <label id="lblRegUser">İstifadəçi adı</label>
                <input type="text" id="regUser" placeholder="İstifadəçi adı seç">
            </div>
            <div class="form-group">
                <label id="lblRegPass">Şifrə (ən azı 6 simvol)</label>
                <input type="password" id="regPass" placeholder="••••••••">
            </div>
            <div class="form-group">
                <label id="lblRegGender">Cinsini seç</label>
                <div class="gender-grid">
                    <button type="button" id="btnGenderBoy" class="gender-btn active-boy" onclick="selectRegGender('Kişi')">
                        <span>♂️</span> <span id="txtBoy">Oğlan</span>
                    </button>
                    <button type="button" id="btnGenderGirl" class="gender-btn" onclick="selectRegGender('Qadın')">
                        <span>♀️</span> <span id="txtGirl">Qız</span>
                    </button>
                </div>
            </div>
            <button id="btnRegister" class="btn" onclick="registerUser()">Hesab yarat</button>
        </div>
    </div>

    <div id="successModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle" style="color:#f6e3a1; margin-bottom:15px; font-size: 22px;">Uğurlu Qeydiyyat!</h3>
            <p id="modalDesc" style="color:#ddd; margin-bottom:10px;">Sizin unikal ID nömrəniz:</p>
            <h2 id="newIdText" style="color:#fff; margin-bottom:25px; font-size: 36px; text-shadow: 0 0 10px #d9ae5c;">00000</h2>
            <button id="modalBtn" class="btn" onclick="goToProfile()">Davam et</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAANVVrJKhZyaCErn8YFNVTUPF70A9xlmQ",
          authDomain: "butulka-baku-istifadeci-bazasi.firebaseapp.com",
          projectId: "butulka-baku-istifadeci-bazasi",
          storageBucket: "butulka-baku-istifadeci-bazasi.firebasestorage.app",
          messagingSenderId: "52438073026",
          appId: "1:52438073026:web:1c4a0a8d1fc1ce5f78455b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        if (localStorage.getItem("currentUser")) {
            window.location.href = "profil.html";
        }

        let selectedRegGender = "Kişi";

        window.selectRegGender = function(gender) {
            selectedRegGender = gender;
            const boyBtn = document.getElementById("btnGenderBoy");
            const girlBtn = document.getElementById("btnGenderGirl");
            boyBtn.classList.toggle("active-boy", gender === "Kişi");
            girlBtn.classList.toggle("active-girl", gender === "Qadın");
        };

        const translations = {
            az: { subtitle: "Hesabına daxil ol və oyuna davam et", loginTab: "Giriş", regTab: "Qeydiyyat", lblUser: "İstifadəçi adı və ya ID", lblPass: "Şifrə", btnLogin: "Daxil ol", lblRegUser: "İstifadəçi adı", lblRegPass: "Şifrə (ən azı 6 simvol)", lblRegGender: "Cinsini seç", boy: "Oğlan", girl: "Qız", btnReg: "Hesab yarat", modalTitle: "Uğurlu Qeydiyyat!", modalDesc: "Sizin unikal ID nömrəniz:", modalBtn: "Davam et" },
            ru: { subtitle: "Войдите в аккаунт и продолжайте игру", loginTab: "Вход", regTab: "Регистрация", lblUser: "Имя пользователя или ID", lblPass: "Пароль", btnLogin: "Войти", lblRegUser: "Имя пользователя", lblRegPass: "Пароль (мин. 6 символов)", lblRegGender: "Выберите пол", boy: "Парень", girl: "Девушка", btnReg: "Создать аккаунт", modalTitle: "Успешная регистрация!", modalDesc: "Ваш уникальный ID номер:", modalBtn: "Продолжить" },
            en: { subtitle: "Login to your account and continue playing", loginTab: "Login", regTab: "Register", lblUser: "Username or ID", lblPass: "Password", btnLogin: "Sign In", lblRegUser: "Username", lblRegPass: "Password (min 6 chars)", lblRegGender: "Select gender", boy: "Boy", girl: "Girl", btnReg: "Create Account", modalTitle: "Successful Registration!", modalDesc: "Your unique ID number:", modalBtn: "Continue" },
            ka: { subtitle: "შედით ანგარიშზე და გააგრძელეთ თამაში", loginTab: "შესვლა", regTab: "რეგისტრაცია", lblUser: "მომხმარებელი ან ID", lblPass: "პაროლი", btnLogin: "შესვლა", lblRegUser: "მომხმარებლის სახელი", lblRegPass: "პაროლი (მინ. 6 სიმბოლო)", lblRegGender: "აირჩიეთ სქესი", boy: "ბიჭი", girl: "გოგო", btnReg: "ანგარიშის შექმნა", modalTitle: "წარმატებული რეგისტრაცია!", modalDesc: "თქვენი უნიკალური ID ნომერი:", modalBtn: "გაგრძელება" }
        };

        window.setLanguage = function(lang, btn) {
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const t = translations[lang];
            document.getElementById('subtitleText').innerText = t.subtitle;
            document.getElementById('tabLogin').innerText = t.loginTab;
            document.getElementById('tabRegister').innerText = t.regTab;
            document.getElementById('lblUserInput').innerText = t.lblUser;
            document.getElementById('lblPassword').innerText = t.lblPass;
            document.getElementById('btnLogin').innerText = t.btnLogin;
            document.getElementById('lblRegUser').innerText = t.lblRegUser;
            document.getElementById('lblRegPass').innerText = t.lblRegPass;
            document.getElementById('lblRegGender').innerText = t.lblRegGender;
            document.getElementById('txtBoy').innerText = t.boy;
            document.getElementById('txtGirl').innerText = t.girl;
            document.getElementById('btnRegister').innerText = t.btnReg;
            document.getElementById('modalTitle').innerText = t.modalTitle;
            document.getElementById('modalDesc').innerText = t.modalDesc;
            document.getElementById('modalBtn').innerText = t.modalBtn;
        };

        window.switchTab = function(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form-section').forEach(f => f.classList.remove('active'));
            if(tab === 'login') {
                document.getElementById('tabLogin').classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.getElementById('tabRegister').classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
        };

        window.registerUser = async function() {
            const username = document.getElementById('regUser').value.trim();
            const password = document.getElementById('regPass').value;
            const btn = document.getElementById('btnRegister');

            if(!username || password.length < 6) {
                alert("Zəhmət olmasa adı daxil edin və şifrə ən az 6 simvol olsun!");
                return;
            }

            btn.disabled = true;
            try {
                const nameCheck = await getDocs(query(collection(db, "users"), where("username", "==", username)));
                if (!nameCheck.empty) {
                    alert("Bu istifadəçi adı artıq mövcuddur!");
                    btn.disabled = false;
                    return;
                }

                const uniqueId = Math.floor(10000 + Math.random() * 90000);
                const newUserObj = {
                    username: username,
                    password: password,
                    id: uniqueId,
                    jetons: 0,
                    hearts: 0,
                    views: 0,
                    viewers: [],
                    friends: [],
                    friendRequests: [],
                    status: "",
                    avatar: "",
                    country: "",
                    city: "",
                    age: 18,
                    gender: selectedRegGender,
                    vip: false,
                    vipUntil: 0,
                    sessionVersion: 1,
                    createdAt: Date.now()
                };

                const docRef = await addDoc(collection(db, "users"), newUserObj);
                localStorage.setItem("currentUser", JSON.stringify({
                    docId: docRef.id,
                    id: uniqueId,
                    username: username,
                    gender: selectedRegGender,
                    sessionVersion: 1
                }));

                document.getElementById('newIdText').innerText = uniqueId;
                document.getElementById('successModal').style.display = 'flex';
            } catch(e) {
                alert("Xəta baş verdi: " + e.message);
                btn.disabled = false;
            }
        };

        window.loginUser = async function() {
            const userInput = document.getElementById('loginUser').value.trim();
            const passwordInput = document.getElementById('loginPass').value;
            const btn = document.getElementById('btnLogin');

            if(!userInput || !passwordInput) {
                alert("Xanaları doldurun!");
                return;
            }

            btn.disabled = true;
            try {
                const qLower = userInput.toLowerCase();
                const allSnap = await getDocs(collection(db, "users"));
                let matchedDoc = null;

                allSnap.forEach((docSnap) => {
                    if (matchedDoc) return;
                    const data = docSnap.data();
                    const uname = String(data.username || "").trim().toLowerCase();
                    const uid = String(data.id ?? "").trim().toLowerCase();
                    const ucustom = String(data.customId ?? "").trim().toLowerCase();

                    const matchesIdentifier =
                        uname === qLower ||
                        uid === qLower ||
                        (ucustom && ucustom === qLower);

                    if (matchesIdentifier && data.password === passwordInput) {
                        matchedDoc = { docId: docSnap.id, data };
                    }
                });

                if (matchedDoc) {
                    const { docId, data } = matchedDoc;
                    if (data.banned) {
                        alert("Hesabınız bloklanıb!");
                        btn.disabled = false;
                        return;
                    }
                    localStorage.setItem("currentUser", JSON.stringify({
                        docId: docId,
                        id: data.id,
                        username: data.username,
                        sessionVersion: data.sessionVersion || 1
                    }));
                    window.location.href = "profil.html";
                } else {
                    alert("İstifadəçi adı/ID və ya şifrə yanlışdır!");
                    btn.disabled = false;
                }
            } catch(e) {
                alert("Giriş xətası: " + e.message);
                btn.disabled = false;
            }
        };

        window.goToProfile = function() {
            window.location.href = "profil.html";
        };
    </script>
</body>
</html>
