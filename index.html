        const map = { subtitleText:"subtitle", tabLogin:"loginTab", tabRegister:"regTab", lblUserInput:"lblUser", lblPassword:"lblPass", btnLogin:"btnLogin", lblRegUser:"lblRegUser", lblRegEmail:"lblRegEmail", lblRegPass:"lblRegPass", lblRegGender:"lblRegGender", txtBoy:"boy", txtGirl:"girl", btnSendRegCode:"sendCode", btnSendFgCode:"sendCode", lblRegCode:"lblCode", lblFgCode:"lblCode", btnRegister:"btnReg", txtGoogle1:"google1", txtGoogle2:"google2", lnkForgot:"forgot", lblFgEmail:"lblFgEmail", lblFgNew:"lblFgNew", btnReset:"btnReset", lnkBack:"back", modalTitle:"modalTitle", modalDesc:"modalDesc", modalBtn:"modalBtn", navHome:"home", navMsg:"msg" };

        window.setLanguage = function(lang, btn) {
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const t = translations[lang];
            for (const id in map) document.getElementById(id).innerText = t[map[id]];
        };

        function show(id) {
            document.querySelectorAll('.form-section').forEach(f => f.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        window.switchTab = function(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('mainTabs').classList.remove('hidden');
            if (tab === 'login') {
                document.getElementById('tabLogin').classList.add('active');
                show('loginForm');
            } else {
                document.getElementById('tabRegister').classList.add('active');
                show('registerForm');
            }
        };

        window.showForgot = function() {
            document.getElementById('mainTabs').classList.add('hidden');
            show('forgotForm');
        };
        window.hideForgot = function() { switchTab('login'); };

        // ====== Kod göndərmə (EmailJS) ======
        const isEmail = (e) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);

        async function sendCodeTo(email, kind) {
            if (Date.now() - lastSend < 60000) {
                alert("Zəhmət olmasa 1 dəqiqə gözləyin və yenidən cəhd edin.");
                return false;
            }
            const code = String(Math.floor(100000 + Math.random() * 900000));
            await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID,
                { to_email: email, email: email, code: code, app_name: "Butulka Baku" },
                { publicKey: EMAILJS_PUBLIC_KEY });
            pending[kind] = { email, code, exp: Date.now() + 10 * 60 * 1000 };
            lastSend = Date.now();
            return true;
        }

        function checkCode(kind, email, entered) {
            const p = pending[kind];
            if (!p || p.email !== email) { alert("Əvvəlcə kod göndərin."); return false; }
            if (Date.now() > p.exp) { alert("Kodun vaxtı bitib. Yenidən göndərin."); return false; }
            if (p.code !== String(entered).trim()) { alert("Kod yanlışdır!"); return false; }
            return true;
        }

        async function findByEmail(email) {
            const s = await getDocs(query(collection(db, "users"), where("email", "==", email)));
            return s.empty ? null : s.docs[0];
        }

        window.sendRegCode = async function() {
            const username = document.getElementById('regUser').value.trim();
            const email = document.getElementById('regEmail').value.trim().toLowerCase();
            const password = document.getElementById('regPass').value;
            const btn = document.getElementById('btnSendRegCode');

            if (!username || password.length < 6) { alert("Zəhmət olmasa adı daxil edin və şifrə ən az 6 simvol olsun!"); return; }
            if (!isEmail(email)) { alert("Düzgün e-poçt daxil edin!"); return; }

            btn.disabled = true;
            try {
                const nameCheck = await getDocs(query(collection(db, "users"), where("username", "==", username)));
                if (!nameCheck.empty) { alert("Bu istifadəçi adı artıq mövcuddur!"); return; }
                if (await findByEmail(email)) { alert("Bu e-poçt artıq qeydiyyatdan keçib!"); return; }
                if (await sendCodeTo(email, "reg")) {
                    document.getElementById('regCodeBox').classList.remove('hidden');
                    alert("Kod e-poçtunuza göndərildi. Spam qovluğuna da baxın.");
                }
            } catch (e) {
                alert("Kod göndərilmədi: " + (e.text || e.message || e));
            } finally { btn.disabled = false; }
        };

        window.registerUser = async function() {
            const username = document.getElementById('regUser').value.trim();
            const email = document.getElementById('regEmail').value.trim().toLowerCase();
            const password = document.getElementById('regPass').value;
            const btn = document.getElementById('btnRegister');

            if (!username || password.length < 6) { alert("Zəhmət olmasa adı daxil edin və şifrə ən az 6 simvol olsun!"); return; }
            if (!checkCode("reg", email, document.getElementById('regCode').value)) return;

            btn.disabled = true;
            try {
                const nameCheck = await getDocs(query(collection(db, "users"), where("username", "==", username)));
                if (!nameCheck.empty) { alert("Bu istifadəçi adı artıq mövcuddur!"); btn.disabled = false; return; }
                await createAccount(username, email, password, selectedRegGender, true);
            } catch (e) {
                alert("Xəta baş verdi: " + e.message);
                btn.disabled = false;
            }
        };

        async function createAccount(username, email, password, gender, showModal) {
            const uniqueId = Math.floor(10000 + Math.random() * 90000);
            const newUserObj = {
                username, email, emailVerified: true, password, id: uniqueId,
                jetons: 0, hearts: 0, views: 0, viewers: [], friends: [], friendRequests: [],
                status: "", avatar: "", country: "", city: "", age: 18, gender,
                vip: false, vipUntil: 0, sessionVersion: 1, createdAt: Date.now()
            };
            const docRef = await addDoc(collection(db, "users"), newUserObj);
            localStorage.setItem("currentUser", JSON.stringify({
                docId: docRef.id, id: uniqueId, username, gender, sessionVersion: 1
            }));
            if (showModal) {
                document.getElementById('newIdText').innerText = uniqueId;
                document.getElementById('successModal').style.display = 'flex';
            } else {
                window.location.href = "profil.html";
            }
        }

        // ====== Google ilə giriş / qeydiyyat ======
        window.googleAuth = async function() {
            try {
                const res = await signInWithPopup(auth, new GoogleAuthProvider());
                const email = (res.user.email || "").toLowerCase();
                if (!email) { alert("Google hesabından e-poçt alınmadı."); return; }

                const existing = await findByEmail(email);
                if (existing) {
                    const data = existing.data();
                    if (data.banned) { alert("Hesabınız bloklanıb!"); return; }
                    localStorage.setItem("currentUser", JSON.stringify({
                        docId: existing.id, id: data.id, username: data.username,
                        sessionVersion: data.sessionVersion || 1
                    }));
                    window.location.href = "profil.html";
                    return;
                }

                let username = (res.user.displayName || email.split("@")[0]).trim();
                const taken = await getDocs(query(collection(db, "users"), where("username", "==", username)));
                if (!taken.empty) username += Math.floor(100 + Math.random() * 900);
                await createAccount(username, email, "", selectedRegGender, false);
            } catch (e) {
                if (e.code !== "auth/popup-closed-by-user") alert("Google xətası: " + e.message);
            }
        };

        // ====== Şifrəni bərpa et ======
        window.sendFgCode = async function() {
            const email = document.getElementById('fgEmail').value.trim().toLowerCase();
            const btn = document.getElementById('btnSendFgCode');
            if (!isEmail(email)) { alert("Düzgün e-poçt daxil edin!"); return; }
            btn.disabled = true;
            try {
                if (!(await findByEmail(email))) { alert("Bu e-poçtla hesab tapılmadı!"); return; }
                if (await sendCodeTo(email, "fg")) {
                    document.getElementById('fgCodeBox').classList.remove('hidden');
                    alert("Kod e-poçtunuza göndərildi. Spam qovluğuna da baxın.");
                }
            } catch (e) {
                alert("Kod göndərilmədi: " + (e.text || e.message || e));
            } finally { btn.disabled = false; }
        };

        window.resetPassword = async function() {
            const email = document.getElementById('fgEmail').value.trim().toLowerCase();
            const newPass = document.getElementById('fgNewPass').value;
            const btn = document.getElementById('btnReset');
            if (newPass.length < 6) { alert("Yeni şifrə ən az 6 simvol olmalıdır!"); return; }
            if (!checkCode("fg", email, document.getElementById('fgCode').value)) return;
            btn.disabled = true;
            try {
                const d = await findByEmail(email);
                if (!d) { alert("Hesab tapılmadı!"); btn.disabled = false; return; }
                await updateDoc(doc(db, "users", d.id), { password: newPass });
                pending.fg = null;
                alert("Şifrə yeniləndi! İndi daxil ola bilərsiniz.");
                document.getElementById('fgCodeBox').classList.add('hidden');
                document.getElementById('loginUser').value = email;
                switchTab('login');
            } catch (e) {
                alert("Xəta: " + e.message);
            }
            btn.disabled = false;
        };

        // ====== Giriş ======
        window.loginUser = async function() {
            const userInput = document.getElementById('loginUser').value.trim();
            const passwordInput = document.getElementById('loginPass').value;
            const btn = document.getElementById('btnLogin');

            if(!userInput || !passwordInput) { alert("Xanaları doldurun!"); return; }

            btn.disabled = true;
            try {
                const qLower = userInput.toLowerCase();
                const allSnap = await getDocs(collection(db, "users"));
                let matchedDoc = null;

                allSnap.forEach((docSnap) => {
                    if (matchedDoc) return;
                    const data = docSnap.data();
                    const uname = String(data.username || "").trim().toLowerCase();
                    const uid = String(data.id ?? "").trim().toLowerCase();
                    const ucustom = String(data.customId ?? "").trim().toLowerCase();
                    const uemail = String(data.email || "").trim().toLowerCase();

                    const matchesIdentifier =
                        uname === qLower ||
                        uid === qLower ||
                        (uemail && uemail === qLower) ||
                        (ucustom && ucustom === qLower);

                    if (matchesIdentifier && data.password && data.password === passwordInput) {
                        matchedDoc = { docId: docSnap.id, data };
                    }
                });

                if (matchedDoc) {
                    const { docId, data } = matchedDoc;
                    if (data.banned) { alert("Hesabınız bloklanıb!"); btn.disabled = false; return; }
                    localStorage.setItem("currentUser", JSON.stringify({
                        docId: docId, id: data.id, username: data.username,
                        sessionVersion: data.sessionVersion || 1
                    }));
                    window.location.href = "profil.html";
                } else {
                    alert("İstifadəçi adı/ID/e-poçt və ya şifrə yanlışdır!");
                    btn.disabled = false;
                }
            } catch(e) {
                alert("Giriş xətası: " + e.message);
                btn.disabled = false;
            }
        };

        window.goToProfile = function() { window.location.href = "profil.html"; };
    </script>
</body>
</html>
