<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Butulka Baku - Giriş</title>
    <!-- EmailJS SDK (Real mail göndərmək üçün) -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;1,700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: #0b0b0e;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(45, 38, 25, 0.4) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(35, 30, 20, 0.4) 0%, transparent 50%),
                linear-gradient(135deg, #09090b 0%, #141318 50%, #09090b 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #fff;
            overflow-x: hidden;
        }

        /* Mərmər effekti üçün incə tekstura */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(45deg, rgba(255,255,255,0.01) 0px, rgba(255,255,255,0.01) 2px, transparent 2px, transparent 10px);
            pointer-events: none;
            z-index: 0;
        }

        /* Yuxarı Dil Paneli */
        .top-lang-bar {
            width: 100%;
            background: rgba(18, 18, 22, 0.9);
            border-bottom: 1px solid rgba(212, 175, 55, 0.25);
            padding: 12px 15px;
            display: flex;
            justify-content: center;
            gap: 10px;
            z-index: 10;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        .lang-btn {
            background: #141418;
            border: 1px solid rgba(212, 175, 55, 0.35);
            color: #d0d0d0;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }

        .lang-btn.active {
            border-color: #f3d078;
            color: #fff;
            background: linear-gradient(180deg, rgba(212, 175, 55, 0.25), rgba(138, 105, 28, 0.15));
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.35);
        }

        /* Əsas Konteyner */
        .auth-wrapper {
            position: relative;
            z-index: 5;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            margin-top: 55px;
            margin-bottom: 30px;
        }

        /* Taclı Ürək Logosu */
        .logo-badge {
            position: absolute;
            top: -38px;
            left: 50%;
            transform: translateX(-50%);
            width: 96px;
            height: 96px;
            z-index: 10;
            filter: drop-shadow(0 6px 15px rgba(0, 0, 0, 0.8));
        }

        /* Əsas Qızılı Çərçivəli Kart */
        .auth-card {
            background: linear-gradient(180deg, rgba(22, 21, 26, 0.96) 0%, rgba(14, 14, 18, 0.98) 100%);
            border: 1.5px solid #c59b43;
            border-radius: 22px;
            padding: 62px 24px 28px 24px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.85), inset 0 0 20px rgba(212, 175, 55, 0.08);
            text-align: center;
        }

        .brand-title {
            font-size: 28px;
            font-weight: 700;
            font-style: italic;
            color: #f5e6c4;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 10px rgba(212, 175, 55, 0.25);
            margin-bottom: 6px;
        }

        .brand-subtitle {
            font-size: 13px;
            color: #c2b8a3;
            margin-bottom: 22px;
        }

        /* Giriş / Qeydiyyat Tabları */
        .tabs-container {
            display: flex;
            gap: 10px;
            margin-bottom: 22px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid #9e7b32;
            background: transparent;
            color: #e6d8b5;
        }

        .tab-btn.active {
            background: linear-gradient(180deg, #e2be6b 0%, #a88232 100%);
            color: #fff;
            border-color: #f7dc94;
            text-shadow: 0 1px 3px rgba(0,0,0,0.4);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        /* Form Elementləri */
        .form-section {
            display: none;
            text-align: left;
            animation: fadeIn 0.3s ease;
        }

        .form-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            color: #dfd6c5;
            margin-bottom: 7px;
            font-weight: 500;
        }

        .input-box {
            width: 100%;
            height: 46px;
            background: #18171c;
            border: 1px solid #7c622b;
            border-radius: 11px;
            padding: 0 14px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-box:focus {
            border-color: #e6c26e;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.25);
        }

        .input-box::placeholder {
            color: #6b665c;
        }

        /* Mail + Kod Göndər Düyməsi Yan-yana */
        .code-row {
            display: flex;
            gap: 8px;
        }

        .send-code-btn {
            background: linear-gradient(180deg, #3a311d 0%, #241e11 100%);
            border: 1px solid #c59b43;
            color: #f3d078;
            border-radius: 11px;
            padding: 0 14px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
        }

        .send-code-btn:hover {
            background: #c59b43;
            color: #111;
        }

        .send-code-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Əsas Qızılı Düymə (Daxil ol / Qeydiyyat / Təsdiqlə) */
        .gold-submit-btn {
            width: 100%;
            height: 48px;
            margin-top: 8px;
            background: linear-gradient(180deg, #e5c372 0%, #ad8736 100%);
            border: 1px solid #fae19e;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-shadow: 0 1px 3px rgba(0,0,0,0.35);
            box-shadow: 0 5px 18px rgba(197, 155, 67, 0.35);
            transition: transform 0.15s ease, box-shadow 0.2s ease;
        }

        .gold-submit-btn:active {
            transform: scale(0.98);
        }

        /* Şifrəmi unutdum linki */
        .forgot-link-wrap {
            text-align: center;
            margin-top: 15px;
        }

        .forgot-link {
            color: #d4af37;
            font-size: 13px;
            text-decoration: none;
            cursor: pointer;
            border-bottom: 1px dashed rgba(212, 175, 55, 0.5);
            padding-bottom: 2px;
            transition: 0.2s;
        }

        .forgot-link:hover {
            color: #fff;
            border-bottom-color: #fff;
        }

        /* Bildiriş Qutusu */
        .status-msg {
            margin-top: 12px;
            padding: 10px;
            border-radius: 10px;
            font-size: 12.5px;
            text-align: center;
            display: none;
            line-height: 1.4;
        }

        .status-msg.success {
            display: block;
            background: rgba(46, 204, 113, 0.15);
            border: 1px solid #2ecc71;
            color: #a3f7c4;
        }

        .status-msg.error {
            display: block;
            background: rgba(231, 76, 60, 0.15);
            border: 1px solid #e74c3c;
            color: #ffb3ab;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Yuxarı Dil Seçimi -->
    <div class="top-lang-bar">
        <button class="lang-btn active" onclick="setLanguage('az', this)">🇦🇿 Azərbaycanca</button>
        <button class="lang-btn" onclick="setLanguage('ru', this)">🇷🇺 Русский</button>
        <button class="lang-btn" onclick="setLanguage('en', this)">🇬🇧 English</button>
    </div>

    <div class="auth-wrapper">
        <!-- Qızıl Taclı Qırmızı Ürək Logosu (SVG) -->
        <div class="logo-badge">
            <svg viewBox="0 0 120 120" width="100%" height="100%">
                <defs>
                    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#fff0b3"/>
                        <stop offset="40%" stop-color="#d4af37"/>
                        <stop offset="100%" stop-color="#8a6518"/>
                    </linearGradient>
                    <radialGradient id="rubyGrad" cx="40%" cy="35%" r="65%">
                        <stop offset="0%" stop-color="#ff4d6d"/>
                        <stop offset="55%" stop-color="#b8001f"/>
                        <stop offset="100%" stop-color="#59000f"/>
                    </radialGradient>
                </defs>
                <!-- Tac -->
                <path d="M35 34 L30 16 L47 26 L60 11 L73 26 L90 16 L85 34 Z" fill="url(#goldGrad)" stroke="#5e430c" stroke-width="1.5"/>
                <circle cx="30" cy="14" r="3" fill="#fff0b3"/>
                <circle cx="60" cy="9" r="3.5" fill="#fff0b3"/>
                <circle cx="90" cy="14" r="3" fill="#fff0b3"/>
                <rect x="35" y="34" width="50" height="5" rx="2" fill="url(#goldGrad)"/>
                <!-- Xarici Qızıl Ürək Çərçivə -->
                <path d="M60 108 C60 108 16 80 16 52 C16 37 28 28 41 28 C50 28 56 33 60 39 C64 33 70 28 79 28 C92 28 104 37 104 52 C104 80 60 108 60 108 Z" fill="url(#goldGrad)" stroke="#61460e" stroke-width="2"/>
                <!-- Daxili Yaqut Ürək -->
                <path d="M60 99 C60 99 24 75 24 53 C24 42 33 35 43 35 C50 35 56 39 60 45 C64 39 70 35 77 35 C87 35 96 42 96 53 C96 75 60 99 60 99 Z" fill="url(#rubyGrad)" stroke="#f5d57a" stroke-width="2"/>
                <!-- Parıltı -->
                <path d="M34 48 C34 43 39 40 44 41" stroke="rgba(255,255,255,0.6)" stroke-width="3" stroke-linecap="round" fill="none"/>
            </svg>
        </div>

        <div class="auth-card">
            <h1 class="brand-title">Butulka Baku</h1>
            <p class="brand-subtitle" id="txt-subtitle">Hesabına daxil ol və oyuna davam et</p>

            <!-- Tab Düymələri -->
            <div class="tabs-container" id="main-tabs">
                <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Giriş</button>
                <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Qeydiyyat</button>
            </div>

            <!-- 1. GİRİŞ BÖLMƏSİ -->
            <div id="section-login" class="form-section active">
                <div class="input-group">
                    <label id="lbl-login-user">İstifadəçi adı, Mail və ya ID</label>
                    <input type="text" id="login-user" class="input-box" placeholder="Ad, Gmail və ya ID daxil edin">
                </div>
                <div class="input-group">
                    <label id="lbl-login-pass">Şifrə</label>
                    <input type="password" id="login-pass" class="input-box" placeholder="••••••••">
                </div>
                <button class="gold-submit-btn" id="btn-login" onclick="handleLogin()">Daxil ol</button>
                
                <div class="forgot-link-wrap">
                    <a class="forgot-link" id="link-forgot" onclick="switchTab('forgot')">Şifrəmi unutdum</a>
                </div>
            </div>

            <!-- 2. QEYDİYYAT BÖLMƏSİ (Mail / Gmail Təsdiq Kodu ilə) -->
            <div id="section-register" class="form-section">
                <div class="input-group">
                    <label id="lbl-reg-nick">İstifadəçi adı (Nik)</label>
                    <input type="text" id="reg-nick" class="input-box" placeholder="Məs: ALIK 511">
                </div>
                <div class="input-group">
                    <label id="lbl-reg-email">Mail və ya Gmail ünvanı</label>
                    <div class="code-row">
                        <input type="email" id="reg-email" class="input-box" placeholder="numune@gmail.com">
                        <button type="button" class="send-code-btn" id="btn-send-reg-code" onclick="sendVerificationCode('register')">Kod göndər</button>
                    </div>
                </div>
                <div class="input-group">
                    <label id="lbl-reg-code">Mailə gələn təsdiq kodu</label>
                    <input type="text" id="reg-code" class="input-box" maxlength="6" placeholder="6 rəqəmli kodu yazın">
                </div>
                <div class="input-group">
                    <label id="lbl-reg-pass">Yeni Şifrə</label>
                    <input type="password" id="reg-pass" class="input-box" placeholder="Minimum 6 simvol">
                </div>
                <button class="gold-submit-btn" id="btn-register" onclick="handleRegister()">Təsdiqlə və Qeydiyyatdan keç</button>
            </div>

            <!-- 3. ŞİFRƏMİ UNUTDUM BÖLMƏSİ -->
            <div id="section-forgot" class="form-section">
                <div class="input-group">
                    <label id="lbl-forgot-email">Qeydiyyatdan keçdiyiniz Mail və ya Gmail</label>
                    <div class="code-row">
                        <input type="email" id="forgot-email" class="input-box" placeholder="numune@gmail.com">
                        <button type="button" class="send-code-btn" id="btn-send-forgot-code" onclick="sendVerificationCode('forgot')">Kod göndər</button>
                    </div>
                </div>

                <!-- Kod göndərildikdən sonra açılan hissə -->
                <div id="forgot-reset-fields" class="hidden">
                    <div class="input-group">
                        <label id="lbl-forgot-code">Mailə gələn təsdiq kodu</label>
                        <input type="text" id="forgot-code" class="input-box" maxlength="6" placeholder="6 rəqəmli kod">
                    </div>
                    <div class="input-group">
                        <label id="lbl-forgot-newpass">Yeni şifrə təyin edin</label>
                        <input type="password" id="forgot-newpass" class="input-box" placeholder="Yeni şifrənizi yazın">
                    </div>
                    <button class="gold-submit-btn" id="btn-reset-pass" onclick="handlePasswordReset()">Şifrəni yenilə</button>
                </div>

                <div class="forgot-link-wrap">
                    <a class="forgot-link" id="link-back-login" onclick="switchTab('login')">← Girişə qayıt</a>
                </div>
            </div>

            <!-- Bildiriş Mesajı -->
            <div id="status-box" class="status-msg"></div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. EMAILJS AYARLARI (Real Mail Göndərmək Üçün)
        // ==========================================
        // emailjs.com saytından pulsuz qeydiyyatdan keçib bu 3 məlumatı yazsanız,
        // istifadəçilərin Gmail/Mail ünvanına birbaşa real kod gedəcək:
        const EMAILJS_PUBLIC_KEY = "BURAYA_PUBLIC_KEY_YAZIN"; 
        const EMAILJS_SERVICE_ID = "BURAYA_SERVICE_ID_YAZIN";
        const EMAILJS_TEMPLATE_ID = "BURAYA_TEMPLATE_ID_YAZIN";

        if (EMAILJS_PUBLIC_KEY !== "BURAYA_PUBLIC_KEY_YAZIN") {
            emailjs.init(EMAILJS_PUBLIC_KEY);
        }

        // Müvəqqəti təsdiq kodları və istifadəçi bazası (Mövcud Firebase kodunuzla birləşdirilə bilər)
        let generatedCodes = { register: null, forgot: null };
        let targetEmails = { register: "", forgot: "" };

        // Tab Dəyişdirmə
        function switchTab(tab) {
            hideStatus();
            document.querySelectorAll('.form-section').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-login').classList.remove('active');
            document.getElementById('tab-register').classList.remove('active');

            if (tab === 'login') {
                document.getElementById('main-tabs').classList.remove('hidden');
                document.getElementById('section-login').classList.add('active');
                document.getElementById('tab-login').classList.add('active');
            } else if (tab === 'register') {
                document.getElementById('main-tabs').classList.remove('hidden');
                document.getElementById('section-register').classList.add('active');
                document.getElementById('tab-register').classList.add('active');
            } else if (tab === 'forgot') {
                document.getElementById('main-tabs').classList.add('hidden');
                document.getElementById('section-forgot').classList.add('active');
            }
        }

        // Mail / Gmail-ə 6 Rəqəmli Təsdiq Kodu Göndərmək
        function sendVerificationCode(type) {
            const emailInput = type === 'register' ? document.getElementById('reg-email') : document.getElementById('forgot-email');
            const btn = type === 'register' ? document.getElementById('btn-send-reg-code') : document.getElementById('btn-send-forgot-code');
            const email = emailInput.value.trim().toLowerCase();

            if (!email || !email.includes('@') || !email.includes('.')) {
                showStatus("Zəhmət olmasa düzgün Mail və ya Gmail ünvanı daxil edin!", "error");
                return;
            }

            // Şifrə sıfırlamada mailin qeydiyyatda olub-olmadığını yoxla
            let users = JSON.parse(localStorage.getItem('butulka_users') || '[]');
            if (type === 'forgot') {
                const exists = users.find(u => u.email === email);
                if (!exists) {
                    showStatus("Bu Mail/Gmail ünvanı ilə qeydiyyat tapılmadı!", "error");
                    return;
                }
            } else if (type === 'register') {
                const alreadyExists = users.find(u => u.email === email);
                if (alreadyExists) {
                    showStatus("Bu Mail/Gmail artıq qeydiyyatdan keçib!", "error");
                    return;
                }
            }

            // 6 rəqəmli təsadüfi kod yarat
            const code = Math.floor(100000 + Math.random() * 900000).toString();
            generatedCodes[type] = code;
            targetEmails[type] = email;

            if (type === 'forgot') {
                document.getElementById('forgot-reset-fields').classList.remove('hidden');
            }

            // 60 saniyəlik taymer
            btn.disabled = true;
            let sec = 60;
            const timer = setInterval(() => {
                btn.innerText = `${sec}s`;
                sec--;
                if (sec < 0) {
                    clearInterval(timer);
                    btn.disabled = false;
                    btn.innerText = "Kod göndər";
                }
            }, 1000);

            // Real EmailJS göndərişi (Əgər açarlar yazılıbsa)
            if (EMAILJS_PUBLIC_KEY !== "BURAYA_PUBLIC_KEY_YAZIN") {
                emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
                    to_email: email,
                    code: code,
                    site_name: "Butulka Baku"
                }).then(() => {
                    showStatus(`Təsdiq kodu ${email} ünvanına göndərildi!`, "success");
                }, (err) => {
                    showStatus("Mail göndərilərkən xəta oldu: " + JSON.stringify(err), "error");
                });
            } else {
                // Test Rejimi (EmailJS qoşulana qədər kodu ekranda göstərir ki, yoxlaya biləsən)
                showStatus(`✅ ${email} ünvanına təsdiq kodu göndərildi! (Test Kodu: ${code})`, "success");
            }
        }

        // Qeydiyyatı Tamamlamaq
        function handleRegister() {
            const nick = document.getElementById('reg-nick').value.trim();
            const email = document.getElementById('reg-email').value.trim().toLowerCase();
            const code = document.getElementById('reg-code').value.trim();
            const pass = document.getElementById('reg-pass').value.trim();

            if (!nick || !email || !code || !pass) {
                showStatus("Bütün xanaları doldurun!", "error");
                return;
            }
            if (email !== targetEmails.register || code !== generatedCodes.register) {
                showStatus("Mailə gələn təsdiq kodu yanlışdır!", "error");
                return;
            }
            if (pass.length < 6) {
                showStatus("Şifrə ən azı 6 simvoldan ibarət olmalıdır!", "error");
                return;
            }

            let users = JSON.parse(localStorage.getItem('butulka_users') || '[]');
            const newId = Math.floor(10000 + Math.random() * 90000);
            
            const newUser = { id: newId, nick: nick, email: email, pass: pass };
            users.push(newUser);
            localStorage.setItem('butulka_users', JSON.stringify(users));

            // BURADA ÖZ MÖVCUD FIREBASE QEYDİYYAT FUNKSİYANI ÇAĞIRA BİLƏRSƏN:
            // saveUserToFirebase(newUser);

            generatedCodes.register = null;
            showStatus(`Təbriklər ${nick}! Qeydiyyat tamamlandı (ID: ${newId}). İndi daxil ola bilərsiniz.`, "success");
            setTimeout(() => switchTab('login'), 2000);
        }

        // Giriş Etmək
        function handleLogin() {
            const loginInput = document.getElementById('login-user').value.trim().toLowerCase();
            const pass = document.getElementById('login-pass').value.trim();

            if (!loginInput || !pass) {
                showStatus("İstifadəçi adı/Mail və şifrəni daxil edin!", "error");
                return;
            }

            let users = JSON.parse(localStorage.getItem('butulka_users') || '[]');
            const foundUser = users.find(u => 
                (u.nick.toLowerCase() === loginInput || u.email === loginInput || String(u.id) === loginInput) 
                && u.pass === pass
            );

            if (foundUser) {
                showStatus(`Xoş gəldin, ${foundUser.nick}! Oyuna yönləndirilirsiniz...`, "success");
                // BURADA ÖZ OYUN EKRANINI AÇAN FUNKSİYANI ÇAĞIR:
                // openGameLobby(foundUser);
            } else {
                showStatus("Məlumatlar və ya şifrə yanlışdır!", "error");
            }
        }

        // Şifrəni Yeniləmək
        function handlePasswordReset() {
            const email = document.getElementById('forgot-email').value.trim().toLowerCase();
            const code = document.getElementById('forgot-code').value.trim();
            const newPass = document.getElementById('forgot-newpass').value.trim();

            if (email !== targetEmails.forgot || code !== generatedCodes.forgot) {
                showStatus("Təsdiq kodu yanlışdır!", "error");
                return;
            }
            if (newPass.length < 6) {
                showStatus("Yeni şifrə ən azı 6 simvol olmalıdır!", "error");
                return;
            }

            let users = JSON.parse(localStorage.getItem('butulka_users') || '[]');
            const userIndex = users.findIndex(u => u.email === email);
            if (userIndex !== -1) {
                users[userIndex].pass = newPass;
                localStorage.setItem('butulka_users', JSON.stringify(users));
                
                // BURADA FİREBASE-DƏ ŞİFRƏNİ YENİLƏYƏ BİLƏRSƏN:
                // updatePasswordInFirebase(email, newPass);

                generatedCodes.forgot = null;
                showStatus("Şifrəniz uğurla yeniləndi! Yeni şifrə ilə daxil olun.", "success");
                setTimeout(() => switchTab('login'), 2000);
            }
        }

        function showStatus(msg, type) {
            const box = document.getElementById('status-box');
            box.innerText = msg;
            box.className = 'status-msg ' + type;
        }

        function hideStatus() {
            document.getElementById('status-box').className = 'status-msg';
        }
