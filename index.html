<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Butulka Baku - Giriş</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: linear-gradient(135deg, #0d061f, #1a0b36, #2d1254);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: rgba(26, 11, 54, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }
        .logo-title {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #ff758c;
            text-shadow: 0 0 15px rgba(255, 117, 140, 0.6);
            margin-bottom: 25px;
            font-style: italic;
        }
        .tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 14px;
            padding: 5px;
            margin-bottom: 25px;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            cursor: pointer;
            border-radius: 10px;
            font-weight: 600;
            color: #aaa;
            transition: 0.3s;
        }
        .tab.active {
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            color: #fff;
            box-shadow: 0 5px 15px rgba(255, 117, 140, 0.4);
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #ccc;
        }
        .form-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }
        .form-group input:focus {
            border-color: #ff758c;
            box-shadow: 0 0 10px rgba(255, 117, 140, 0.3);
        }
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            border: none;
            border-radius: 14px;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 117, 140, 0.4);
            transition: 0.3s;
        }
        .btn:active { transform: scale(0.98); }
        .form-section { display: none; }
        .form-section.active { display: block; }
        
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #1e1035;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 320px;
            width: 90%;
            border: 1px solid rgba(255,117,140,0.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-title">Butulka Baku</div>
        
        <div class="tabs">
            <div class="tab active" onclick="switchTab('login')">Giriş</div>
            <div class="tab" onclick="switchTab('register')">Qeydiyyat</div>
        </div>

        <!-- GİRİŞ FORMASI -->
        <div id="loginForm" class="form-section active">
            <div class="form-group">
                <label>İstifadəçi adı və ya ID</label>
                <input type="text" id="loginUser" placeholder="İstifadəçi adı və ya ID">
            </div>
            <div class="form-group">
                <label>Şifrə</label>
                <input type="password" id="loginPass" placeholder="••••••••">
            </div>
            <button class="btn" onclick="loginUser()">Daxil ol</button>
        </div>

        <!-- QEYDİYYAT FORMASI -->
        <div id="registerForm" class="form-section">
            <div class="form-group">
                <label>İstifadəçi adı</label>
                <input type="text" id="regUser" placeholder="İstifadəçi adı seç">
            </div>
            <div class="form-group">
                <label>Şifrə (ən azı 6 simvol)</label>
                <input type="password" id="regPass" placeholder="••••••••">
            </div>
            <button class="btn" onclick="registerUser()">Hesab yarat</button>
        </div>
    </div>

    <!-- UĞURLU QEYDİYYAT MODALI -->
    <div id="successModal" class="modal">
        <div class="modal-content">
            <h3 style="color:#ff758c; margin-bottom:15px;">Uğurlu Qeydiyyat!</h3>
            <p style="color:#ccc; margin-bottom:10px;">Sizin unikal ID nömrəniz:</p>
            <h2 id="newIdText" style="color:#fff; margin-bottom:20px;">1836</h2>
            <button class="btn" onclick="goToProfile()">Bağla</button>
        </div>
    </div>

    <!-- Firebase Script Qoşulması -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAANVVrJKhZyaCErn8YFNVTUPF70A9xlmQ",
          authDomain: "butulka-baku-istifadeci-bazasi.firebaseapp.com",
          projectId: "butulka-baku-istifadeci-bazasi",
          storageBucket: "butulka-baku-istifadeci-bazasi.firebasestorage.app",
          messagingSenderId: "52438073026",
          appId: "1:52438073026:web:1c4a0a8d1fc1ce5f78455b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.switchTab = function(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.form-section').forEach(f => f.classList.remove('active'));
            if(tab === 'login') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
        };

        window.registerUser = async function() {
            const username = document.getElementById('regUser').value;
            const password = document.getElementById('regPass').value;

            if(!username || password.length < 6) {
                alert("Zəhmət olmasa adı daxil edin və şifrə ən az 6 simvol olsun!");
                return;
            }

            const uniqueId = Math.floor(10000 + Math.random() * 90000);

            try {
                await addDoc(collection(db, "users"), {
                    username: username,
                    password: password,
                    id: uniqueId,
                    jetons: 1400,
                    hearts: 7200,
                    vip: false,
                    createdAt: new Date()
                });

                localStorage.setItem("currentUser", JSON.stringify({username, id: uniqueId, jetons: 1400, hearts: 7200}));
                document.getElementById('newIdText').innerText = uniqueId;
                document.getElementById('successModal').style.display = 'flex';
            } catch(e) {
                alert("Xəta baş verdi: " + e.message);
            }
        };

        window.loginUser = async function() {
            const userInput = document.getElementById('loginUser').value;
            const passwordInput = document.getElementById('loginPass').value;

            if(!userInput || !passwordInput) {
                alert("Xanaları doldurun!");
                return;
            }

            try {
                const q = query(collection(db, "users"), where("username", "==", userInput));
                const querySnapshot = await getDocs(q);
                
                let found = false;
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    if(data.password === passwordInput) {
                        found = true;
                        localStorage.setItem("currentUser", JSON.stringify(data));
                        window.location.href = "profile.html";
                    }
                });

                if(!found) {
                    alert("İstifadəçi adı və ya şifrə yanlışdır!");
                }
            } catch(e) {
                alert("Giriş xətası: " + e.message);
            }
        };

        window.goToProfile = function() {
            window.location.href = "profile.html";
        };
    </script>
</body>
</html>
